<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tipid logo">
  <defs>
    <!-- Background Gradient: Rich Deep Emerald to Obsidian Forest -->
    <linearGradient id="tipidBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14533C"/>
      <stop offset="45%" stop-color="#0E3828"/>
      <stop offset="100%" stop-color="#061B12"/>
    </linearGradient>

    <!-- Top Ambient Glow -->
    <radialGradient id="topGlow" cx="50%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Rim Highlight -->
    <linearGradient id="rimGlint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Inner Token Ring Glass & Sheen -->
    <linearGradient id="tokenGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="tokenBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Porcelain White to Soft Mint Glyph Gradient -->
    <linearGradient id="glyphSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F6EB"/>
    </linearGradient>

    <!-- Radiant Gold Sparkle Gradient -->
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadows for 3D Tactile Depth -->
    <filter id="emblemDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000D07" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#000D07" flood-opacity="0.35"/>
    </filter>
    <filter id="sparkleDepth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#000D07" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Apple-style Squircle Badge -->
  <rect width="512" height="512" rx="116" fill="url(#tipidBg)"/>
  <rect width="512" height="512" rx="116" fill="url(#topGlow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rimGlint)" stroke-width="2.5"/>

  <!-- Centered Inner Token Ring (Within Maskable Safe Zone) -->
  <circle cx="256" cy="256" r="176" fill="url(#tokenGlass)" stroke="url(#tokenBorder)" stroke-width="2"/>

  <!-- Hero Philippine Peso Mark -->
  <g filter="url(#emblemDepth)" fill="none" stroke="url(#glyphSheen)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Stem -->
    <line x1="211" y1="136" x2="211" y2="366"/>
    <!-- Sculpted P Bowl -->
    <path d="M 211 136 H 279 A 68 68 0 0 1 279 272 H 211"/>
    <!-- Dual Crossbars -->
    <line x1="161" y1="181" x2="353" y2="181"/>
    <line x1="161" y1="227" x2="353" y2="227"/>
  </g>

  <!-- Growth Sparkle Star in Warm Philippine Gold -->
  <path d="M 382 113 Q 382 134 403 134 Q 382 134 382 155 Q 382 134 361 134 Q 382 134 382 113 Z"
        fill="url(#goldSheen)"
        filter="url(#sparkleDepth)"/>
</svg>
