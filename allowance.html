<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Allowance Calculator — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ink: '#15231C', ink2: '#2F4037', paper: '#F1F4EF', paperDim: '#E2E8DE',
                        peso: '#1F6F54', pesoDeep: '#134735', pesoLight: '#2F8E6C', expense: '#B5483B', line: '#D2DDD4',
                    },
                    fontFamily: {
                        display: ['Fraunces', 'serif'], body: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/AllowanceCalculator.js"></script>

    <style>
        :root { --ease-ios: cubic-bezier(0.22, 1, 0.36, 1); --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); }
        body { font-family: 'Inter', sans-serif; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.5s var(--ease-ios) both; }

        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes haloPulse { 0% { transform: scale(0.9); opacity: 0.35; } 70% { opacity: 0; } 100% { transform: scale(1.6); opacity: 0; } }
        .halo-pulse { animation: haloPulse 1.9s var(--ease-ios) infinite; }

        .glass-panel { background: rgba(255,255,255,0.65); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(255,255,255,0.55); }
        html.dark .glass-panel { background: rgba(24,38,31,0.55); border: 1px solid rgba(255,255,255,0.08); }

        .tap-scale { transition: transform 0.18s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.92); }

        @keyframes driftA { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-18px, 14px) scale(1.06); } }
        @keyframes driftB { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(16px, -12px) scale(1.04); } }
        .drift-a { animation: driftA 16s ease-in-out infinite; }
        .drift-b { animation: driftB 19s ease-in-out infinite; }

        .grain { position: fixed; inset: 0; z-index: -5; pointer-events: none; opacity: 0.05; mix-blend-mode: multiply; }
        html.dark .grain { opacity: 0.07; mix-blend-mode: overlay; }

        .switch-track { transition: background-color 0.25s var(--ease-ios); }
        .switch-thumb { transition: transform 0.3s var(--ease-spring); }

        /* --- Modern Allowance Hero / Mascot --- */
        @keyframes allowanceMascotFloat {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(-1deg); }
            50% { transform: translate3d(0, -8px, 0) rotate(1deg); }
        }
        @keyframes allowanceGlow {
            0%, 100% { transform: scale(0.94); opacity: 0.20; }
            50% { transform: scale(1.06); opacity: 0.34; }
        }

        .allowance-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 240px;
            border-radius: 28px;
            margin-bottom: 26px;
            padding: 26px 24px 22px;
            background:
                radial-gradient(circle at 18% 0%, rgba(255,255,255,0.08), transparent 28%),
                radial-gradient(circle at 96% 100%, rgba(201,147,46,0.16), transparent 34%),
                linear-gradient(135deg, #2F8E6C 0%, #1F6F54 48%, #123D2E 100%);
            box-shadow: 0 24px 50px -22px rgba(18,61,46,0.55);
        }

        .allowance-hero::before {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            right: -80px;
            bottom: -150px;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            filter: blur(10px);
        }

        .allowance-copy {
            position: relative;
            z-index: 4;
            max-width: 60%;
            padding-right: 48px;
        }

        .allowance-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: rgba(241,244,239,0.72);
            font: 700 10px/1.2 'JetBrains Mono', monospace;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .allowance-kicker::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #C9932E;
            box-shadow: 0 0 0 4px rgba(201,147,46,0.10);
        }

        .allowance-title {
            margin: 0;
            color: #F7FAF7;
            font: 700 clamp(2rem, 4vw, 2.7rem)/1.03 'Fraunces', serif;
            letter-spacing: -0.03em;
        }

        .allowance-subtitle {
            margin-top: 10px;
            max-width: 365px;
            color: rgba(247,250,247,0.72);
            font: 500 12px/1.55 'Inter', sans-serif;
        }

        .allowance-actions {
            position: absolute;
            z-index: 6;
            top: 18px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .allowance-action {
            width: 46px;
            height: 46px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            color: #F7FAF7;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.24);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .allowance-mascot-stage {
            position: absolute;
            z-index: 3;
            right: 10px;
            bottom: -10px;
            width: 220px;
            height: 198px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
        }

        .allowance-mascot-stage::before {
            content: "";
            position: absolute;
            width: 135px;
            height: 135px;
            right: 32px;
            bottom: 16px;
            border-radius: 999px;
            background: rgba(255,255,255,0.10);
            filter: blur(28px);
            animation: allowanceGlow 3.8s ease-in-out infinite;
        }

        .allowance-mascot-stage::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 18px;
            right: 34px;
            bottom: 4px;
            border-radius: 999px;
            background: rgba(0,0,0,0.18);
            filter: blur(8px);
        }

        .allowance-mascot {
            width: 206px;
            height: 206px;
            object-fit: contain;
            object-position: center bottom;
            position: relative;
            z-index: 2;
            animation: allowanceMascotFloat 4.8s ease-in-out infinite;
            filter: drop-shadow(0 15px 18px rgba(0,0,0,0.18));
            user-select: none;
        }

        .allowance-bubble {
            position: absolute;
            z-index: 5;
            right: 130px;
            bottom: 112px;
            max-width: 132px;
            padding: 8px 10px;
            border-radius: 14px;
            background: #F8FAF8;
            color: #15231C;
            box-shadow: 0 16px 28px -16px rgba(0,0,0,0.35);
            font: 600 10px/1.35 'Inter', sans-serif;
        }

        .allowance-bubble::after {
            content: "";
            position: absolute;
            right: 10px;
            bottom: -8px;
            width: 14px;
            height: 14px;
            background: #F8FAF8;
            transform: rotate(45deg);
            border-radius: 2px;
        }

        .allowance-bubble strong {
            display: block;
            font-size: 10px;
            margin-bottom: 1px;
        }

        .allowance-calculator-shell {
            position: relative;
            z-index: 2;
        }

        @media (max-width: 640px) {
            .allowance-hero {
                min-height: 270px;
                border-radius: 24px;
                padding: 22px 20px;
            }

            .allowance-copy {
                max-width: 66%;
                padding-right: 12px;
            }

            .allowance-title {
                font-size: 2rem;
            }

            .allowance-mascot-stage {
                right: -10px;
                bottom: -14px;
                width: 170px;
                height: 158px;
            }

            .allowance-mascot {
                width: 165px;
                height: 165px;
            }

            .allowance-bubble {
                right: 98px;
                bottom: 102px;
                max-width: 110px;
                font-size: 9px;
            }

            .allowance-actions {
                top: 14px;
                right: 14px;
            }

            .allowance-action {
                width: 40px;
                height: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up, .spin, .halo-pulse, .drift-a, .drift-b, .switch-track, .switch-thumb,
            .tap-scale, .allowance-mascot, .allowance-mascot-stage::before {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper min-h-screen flex flex-col transition-colors duration-300">

    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
        <filter id="grainFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
        <rect width="100%" height="100%" filter="url(#grainFilter)"/>
    </svg>

    <div id="root"></div>

    <script type="text/babel">
        window.Icons = {
            Sun: ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/></svg>,
            Moon: ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
        };
        const Icons = window.Icons;

        window.Logo = window.Logo || (({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-peso">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
            </svg>
        ));

        window.peso = (num) => {
            if (isNaN(num)) return "0.00";
            return Number(num).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        window.CATEGORIES = window.CATEGORIES || ["Pagkain", "Pamasahe", "Bills", "Load", "Ipon", "Project Components", "Iba pa"];

        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="drift-a absolute -top-24 -right-16 w-[360px] h-[360px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[90px]" />
                    <div className="drift-b absolute bottom-0 -left-24 w-[380px] h-[380px] bg-pesoLight/10 dark:bg-pesoLight/5 rounded-full blur-[100px]" />
                </div>
            );
        }

        function DarkModeSwitch({ darkMode, onToggle }) {
            return (
                <button
                    onClick={onToggle}
                    aria-label={darkMode ? "Lumipat sa light mode" : "Lumipat sa dark mode"}
                    aria-pressed={darkMode}
                    className={`switch-track tap-scale relative w-[52px] h-8 rounded-full border flex items-center px-1 shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-peso/50 ${
                        darkMode ? "bg-ink2 border-white/10" : "bg-white/90 border-line"
                    }`}
                >
                    <span
                        className={`switch-thumb absolute top-0.5 left-0.5 w-7 h-7 rounded-full bg-white dark:bg-paper shadow-md flex items-center justify-center ${
                            darkMode ? "translate-x-[20px]" : "translate-x-0"
                        }`}
                    >
                        {darkMode ? <Icons.Moon size={14} /> : <Icons.Sun size={14} />}
                    </span>
                </button>
            );
        }

        function AllowancePage() {
            const { useState, useEffect } = React;
            const [user, setUser] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [componentsReady, setComponentsReady] = useState(false);

            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem("tipid_theme") === "dark" || (!localStorage.getItem("tipid_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
            });

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem("tipid_theme", "dark");
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem("tipid_theme", "light");
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.AllowanceCalculator && window.Navbar) {
                        setComponentsReady(true);
                        clearInterval(interval);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                let unsub = null;
                let isMounted = true;

                const checkAuth = () => {
                    if (window.TipidAuth) {
                        unsub = window.TipidAuth.onChange((currentUser) => {
                            if (!isMounted) return;
                            if (!currentUser) window.location.href = "./login.html";
                            else { setUser(currentUser); setAuthChecking(false); }
                        });
                    } else setTimeout(checkAuth, 50);
                };

                checkAuth();
                return () => { isMounted = false; if (typeof unsub === "function") unsub(); };
            }, []);

            const handleLogout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "./login.html";
            };

            if (authChecking || !componentsReady) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <AmbientBackground />
                        <div className="glass-panel fade-up flex flex-col items-center gap-4 rounded-[28px] px-10 py-9 shadow-sm">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/20 halo-pulse" />
                                <div className="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-peso/15 to-pesoLight/5 dark:from-pesoLight/25 dark:to-pesoLight/5 border border-peso/15 text-peso dark:text-pesoLight flex items-center justify-center font-display font-bold text-lg">
                                    T
                                </div>
                                <span className="absolute w-8 h-8 rounded-full border-2 border-peso border-t-transparent spin" style={{ top: '-6px', right: '-6px' }} />
                            </div>
                            <p className="text-xs font-mono uppercase tracking-wider text-ink2/50 dark:text-paper/40">Ina-ayos ang calculator mo...</p>
                        </div>
                    </div>
                );
            }

            const AppAllowance = window.AllowanceCalculator;
            const AppNavbar = window.Navbar;

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />

                    <AppNavbar user={user} onLogout={handleLogout} activeTab="allowance" />

                    <main
                        className="max-w-4xl mx-auto w-full px-5 sm:px-6 pt-32 md:pt-14 pb-40 md:pb-16 flex-1"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(env(safe-area-inset-left) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(env(safe-area-inset-right) + 1.25rem))',
                            paddingBottom: 'calc(10rem + env(safe-area-inset-bottom, 0px))',
                        }}
                    >
                        <div className="fade-up">
                            <div className="allowance-hero">
                                <div className="allowance-copy">
                                    <div className="allowance-kicker">Tipid Buddy</div>
                                    <h1 className="allowance-title">Allowance Calculator</h1>
                                    <p className="allowance-subtitle">
                                        Planuhin ang pang-araw-araw na budget para alam mo kung magkano ang puwedeng gastusin at magkano ang puwedeng itabi.
                                    </p>
                                </div>

                                <div className="allowance-actions">
                                    <DarkModeSwitch darkMode={darkMode} onToggle={toggleDarkMode} />
                                </div>

                                <div className="allowance-bubble">
                                    <strong>Kaya mo 'yan!</strong>
                                    Tipid lang. 💚
                                </div>

                                <div className="allowance-mascot-stage" aria-hidden="true">
                                    <img
                                        src="/assets/allowance_mascot.png"
                                        alt="Tipid Buddy"
                                        className="allowance-mascot"
                                        draggable="false"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="allowance-calculator-shell fade-up" style={{ animationDelay: "60ms" }}>
                            <AppAllowance user={user} />
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<AllowancePage />);
    </script>
</body>
</html>
