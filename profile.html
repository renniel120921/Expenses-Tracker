    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F8F9F7',
                        paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#E2E8E4',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.04), 0 16px 32px -12px rgba(18,61,46,0.1)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html { background: #F8F9F7; transition: background-color 0.3s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; }
        body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .slide-in { animation: slideInRight 0.4s var(--ease-ios) both; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.6s var(--ease-ios) both; }

        .spin { animation: spin 0.85s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 2px; border-radius: 6px; }
        html.dark :focus-visible { outline-color: #52C8A1; }

        .swal2-popup.tipid-swal { border-radius: 24px !important; font-family: 'Inter', sans-serif !important; }

        .toggle-track { transition: background-color 0.2s var(--ease-ios); }
        .toggle-knob { transition: transform 0.2s var(--ease-spring, cubic-bezier(0.34,1.56,0.64,1)); }
    </style>
</head>

        window.Logo = function Logo({ size = 30, className = "" }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} className={`rounded-md ${className}`} style={{ width: size, height: size }} />;
            }
            return <span style={{ width: size, height: size }} className={`rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold ${className}`}>₱</span>;
        }

        window.useAuthReady = function() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        window.useDataReady = function() {
            const [ready, setReady] = React.useState(!!window.TipidData);
            React.useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }

        function swalSuccess(title, text) { return Swal.fire({ icon: "success", title, text, confirmButtonText: "Sige", confirmButtonColor: "#1F6F54", customClass: { popup: "tipid-swal" }}); }
        function swalError(text) { return Swal.fire({ icon: "error", title: "Error", text, confirmButtonText: "Sige", confirmButtonColor: "#B5483B", customClass: { popup: "tipid-swal" }}); }

    <script type="text/babel" src="./components/navbar.js"></script>

    <script type="text/babel">

        // ---- UI COMPONENTS ---- //

        function MenuSection({ title, children }) {
            return (
                <div className="mb-7">
                    <h3 className="text-[13px] font-semibold text-ink2/50 dark:text-paper/40 px-4 mb-2">{title}</h3>
                    <div className="bg-white dark:bg-[#1A2620] rounded-2xl shadow-ios overflow-hidden border border-line dark:border-white/5">
                        {children}
                    </div>
                </div>
            );
        }

        function MenuItem({ icon, label, trailing, onClick, isDestructive, hideChevron, isLast }) {
            return (
                <button
                    onClick={onClick}
                    className={`w-full flex items-center justify-between px-4 py-4 bg-transparent hover:bg-black/[0.02] dark:hover:bg-white/[0.02] transition-colors ${!isLast ? 'border-b border-line dark:border-white/5' : ''}`}
                >
                    <div className="flex items-center gap-3.5">
                        <span className={`flex items-center justify-center ${isDestructive ? 'text-expense' : 'text-ink2/60 dark:text-paper/60'}`}>
                            {icon}
                        </span>
                        <span className={`text-[15px] font-medium ${isDestructive ? 'text-expense' : 'text-ink dark:text-paper'}`}>
                            {label}
                        </span>
                    </div>
                    <div className="flex items-center gap-2">
                        {trailing && <span className="text-[13px] text-ink2/40 dark:text-paper/40">{trailing}</span>}
                        {!hideChevron && <window.Icons.ChevronRight size={18} className="text-ink2/30 dark:text-paper/30" />}
                    </div>
                </button>
            );
        }

        // A real interactive switch (was a static div before — decorative,
        // always "on", no click handler). Used by the Notifications sub-page.
        function Switch({ checked, onChange, label }) {
            return (
                <button
                    role="switch"
                    aria-checked={checked}
                    aria-label={label}
                    onClick={onChange}
                    className={`toggle-track w-12 h-7 rounded-full relative shadow-inner shrink-0 ${checked ? 'bg-peso dark:bg-pesoLight' : 'bg-black/15 dark:bg-white/15'}`}
                >
                    <div className={`toggle-knob absolute top-1 w-5 h-5 bg-white rounded-full shadow-sm ${checked ? 'translate-x-[22px]' : 'translate-x-1'}`}></div>
                </button>
            );
        }

        // Sub-page layout container
        function SubPage({ title, onBack, children, backLabel = "Bumalik" }) {
            return (
                <div className="fixed inset-0 z-50 bg-paper dark:bg-ink flex flex-col slide-in">
                    <div className="flex items-center justify-between px-4 pt-[calc(env(safe-area-inset-top)+16px)] pb-4 border-b border-line dark:border-white/10 bg-white dark:bg-[#1A2620]">
                        <button onClick={onBack} className="p-2 -ml-2 text-peso dark:text-pesoLight flex items-center gap-1 active:opacity-50 transition-opacity">
                            <window.Icons.ChevronLeft size={22} />
                            <span className="text-[15px] font-medium">{backLabel}</span>
                        </button>
                        <h2 className="font-semibold text-ink dark:text-paper absolute left-1/2 -translate-x-1/2">{title}</h2>
                        <div className="w-16"></div> {/* Spacer for centering */}
                    </div>
                    <div className="flex-1 overflow-y-auto p-5">
                        <div className="max-w-[600px] mx-auto w-full">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        // Input Field Component for Sub-pages
        function InputField({ label, icon, type = "text", value, onChange, placeholder, disabled }) {
            return (
                <div className="mb-4">
                    <label className="block text-[12px] font-semibold text-ink2/60 dark:text-paper/60 mb-2 pl-1">{label}</label>
                    <div className="flex items-center gap-3 bg-white dark:bg-[#1A2620] ring-1 ring-line dark:ring-white/10 rounded-xl px-4 focus-within:ring-2 focus-within:ring-peso/50 transition-all">
                        {icon && <span className="text-ink2/40 dark:text-paper/40">{icon}</span>}
                        <input
                            type={type}
                            value={value}
                            onChange={onChange}
                            placeholder={placeholder}
                            disabled={disabled}
                            className="w-full bg-transparent py-3.5 text-[15px] font-medium text-ink dark:text-paper placeholder-ink2/30 focus:outline-none disabled:opacity-50"
                        />
                    </div>
                </div>
            );
        }

        // Selectable row list, used by Default Wallet / Language sub-pages
        function OptionList({ options, value, onSelect }) {
            return (
                <div className="bg-white dark:bg-[#1A2620] rounded-2xl shadow-sm border border-line dark:border-white/5 overflow-hidden">
                    {options.map((opt, i) => (
                        <button
                            key={opt.value}
                            onClick={() => onSelect(opt.value)}
                            className={`w-full flex items-center justify-between px-4 py-3.5 text-left hover:bg-black/[0.02] dark:hover:bg-white/[0.02] transition-colors ${i !== options.length - 1 ? 'border-b border-line dark:border-white/5' : ''}`}
                        >
                            <span className="text-[15px] font-medium text-ink dark:text-paper">{opt.label}</span>
                            {value === opt.value && <window.Icons.Check size={18} className="text-peso dark:text-pesoLight" />}
                        </button>
                    ))}
                </div>
            );
        }

        const COMMON_WALLETS = ["Cash", "GCash", "Maya", "ShopeePay", "GrabPay", "BDO", "BPI", "Iba pa"];

        async function getFirebaseHandles() {
            const [{ app }, authMod] = await Promise.all([
                import("./firebase.js"),
                import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js"),
            ]);
            const auth = authMod.getAuth(app);
            return { app, auth, authMod };
        }

        // --- MAIN APP COMPONENT --- //
        function ProfileApp() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();

            // States
            const [user, setUser] = React.useState(undefined);
            const [activeMenu, setActiveMenu] = React.useState(null); // null = main menu
            const [isDark, setIsDark] = React.useState(() => document.documentElement.classList.contains('dark'));

            // Form States
            const [displayName, setDisplayName] = React.useState("");
            const [savingProfile, setSavingProfile] = React.useState(false);

            const [budgetInput, setBudgetInput] = React.useState("");
            const [goalName, setGoalName] = React.useState("");
            const [goalAmount, setGoalAmount] = React.useState("");
            const [savingGoals, setSavingGoals] = React.useState(false);

            // Preference states (local-only, mirror the existing Theme pattern)
            const [lang, setLang] = React.useState(() => localStorage.getItem('tipid_lang') || 'tl');
            const [defaultWallet, setDefaultWallet] = React.useState(() => localStorage.getItem('tipid_default_wallet') || 'Cash');
            const [hideCentavos, setHideCentavos] = React.useState(() => localStorage.getItem('tipid_hide_centavos') === '1');

            // Notification preferences — previously rendered as always-on
            // decorative switches with no click handler. Now real, local-only
            // toggles (no push backend exists yet, so this just gates whether
            // this device's reminder/alert logic — once built — should fire).
            const [notifDaily, setNotifDaily] = React.useState(() => localStorage.getItem('tipid_notif_daily') !== '0');
            const [notifOverbudget, setNotifOverbudget] = React.useState(() => localStorage.getItem('tipid_notif_overbudget') !== '0');

            // Data export / danger zone states
            const [exporting, setExporting] = React.useState(false);
            const [feedbackText, setFeedbackText] = React.useState("");
            const [sendingFeedback, setSendingFeedback] = React.useState(false);
            const [deleteConfirmText, setDeleteConfirmText] = React.useState("");
            const [deletingAccount, setDeletingAccount] = React.useState(false);

            const t = window.TIPID_TRANSLATIONS[lang] || window.TIPID_TRANSLATIONS.tl;

            // Fetch Auth
            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => {
                    setUser(u || null);
                    if (u) setDisplayName(u.displayName || "");
                });
            }, [authReady]);

            // Redirect if not logged in
            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            // Fetch Budget Data
            React.useEffect(() => {
                if (!dataReady || !user) return;
                return window.TipidData.subscribeBudget(
                    user.uid,
                    (b) => setBudgetInput(b ? b.toString() : ""),
                    (err) => console.error(err)
                );
            }, [dataReady, user]);

            // Fetch Local Goals Data
            React.useEffect(() => {
                setGoalName(localStorage.getItem('tipid_goal_name') || "");
                setGoalAmount(localStorage.getItem('tipid_goal_amount') || localStorage.getItem('tipid_goal') || "");
            }, []);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <window.Icons.Loader size={32} className="spin text-peso" />
                    </div>
                );
            }

            const initial = displayName ? displayName.charAt(0).toUpperCase() : (user.email.charAt(0).toUpperCase());

            // Derived, read-only account facts (from the Firebase user object already on hand)
            const providerId = user.providerData && user.providerData[0] ? user.providerData[0].providerId : "password";
            const providerLabel = providerId.includes("google") ? "Google" : providerId.includes("facebook") ? "Facebook" : "Email";
            const memberSince = user.metadata && user.metadata.creationTime
                ? new Date(user.metadata.creationTime).toLocaleDateString("en-PH", { year: "numeric", month: "long" })
                : null;

            // Actions
            const toggleDarkMode = () => {
                const newMode = !isDark;
                if (newMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('tipid_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('tipid_theme', 'light');
                }
                setIsDark(newMode);
            };

            const handleLogout = async () => {
                Swal.fire({
                    title: 'Log out?',
                    text: 'Sigurado ka bang gusto mong mag-log out?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#B5483B',
                    cancelButtonColor: '#33443A',
                    confirmButtonText: 'Oo, Log out',
                    cancelButtonText: 'Kanselahin',
                    customClass: { popup: 'tipid-swal' }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        await window.TipidAuth.logOut();
                        window.location.href = "login.html";
                    }
                });
            };

            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                if (!displayName.trim()) return swalError("Paki-lagay ang iyong pangalan.");
                setSavingProfile(true);
                try {
                    const { auth, authMod } = await getFirebaseHandles();
                    const liveUser = auth.currentUser || user;
                    await authMod.updateProfile(liveUser, { displayName: displayName.trim() });
                    setUser({ ...user, displayName: displayName.trim() });
                    swalSuccess("Tagumpay", "Na-update na ang iyong pangalan.");
                } catch (err) {
                    swalError("Hindi ma-update ang profile. Subukan ulit.");
                } finally {
                    setSavingProfile(false);
                }
            };

            const handleUpdatePreferences = async (e) => {
                e.preventDefault();
                const amt = parseFloat(budgetInput);
                const targetAmt = parseFloat(goalAmount);
                if (isNaN(amt) || amt <= 0) return swalError("Maglagay ng tamang halaga para sa budget.");

                setSavingGoals(true);
                try {
                    await window.TipidData.setBudget(user.uid, amt);
                    if (goalName.trim()) localStorage.setItem('tipid_goal_name', goalName.trim());
                    if (!isNaN(targetAmt) && targetAmt > 0) {
                        localStorage.setItem('tipid_goal_amount', targetAmt.toString());
                        localStorage.setItem('tipid_goal', targetAmt.toString());
                    }
                    swalSuccess("Tagumpay", "Na-update na ang iyong Financial Goals.");
                } catch (err) {
                    swalError("Hindi ma-save. Subukan ulit.");
                } finally {
                    setSavingGoals(false);
                }
            };

            // Persist simple local-only preferences (mirrors the existing toggleDarkMode pattern).
            // `lang` change is what makes `t` above resolve a different dictionary on re-render —
            // that's what actually makes language selection visible now.
            const handleSelectLang = (val) => {
                setLang(val);
                localStorage.setItem('tipid_lang', val);
            };
            const handleSelectDefaultWallet = (val) => {
                setDefaultWallet(val);
                localStorage.setItem('tipid_default_wallet', val);
                setActiveMenu(null);
            };
            // This flag is read by window.peso() on the other pages (Utang,
            // Chart, History, Hulugan) to decide whether to show centavos —
            // toggling it here now actually changes how amounts render there.
            const toggleHideCentavos = () => {
                const next = !hideCentavos;
                setHideCentavos(next);
                localStorage.setItem('tipid_hide_centavos', next ? '1' : '0');
            };
            const toggleNotifDaily = () => {
                const next = !notifDaily;
                setNotifDaily(next);
                localStorage.setItem('tipid_notif_daily', next ? '1' : '0');
            };
            const toggleNotifOverbudget = () => {
                const next = !notifOverbudget;
                setNotifOverbudget(next);
                localStorage.setItem('tipid_notif_overbudget', next ? '1' : '0');
            };

            // Export all of the user's entries as a CSV file — one-shot read via the
            // existing TipidData.subscribeEntries contract (unsubscribes as soon as data arrives).
            const handleExportData = () => {
                if (!window.TipidData || !window.TipidData.subscribeEntries) {
                    return swalError("Hindi available ang data export sa ngayon.");
                }
                setExporting(true);
                let unsub = () => {};
                unsub = window.TipidData.subscribeEntries(
                    user.uid,
                    (list) => {
                        unsub();
                        setExporting(false);
                        if (!list || list.length === 0) {
                            return Swal.fire({ icon: "info", title: "Wala pang datos", text: "Wala ka pang naitatalang gastos o kita.", confirmButtonColor: "#1F6F54", customClass: { popup: "tipid-swal" } });
                        }
                        const header = ["date", "type", "category", "method", "amount", "note"];
                        const rows = list.map(e => header.map(k => {
                            const v = e[k] !== undefined && e[k] !== null ? String(e[k]).replace(/"/g, '""') : "";
                            return `"${v}"`;
                        }).join(","));
                        const csv = [header.join(","), ...rows].join("\n");
                        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = `tipid-entries-${new Date().toISOString().slice(0, 10)}.csv`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        URL.revokeObjectURL(url);
                        swalSuccess("Na-export!", "Na-download na ang iyong datos bilang CSV.");
                    },
                    () => { unsub(); setExporting(false); swalError("Hindi na-export ang datos. Subukan ulit."); }
                );
            };

            // Clear only the app's local-storage preferences (does not touch cloud data)
            const handleClearLocalPrefs = () => {
                Swal.fire({
                    title: "I-clear ang lokal na preferences?",
                    text: "Mabubura ang iyong naka-save na Goal, Default Wallet, at Display settings sa device na ito. Hindi maaapektuhan ang iyong datos sa cloud.",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#B5483B",
                    cancelButtonColor: "#33443A",
                    confirmButtonText: "Oo, i-clear",
                    cancelButtonText: "Kanselahin",
                    customClass: { popup: "tipid-swal" }
                }).then((result) => {
                    if (!result.isConfirmed) return;
                    ["tipid_goal_name", "tipid_goal_amount", "tipid_goal", "tipid_default_wallet", "tipid_hide_centavos", "tipid_lang", "tipid_notif_daily", "tipid_notif_overbudget"].forEach(k => localStorage.removeItem(k));
                    setGoalName(""); setGoalAmount(""); setDefaultWallet("Cash"); setHideCentavos(false); setLang("tl");
                    setNotifDaily(true); setNotifOverbudget(true);
                    swalSuccess("Nabura na", "Na-reset na ang mga lokal na preferences.");
                });
            };

            // Feedback (no backend endpoint exists yet, so this is stored locally and
            // acknowledged — swap the localStorage write for a real API/Firestore call
            // once a feedback collection exists).
            const handleSendFeedback = (e) => {
                e.preventDefault();
                if (!feedbackText.trim()) return swalError("Maglagay muna ng mensahe.");
                setSendingFeedback(true);
                try {
                    const key = "tipid_feedback_log";
                    const existing = JSON.parse(localStorage.getItem(key) || "[]");
                    existing.push({ text: feedbackText.trim(), at: new Date().toISOString() });
                    localStorage.setItem(key, JSON.stringify(existing.slice(-20)));
                    setFeedbackText("");
                    swalSuccess("Salamat!", "Natanggap ang iyong feedback.");
                } finally {
                    setSendingFeedback(false);
                }
            };

            // Delete account — reuses the same dynamic-import pattern as handleUpdateProfile
            const handleDeleteAccount = async () => {
                if (deleteConfirmText.trim().toUpperCase() !== "DELETE") {
                    return swalError('I-type ang salitang "DELETE" para kumpirmahin.');
                }
                setDeletingAccount(true);
                try {
                    const { auth, authMod } = await getFirebaseHandles();
                    const liveUser = auth.currentUser || user;
                    await authMod.deleteUser(liveUser);
                    window.location.href = "login.html";
                } catch (err) {
                    if (err && err.code === "auth/requires-recent-login") {
                        swalError("Kailangan mo munang mag-log out at mag-log in ulit bago tanggalin ang account, para sa seguridad.");
                    } else {
                        swalError("Hindi natanggal ang account. Subukan ulit.");
                    }
                } finally {
                    setDeletingAccount(false);
                }
            };

            // ---- RENDER SUB-PAGES ---- //

            if (activeMenu === 'profile') {
                return (
                    <SubPage title={t.menuManageProfile} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <form onSubmit={handleUpdateProfile} className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-line dark:border-white/5">
                            <InputField
                                label="Display Name"
                                icon={<window.Icons.User size={18} />}
                                value={displayName}
                                onChange={e => setDisplayName(e.target.value)}
                                placeholder="Pangalan mo"
                            />
                            <InputField
                                label="Email Address"
                                icon={<window.Icons.Globe size={18} />}
                                value={user.email}
                                disabled={true}
                            />
                            <button type="submit" disabled={savingProfile} className="w-full mt-4 bg-peso hover:bg-pesoLight text-white font-semibold py-3.5 rounded-xl transition-colors disabled:opacity-50">
                                {savingProfile ? "Nagsa-save..." : "I-save ang Profile"}
                            </button>
                        </form>
                    </SubPage>
                );
            }

            if (activeMenu === 'goals') {
                return (
                    <SubPage title={t.menuFinancialGoals} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <form onSubmit={handleUpdatePreferences} className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-line dark:border-white/5">
                            <p className="text-[13px] text-ink2/60 dark:text-paper/60 mb-6">I-set ang iyong buwanang limitasyon sa paggastos at ang pinag-iipunan mo.</p>
                            <InputField
                                label="Buwanang Budget Limit (₱)"
                                icon={<window.Icons.Wallet size={18} />}
                                type="number"
                                value={budgetInput}
                                onChange={e => setBudgetInput(e.target.value)}
                                placeholder="Hal: 10000"
                            />
                            <InputField
                                label="Pangalan ng Pinag-iipunan"
                                icon={<window.Icons.Target size={18} />}
                                value={goalName}
                                onChange={e => setGoalName(e.target.value)}
                                placeholder="Hal: Emergency Fund, Bagong Phone"
                            />
                            <InputField
                                label="Target Amount (₱)"
                                icon={<span className="font-mono text-[16px]">₱</span>}
                                type="number"
                                value={goalAmount}
                                onChange={e => setGoalAmount(e.target.value)}
                                placeholder="Hal: 50000"
                            />
                            <button type="submit" disabled={savingGoals} className="w-full mt-4 bg-gold hover:bg-[#D4A03A] text-ink font-semibold py-3.5 rounded-xl transition-colors disabled:opacity-50">
                                {savingGoals ? "Nagsa-save..." : "I-save ang Goals"}
                            </button>
                        </form>
                    </SubPage>
                );
            }

            if (activeMenu === 'security') {
                return (
                    <SubPage title={t.menuPasswordSecurity} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <div className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-line dark:border-white/5 text-center">
                            <div className="w-16 h-16 bg-black/5 dark:bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 text-ink2/40 dark:text-paper/40">
                                <window.Icons.Lock size={28} />
                            </div>
                            <h3 className="font-semibold text-[16px] text-ink dark:text-paper mb-2">I-secure ang iyong Account</h3>
                            <p className="text-[13px] text-ink2/60 dark:text-paper/60 mb-6">Kung gumamit ka ng Google sa pag-login, hindi mo na kailangang mag-alala sa password. Kung gumamit ka ng email, maaari kang mag-request ng password reset.</p>
                            <button onClick={() => swalSuccess('Email Sent', 'Kunwari ay nagpadala kami ng reset link sa iyong email!')} className="w-full bg-black/5 dark:bg-white/10 text-ink dark:text-paper font-semibold py-3.5 rounded-xl hover:bg-black/10 dark:hover:bg-white/20 transition-colors">
                                Magpadala ng Reset Link
                            </button>
                        </div>
                    </SubPage>
                );
            }

            if (activeMenu === 'notifications') {
                return (
                    <SubPage title={t.menuNotifications} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <div className="bg-white dark:bg-[#1A2620] p-2 rounded-2xl shadow-sm border border-line dark:border-white/5 divide-y divide-line dark:divide-white/5">
                            <div className="flex items-center justify-between p-4">
                                <div>
                                    <p className="font-medium text-[15px] text-ink dark:text-paper">Daily Reminders</p>
                                    <p className="text-[12px] text-ink2/50 dark:text-paper/50 mt-0.5">Paalala para mag-log ng gastos araw-araw</p>
                                </div>
                                <Switch checked={notifDaily} onChange={toggleNotifDaily} label="Daily Reminders" />
                            </div>
                            <div className="flex items-center justify-between p-4">
                                <div>
                                    <p className="font-medium text-[15px] text-ink dark:text-paper">Overbudget Alerts</p>
                                    <p className="text-[12px] text-ink2/50 dark:text-paper/50 mt-0.5">I-notify ka kapag malapit na maubos ang budget</p>
                                </div>
                                <Switch checked={notifOverbudget} onChange={toggleNotifOverbudget} label="Overbudget Alerts" />
                            </div>
                        </div>
                    </SubPage>
                );
            }

            if (activeMenu === 'about') {
                return (
                    <SubPage title={t.menuAboutUs} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <div className="bg-white dark:bg-[#1A2620] p-8 rounded-2xl shadow-sm border border-line dark:border-white/5 text-center">
                            <window.Logo size={64} className="mx-auto mb-4" />
                            <h2 className="font-display font-bold text-2xl text-ink dark:text-paper mb-1">Tipid Buddy</h2>
                            <p className="text-[12px] font-mono text-ink2/50 dark:text-paper/40 mb-6">Version 1.0.0</p>
                            <p className="text-[14px] text-ink2/70 dark:text-paper/70 leading-relaxed mb-6">
                                Ang Tipid ay isang personal na expense tracker na ginawa para sa mga Pilipino. Tinutulungan ka nitong subaybayan ang iyong pera, i-manage ang mga utang, at maabot ang iyong financial goals nang libre at walang ads.
                            </p>
                            <p className="text-[12px] text-ink2/40 dark:text-paper/40">© 2026 Tipid App. All rights reserved.</p>
                        </div>
                    </SubPage>
                );
            }

            if (activeMenu === 'help') {
                return (
                    <SubPage title={t.menuHelpCenter} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <h3 className="font-semibold text-ink dark:text-paper mb-4 px-1">Frequently Asked Questions</h3>
                        <div className="space-y-3">
                            <div className="bg-white dark:bg-[#1A2620] p-5 rounded-2xl border border-line dark:border-white/5">
                                <p className="font-medium text-[14px] text-ink dark:text-paper mb-2">Paano magdagdag ng wallet?</p>
                                <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">Pumunta sa Home Dashboard, i-scroll sa "Aking mga Wallet" section, at i-click ang Plus (+) icon sa pinakadulo ng mga cards.</p>
                            </div>
                            <div className="bg-white dark:bg-[#1A2620] p-5 rounded-2xl border border-line dark:border-white/5">
                                <p className="font-medium text-[14px] text-ink dark:text-paper mb-2">Paano mag-edit ng maling gastos?</p>
                                <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">Hanapin ang maling entry sa 'Kasaysayan' sa Home, i-swipe o i-tap ang delete (trash) icon, at i-log na lang ulit ang tamang halaga.</p>
                            </div>
                            <div className="bg-white dark:bg-[#1A2620] p-5 rounded-2xl border border-line dark:border-white/5">
                                <p className="font-medium text-[14px] text-ink dark:text-paper mb-2">Kailangan ba ng internet para magamit ang app?</p>
                                <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">Kailangan ng internet para mag-save sa cloud, pero kapag naka-install ang app sa phone mo, pwede mo itong buksan kahit offline.</p>
                            </div>
                            <div className="bg-white dark:bg-[#1A2620] p-5 rounded-2xl border border-line dark:border-white/5">
                                <p className="font-medium text-[14px] text-ink dark:text-paper mb-2">Paano ma-export ang datos ko?</p>
                                <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">Pumunta sa Profile → Data & Backup → Export My Data. Ide-download ito bilang CSV file na pwede mong buksan sa Excel o Google Sheets.</p>
                            </div>
                        </div>
                    </SubPage>
                );
            }

            // Language sub-page (cosmetic preference toggle, same shape as Theme)
            if (activeMenu === 'language') {
                return (
                    <SubPage title={t.menuLanguage} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <p className="text-[13px] text-ink2/60 dark:text-paper/60 mb-4 px-1">Piliin ang wika ng mga label at button sa app.</p>
                        <OptionList
                            value={lang}
                            onSelect={handleSelectLang}
                            options={[
                                { value: "tl", label: "Tagalog" },
                                { value: "en", label: "English" },
                            ]}
                        />
                    </SubPage>
                );
            }

            // Default Wallet sub-page
            if (activeMenu === 'defaultWallet') {
                return (
                    <SubPage title={t.menuDefaultWallet} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <p className="text-[13px] text-ink2/60 dark:text-paper/60 mb-4 px-1">Ito ang paraan ng bayad na paunang napipili tuwing magdadagdag ka ng gastos.</p>
                        <OptionList
                            value={defaultWallet}
                            onSelect={handleSelectDefaultWallet}
                            options={COMMON_WALLETS.map(w => ({ value: w, label: w }))}
                        />
                    </SubPage>
                );
            }

            // Data & Backup sub-page
            if (activeMenu === 'data') {
                return (
                    <SubPage title={t.menuExportData} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <div className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-line dark:border-white/5 mb-4">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="w-11 h-11 rounded-full bg-peso/10 dark:bg-pesoLight/10 flex items-center justify-center text-peso dark:text-pesoLight shrink-0">
                                    <window.Icons.Download size={20} />
                                </div>
                                <div>
                                    <h3 className="font-semibold text-[15px] text-ink dark:text-paper">Export My Data</h3>
                                    <p className="text-[12px] text-ink2/50 dark:text-paper/50">I-download ang lahat ng entries mo bilang CSV</p>
                                </div>
                            </div>
                            <button onClick={handleExportData} disabled={exporting} className="w-full bg-peso hover:bg-pesoLight text-white font-semibold py-3.5 rounded-xl transition-colors disabled:opacity-50 flex items-center justify-center gap-2">
                                {exporting ? <><window.Icons.Loader size={16} className="spin" /> Ini-export...</> : "I-export bilang CSV"}
                            </button>
                        </div>
                        <div className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-line dark:border-white/5">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="w-11 h-11 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-ink2/60 dark:text-paper/60 shrink-0">
                                    <window.Icons.Trash size={20} />
                                </div>
                                <div>
                                    <h3 className="font-semibold text-[15px] text-ink dark:text-paper">Clear Local Preferences</h3>
                                    <p className="text-[12px] text-ink2/50 dark:text-paper/50">Bura ang naka-save na Goal, Default Wallet, atbp. sa device na ito</p>
                                </div>
                            </div>
                            <button onClick={handleClearLocalPrefs} className="w-full bg-black/5 dark:bg-white/10 text-ink dark:text-paper font-semibold py-3.5 rounded-xl hover:bg-black/10 dark:hover:bg-white/20 transition-colors">
                                I-clear ang Local Preferences
                            </button>
                        </div>
                    </SubPage>
                );
            }

            // Feedback sub-page
            if (activeMenu === 'feedback') {
                return (
                    <SubPage title={t.menuSendFeedback} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <form onSubmit={handleSendFeedback} className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-line dark:border-white/5">
                            <p className="text-[13px] text-ink2/60 dark:text-paper/60 mb-4">May suggestion, bug, o reaction ka ba? Sabihin mo dito.</p>
                            <label className="block text-[12px] font-semibold text-ink2/60 dark:text-paper/60 mb-2 pl-1">Iyong Mensahe</label>
                            <textarea
                                value={feedbackText}
                                onChange={e => setFeedbackText(e.target.value)}
                                placeholder="Isulat dito ang iyong feedback..."
                                rows={5}
                                className="w-full bg-white dark:bg-[#1A2620] ring-1 ring-line dark:ring-white/10 rounded-xl px-4 py-3.5 text-[15px] font-medium text-ink dark:text-paper placeholder-ink2/30 focus:outline-none focus:ring-2 focus:ring-peso/50 transition-all resize-none mb-4"
                            />
                            <button type="submit" disabled={sendingFeedback} className="w-full bg-peso hover:bg-pesoLight text-white font-semibold py-3.5 rounded-xl transition-colors disabled:opacity-50">
                                {sendingFeedback ? "Ipinapadala..." : "Ipadala ang Feedback"}
                            </button>
                        </form>
                    </SubPage>
                );
            }

            // Terms & Privacy sub-page (static placeholder copy)
            if (activeMenu === 'terms') {
                return (
                    <SubPage title={t.menuTermsPrivacy} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <div className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-line dark:border-white/5 space-y-5">
                            <div>
                                <h3 className="font-semibold text-[15px] text-ink dark:text-paper mb-1.5">Paggamit ng App</h3>
                                <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">Ang Tipid ay libreng gamitin para sa personal na pagsubaybay ng gastos. Ikaw ang may pananagutan sa katumpakan ng datos na iyong ilalagay.</p>
                            </div>
                            <div>
                                <h3 className="font-semibold text-[15px] text-ink dark:text-paper mb-1.5">Privacy</h3>
                                <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">Ang iyong mga entry, budget, at profile ay naka-store sa ilalim ng iyong account at hindi ibinabahagi sa ibang user.</p>
                            </div>
                            <div>
                                <h3 className="font-semibold text-[15px] text-ink dark:text-paper mb-1.5">Pagbabago</h3>
                                <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">Maaaring magbago ang mga tuntuning ito paminsan-minsan. Palaging susuriin ang pahinang ito para sa pinakabagong bersyon.</p>
                            </div>
                        </div>
                    </SubPage>
                );
            }

            // Delete Account sub-page (danger zone)
            if (activeMenu === 'deleteAccount') {
                return (
                    <SubPage title={t.menuDeleteAccount} backLabel={t.back} onBack={() => setActiveMenu(null)}>
                        <div className="bg-white dark:bg-[#1A2620] p-6 rounded-2xl shadow-sm border border-expense/20 text-center">
                            <div className="w-16 h-16 bg-expense/10 rounded-full flex items-center justify-center mx-auto mb-4 text-expense">
                                <window.Icons.ShieldAlert size={28} />
                            </div>
                            <h3 className="font-semibold text-[16px] text-ink dark:text-paper mb-2">Permanenteng aalisin ang account mo</h3>
                            <p className="text-[13px] text-ink2/60 dark:text-paper/60 mb-6 leading-relaxed">Hindi na mababawi ang aksyong ito. Kung kailan lang ka nag-login, maaaring hilingin sa iyong mag-log out at mag-log in muna bago ito ituloy.</p>
                            <InputField
                                label='I-type ang "DELETE" para kumpirmahin'
                                value={deleteConfirmText}
                                onChange={e => setDeleteConfirmText(e.target.value)}
                                placeholder="DELETE"
                            />
                            <button
                                onClick={handleDeleteAccount}
                                disabled={deletingAccount || deleteConfirmText.trim().toUpperCase() !== "DELETE"}
                                className="w-full bg-expense hover:bg-[#9C3C31] text-white font-semibold py-3.5 rounded-xl transition-colors disabled:opacity-40"
                            >
                                {deletingAccount ? "Tinatanggal..." : "Permanenteng Tanggalin ang Account"}
                            </button>
                        </div>
                    </SubPage>
                );
            }

            // ---- MAIN MENU LIST ---- //
            return (
                <div className="min-h-dvh flex flex-col pb-[6rem]">
                    <div className="flex-1 max-w-[600px] w-full mx-auto px-4 sm:px-6 pt-[6.5rem] md:pt-[7.5rem]">

                        {/* Static Profile Header Card */}
                        <div className="bg-white dark:bg-[#1A2620] rounded-3xl p-5 shadow-sm border border-line dark:border-white/5 mb-8 fade-up">
                            <div className="flex items-center gap-4">
                                <div className="w-16 h-16 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center overflow-hidden shrink-0 ring-1 ring-black/5 dark:ring-white/10">
                                    {user.photoURL
                                        ? <img src={user.photoURL} alt="Profile" className="w-full h-full object-cover" />
                                        : <span className="text-2xl font-display font-bold text-ink dark:text-paper">{initial}</span>
                                    }
                                </div>
                                <div className="min-w-0">
                                    <h1 className="font-bold text-[18px] text-ink dark:text-paper truncate">{displayName || "User"}</h1>
                                    <p className="text-[13px] font-medium text-ink2/50 dark:text-paper/40 truncate">{user.email}</p>
                                </div>
                            </div>
                            {/* Quick facts row — derived straight from the Firebase user object */}
                            <div className="flex items-center gap-2 mt-4 pt-4 border-t border-line dark:border-white/5">
                                <span className="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-peso/10 dark:bg-pesoLight/10 text-peso dark:text-pesoLight">
                                    <window.Icons.Lock size={11} /> {providerLabel}
                                </span>
                                {memberSince && (
                                    <span className="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-black/5 dark:bg-white/10 text-ink2/60 dark:text-paper/60">
                                        <window.Icons.Calendar size={11} /> {t.memberSince} {memberSince}
                                    </span>
                                )}
                            </div>
                        </div>

                        {/* Settings Lists */}
                        <div className="fade-up" style={{animationDelay: "60ms"}}>
                            <MenuSection title={t.sectionAccount}>
                                <MenuItem icon={<window.Icons.User size={20} />} label={t.menuManageProfile} onClick={() => setActiveMenu('profile')} />
                                <MenuItem icon={<window.Icons.Lock size={20} />} label={t.menuPasswordSecurity} onClick={() => setActiveMenu('security')} />
                                <MenuItem icon={<window.Icons.Bell size={20} />} label={t.menuNotifications} onClick={() => setActiveMenu('notifications')} />
                                <MenuItem icon={<window.Icons.Globe size={20} />} label={t.menuLanguage} trailing={lang === 'en' ? 'English' : 'Tagalog'} onClick={() => setActiveMenu('language')} isLast={true} />
                            </MenuSection>

                            <MenuSection title={t.sectionPreferences}>
                                <MenuItem icon={<window.Icons.Info size={20} />} label={t.menuAboutUs} onClick={() => setActiveMenu('about')} />
                                <MenuItem
                                    icon={<window.Icons.SunMoon size={20} />}
                                    label={t.menuTheme}
                                    trailing={isDark ? t.themeDark : t.themeLight}
                                    onClick={toggleDarkMode}
                                />
                                <MenuItem icon={<window.Icons.Target size={20} />} label={t.menuFinancialGoals} onClick={() => setActiveMenu('goals')} />
                                <MenuItem icon={<window.Icons.Wallet size={20} />} label={t.menuDefaultWallet} trailing={defaultWallet} onClick={() => setActiveMenu('defaultWallet')} />
                                <MenuItem
                                    icon={<window.Icons.Coins size={20} />}
                                    label={t.menuPesoDisplay}
                                    trailing={hideCentavos ? t.pesoHidden : t.pesoShown}
                                    onClick={toggleHideCentavos}
                                    isLast={true}
                                />
                            </MenuSection>

                            <MenuSection title={t.sectionData}>
                                <MenuItem icon={<window.Icons.Download size={20} />} label={t.menuExportData} onClick={() => setActiveMenu('data')} />
                                <MenuItem icon={<window.Icons.Trash size={20} />} label={t.menuClearPrefs} onClick={handleClearLocalPrefs} isLast={true} />
                            </MenuSection>

                            <MenuSection title={t.sectionSupport}>
                                <MenuItem icon={<window.Icons.HelpCircle size={20} />} label={t.menuHelpCenter} onClick={() => setActiveMenu('help')} />
                                <MenuItem icon={<window.Icons.MessageSquare size={20} />} label={t.menuSendFeedback} onClick={() => setActiveMenu('feedback')} />
                                <MenuItem icon={<window.Icons.Star size={20} />} label={t.menuRateTipid} onClick={() => swalSuccess("Salamat! 🎉", "Coming soon ang link sa App Store/Play Store.")} />
                                <MenuItem icon={<window.Icons.FileText size={20} />} label={t.menuTermsPrivacy} onClick={() => setActiveMenu('terms')} isLast={true} />
                            </MenuSection>

                            <MenuSection title={t.sectionDanger}>
                                <MenuItem icon={<window.Icons.LogOut size={20} />} label={t.menuLogOut} isDestructive={true} hideChevron={true} onClick={handleLogout} />
                                <MenuItem icon={<window.Icons.ShieldAlert size={20} />} label={t.menuDeleteAccount} isDestructive={true} onClick={() => setActiveMenu('deleteAccount')} isLast={true} />
                            </MenuSection>
                        </div>
                    </div>

                    <window.Navbar user={user} activeTab="account" />
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");

            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<ProfileApp />);
                return;
            }
            if (attempt > 100) return;
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>
</body>
</html>
