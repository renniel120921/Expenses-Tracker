<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>History — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global Dark Mode Script Initializer -->
    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)',
                        'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)',
                    }
                }
            }
        }
    </script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase Scripts -->
    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <!-- Components -->
    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/ExpenseItem.js"></script>
    <script type="text/babel" src="./components/ExpenseList.js"></script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --page-bg: #F1F4EF;
            --paper-line: rgba(21, 35, 28, 0.06);
        }

        html { background: #F1F4EF; transition: background-color 0.3s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; --page-bg: #111A15; --paper-line: rgba(241, 244, 239, 0.06); }

        body { font-feature-settings: "tnum" 1, "lnum" 1; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }
        html.dark :focus-visible { outline-color: #52C8A1; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.7s var(--ease-ios) both; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.85s linear infinite; }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }
        .logo-breathe { animation: logoBreathe 1.7s ease-in-out infinite; }

        @keyframes haloPulse {
            0%   { transform: scale(0.9); opacity: 0.35; }
            70%  { opacity: 0; }
            100% { transform: scale(1.7); opacity: 0; }
        }
        .halo-pulse { animation: haloPulse 2s var(--ease-ios) infinite; }

        @keyframes heroFloat {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(0, -10px); }
        }
        .hero-float { animation: heroFloat 6s ease-in-out infinite; }

        .glass-panel {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.8);
        }
        html.dark .glass-panel {
            background: rgba(24,38,31,0.55);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .tap-scale { transition: transform 0.15s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.92); }

        .tipid-swal { border-radius: 28px !important; font-family: 'Inter', sans-serif !important; }

        /* --- Resibo perforation: torn-receipt seam under the hero card --- */
        .receipt-edge { position: relative; }
        .receipt-edge::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -9px;
            height: 18px;
            background-image: radial-gradient(circle at 9px 9px, var(--page-bg) 9px, transparent 9.5px);
            background-size: 18px 18px;
            background-repeat: repeat-x;
            pointer-events: none;
            z-index: 5;
        }

        /* Signature element for History — the entry list sits inside a
           literal "receipt": same perforation trick mirrored top and
           bottom, plus a faint thermal-paper ruling behind it. Purely a
           wrapper — the EntryList component and its data are untouched. */
        .receipt-frame { position: relative; padding-top: 14px; }
        .receipt-frame::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 5px;
            height: 18px;
            background-image: radial-gradient(circle at 9px 9px, var(--page-bg) 9px, transparent 9.5px);
            background-size: 18px 18px;
            background-repeat: repeat-x;
            pointer-events: none;
            z-index: 5;
        }
        .receipt-paper {
            background:
                repeating-linear-gradient(
                    180deg,
                    transparent, transparent 27px,
                    var(--paper-line) 27px, var(--paper-line) 28px
                ),
                rgba(255,255,255,0.55);
            border: 1px solid rgba(21,35,28,0.06);
            box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, var(--tw-shadow, 0 0 #0000);
        }
        html.dark .receipt-paper {
            background:
                repeating-linear-gradient(
                    180deg,
                    transparent, transparent 27px,
                    var(--paper-line) 27px, var(--paper-line) 28px
                ),
                rgba(24,38,31,0.4);
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* "Printing" loading state: a thermal line sweeping down a
           receipt strip, replacing a generic spinner-only loader. */
        @keyframes printSweep {
            0%   { top: 6%; opacity: 0; }
            12%  { opacity: 1; }
            88%  { opacity: 1; }
            100% { top: 94%; opacity: 0; }
        }
        .print-sweep {
            position: absolute; left: 8%; right: 8%; height: 2px;
            background: linear-gradient(90deg, transparent, #1F6F54, transparent);
            animation: printSweep 1.6s var(--ease-ios) infinite;
        }
        html.dark .print-sweep {
            background: linear-gradient(90deg, transparent, #52C8A1, transparent);
        }

        /* --- Mascot Animations --- */
        @keyframes mascotHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .history-mascot-img {
            animation: mascotHover 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(18,61,46,0.35));
        }
        .speech-bubble {
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
            box-shadow: 0 10px 25px -5px rgba(18, 61, 46, 0.25);
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up, .spin, .logo-breathe, .halo-pulse, .hero-float, .tap-scale, .history-mascot-img, .speech-bubble, .print-sweep {
                animation: none !important; transition: none !important;
            }
        }
    </style>
</head>

<body class="bg-paper dark:bg-ink text-ink dark:text-paper antialiased font-body min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;
        window.useRef = React.useRef;

        // --- COMPREHENSIVE GLOBAL ICONS ---
        function Icon({ path, size = 20, className = "", strokeWidth = 2.2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        window.Icons = {
            Sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
            Trash: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Pencil: (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />,
            Calendar: (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
            Category: (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Check: (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12"/></>} strokeWidth={3} />,
            Inbox: (p) => <Icon {...p} path={<><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2a10 10 0 0 1 10 10"/></>} />,
            TrendUp: (p) => <Icon {...p} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />,
            TrendDown: (p) => <Icon {...p} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />,
            Home: (p) => <Icon {...p} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
            Chart: (p) => <Icon {...p} path={<><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></>} />,
            List: (p) => <Icon {...p} path={<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>} />,
            LogOut: (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />,
            Receipt: (p) => <Icon {...p} path={<><path d="M4 2h16v20l-3-2-2 2-2-2-2 2-2-2-2 2-3-2V2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></>} />
        };

        window.Logo = function Logo({ size = 30 }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>;
        }

        window.peso = function peso(n) {
            return (n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[380px] h-[380px] bg-peso/[0.07] dark:bg-pesoLight/[0.07] rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[400px] h-[400px] bg-[#C9932E]/[0.07] dark:bg-[#C9932E]/[0.04] rounded-full blur-[100px]" />
                    <div className="absolute top-[40%] left-[55%] w-[300px] h-[300px] bg-[#1F6F54]/[0.04] dark:bg-[#52C8A1]/[0.04] rounded-full blur-[110px]" />
                </div>
            );
        }

        /* --- HISTORY HERO CARD ---
           No dark mode toggle here — that control lives on profile.html
           only, and this page just reflects whatever theme is already set. */
        function HistoryHeroCard() {
            const todayLabel = React.useMemo(() => new Date().toLocaleDateString("en-PH", { weekday: "long", year: "numeric", month: "long", day: "numeric" }), []);
            const [mascotBroken, setMascotBroken] = React.useState(false);

            return (
                <div className="relative receipt-edge mb-6 sm:mb-8">
                <div className="relative overflow-hidden rounded-[1.75rem] sm:rounded-[2rem] bg-gradient-to-br from-[#247E61] via-[#1A614A] to-[#0F382A] text-paper p-5 sm:p-7 shadow-iosLg ring-1 ring-white/15 min-h-[220px] sm:min-h-[240px] flex flex-col justify-between">

                    {/* Ambient Glows Inside Card */}
                    <div className="absolute -top-16 -right-10 w-56 h-56 bg-white/[0.08] rounded-full blur-[50px] hero-float" />
                    <div className="absolute -bottom-24 -left-10 w-60 h-60 bg-[#FFD700]/[0.1] rounded-full blur-[60px]" />

                    {/* Mascot Container — falls back to a quiet receipt-icon
                        badge if the artwork fails to load, instead of a
                        broken-image glyph sitting in the hero. */}
                    {!mascotBroken && (
                        <div className="absolute right-0 bottom-0 w-[140px] sm:w-[190px] h-full pointer-events-none z-0 overflow-visible">
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-24 h-24 bg-white/15 blur-2xl rounded-full"></div>
                            <img
                                src="/assets/history_mascot.png"
                                alt="Tipid Buddy with a savings piggy bank"
                                className="absolute bottom-[-10px] sm:bottom-[-15px] right-[-10px] sm:right-2 w-full object-contain history-mascot-img"
                                draggable="false"
                                onError={() => setMascotBroken(true)}
                            />
                            {/* Speech Bubble */}
                            <div className="speech-bubble absolute top-[15%] right-[60%] sm:right-[70%] bg-paper text-ink rounded-2xl px-3 py-2 text-[10px] sm:text-xs font-medium leading-tight w-max max-w-[120px] sm:max-w-[140px] border border-white/50">
                                <strong className="block font-bold text-[#1F6F54] mb-0.5">Ang galing!</strong>
                                Panatilihing subaybayan ang gastos mo. 💚
                                <div className="absolute -bottom-1.5 right-6 w-3 h-3 bg-paper rotate-45 border-r border-b border-white/50"></div>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    <div className="relative z-10 flex flex-col h-full gap-4 sm:gap-6 max-w-[60%] sm:max-w-[62%]">
                        <div className="mt-2 sm:mt-4">
                            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/15 border border-white/10 text-white mb-3 backdrop-blur-sm">
                                <window.Icons.Receipt size={11} className="text-paper/90" />
                                <span className="text-[10.5px] font-medium text-paper/85">Digital na resibo</span>
                            </div>
                            <h1 className="font-display text-[1.7rem] sm:text-[2.6rem] font-semibold tracking-tight leading-[1.05] mb-2 sm:mb-3">
                                Kasaysayan
                            </h1>
                            <p className="text-[11px] sm:text-[13px] font-medium text-white/80 leading-relaxed pr-2">
                                Balikan ang mga nakaraang gastos at kita para mas madaling makita ang spending habits mo.
                            </p>
                            <p className="text-[10px] sm:text-[11px] font-mono text-white/50 mt-3 sm:mt-4">
                                {todayLabel}
                            </p>
                        </div>
                    </div>
                </div>
                </div>
            );
        }

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        window.useDataReady = function useDataReady() {
            const [ready, setReady] = React.useState(!!window.TipidData);
            React.useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }

        // Signature "receipt" frame wrapping the entry list. Purely
        // presentational — receives the same children the page already
        // renders and adds no data logic of its own.
        function ReceiptFrame({ children }) {
            return (
                <div className="receipt-frame">
                    <div className="receipt-paper receipt-edge rounded-[1.5rem] sm:rounded-[1.75rem] shadow-ios px-1 sm:px-2 pt-3 pb-5">
                        {children}
                    </div>
                </div>
            );
        }

        // "Printing" loader — a thermal line sweeping down a receipt
        // strip, reinforcing the same motif as the loading state.
        function PrintingLoader() {
            return (
                <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                    <div className="glass-panel flex flex-col items-center gap-5 rounded-[32px] px-10 py-10 shadow-ios">
                        <div className="relative w-20 h-24 rounded-[10px] bg-white dark:bg-white/5 border border-black/5 dark:border-white/10 overflow-hidden shadow-inner">
                            <div className="print-sweep" />
                            <div className="absolute inset-x-3 top-3 h-1 rounded bg-black/[0.06] dark:bg-white/10" />
                            <div className="absolute inset-x-3 top-6 h-1 rounded bg-black/[0.06] dark:bg-white/10 w-2/3" />
                            <div className="absolute inset-x-3 top-9 h-1 rounded bg-black/[0.06] dark:bg-white/10" />
                            <div className="absolute inset-x-3 top-12 h-1 rounded bg-black/[0.06] dark:bg-white/10 w-1/2" />
                        </div>
                        <p className="text-[11px] font-mono font-medium tracking-wide text-ink2 dark:text-paper/60 text-center">
                            Kinukuha ang kasaysayan
                        </p>
                    </div>
                </div>
            );
        }

        function HistoryApp() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();
            const [user, setUser] = React.useState(undefined);
            const [entries, setEntries] = React.useState([]);
            const [loadingEntries, setLoadingEntries] = React.useState(true);
            const [dataError, setDataError] = React.useState("");

            // Theme is read-only on this page — the toggle lives on
            // profile.html. We just reflect whatever's saved there, and
            // pick up live changes if it's flipped on another tab.
            React.useEffect(() => {
                const applyTheme = () => {
                    const isDark = localStorage.getItem("tipid_theme") === "dark" ||
                        (!localStorage.getItem("tipid_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    document.documentElement.classList.toggle("dark", isDark);
                };
                applyTheme();
                window.addEventListener("storage", applyTheme);
                return () => window.removeEventListener("storage", applyTheme);
            }, []);

            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => setUser(u || null));
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                setLoadingEntries(true);
                return window.TipidData.subscribeEntries(
                    user.uid,
                    (list) => { setEntries(list); setLoadingEntries(false); },
                    (err) => {
                        console.error(err);
                        setDataError("Failed to load data.");
                        setLoadingEntries(false);
                    }
                );
            }, [dataReady, user]);

            if (user === undefined || user === null) {
                return <PrintingLoader />;
            }

            const logout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            const AppEntryList = window.EntryList;

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />

                    <window.Navbar user={user} onLogout={logout} activeTab="history" />

                    <main
                        className="max-w-[1000px] mx-auto w-full px-5 sm:px-8 pt-[6.5rem] md:pt-10 pb-36 md:pb-20 flex-1"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(var(--sal) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(var(--sar) + 1.25rem))',
                            paddingBottom: 'calc(8rem + var(--sab))',
                        }}
                    >
                        <div className="fade-up" style={{ animationDelay: "0ms" }}>
                            <HistoryHeroCard />
                        </div>

                        {dataError && (
                            <div
                                className="fade-up flex items-start gap-3 bg-[#FAEDE9] dark:bg-[#B5483B]/20 text-[#B5483B] dark:text-[#F38C80] text-[13px] font-medium border border-[#B5483B]/20 rounded-2xl px-5 py-4 shadow-sm mb-6"
                                style={{ animationDelay: "45ms" }}
                            >
                                <window.Icons.AlertCircle size={18} className="shrink-0 mt-0.5" />
                                <span>{dataError}</span>
                            </div>
                        )}

                        <div className="fade-up" style={{ animationDelay: "90ms" }}>
                            <ReceiptFrame>
                                <AppEntryList uid={user.uid} entries={entries} loading={loadingEntries} />
                            </ReceiptFrame>
                        </div>
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");
            if (typeof window.EntryList !== "function") missingNames.push("EntryList");

            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<HistoryApp />);
                return;
            }
            if (attempt > 100) {
                document.getElementById("root").innerHTML =
                    `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Inter,sans-serif;text-align:center;color:#15231C;">
                        <div>
                            <p style="font-weight:600;margin-bottom:0.5rem;">Failed to load: ${missingNames.join(", ")}</p>
                            <p style="font-size:0.875rem;opacity:0.7;">Check the file path (Network tab) and ensure component exports match.</p>
                        </div>
                    </div>`;
                return;
            }
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>

    <!-- PWA Service Worker Registration & Auto-Update Alert -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                Swal.fire({
                                    title: "May Bagong Update! 🎉",
                                    text: "May in-add kaming bagong features sa Tipid App. I-refresh ang app para magamit ito.",
                                    icon: "info",
                                    confirmButtonText: "I-update Ngayon",
                                    confirmButtonColor: "#1F6F54",
                                    allowOutsideClick: false,
                                    customClass: { popup: "tipid-swal" }
                                }).then(() => {
                                    window.location.reload();
                                });
                            }
                        });
                    });
                }).catch(err => console.error("Service Worker registration failed:", err));
            });
        }
    </script>
</body>
</html>
