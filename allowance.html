<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Allowance Tracker — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Track your daily allowance and avoid petsa de peligro.">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)',
                        'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)',
                        'glass': '0 8px 32px 0 rgba(31, 111, 84, 0.1)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <script type="text/babel" src="./components/navbar.js"></script>
    <!-- Ensure AllowanceCalculator.js exists in the components folder -->
    <script type="text/babel" src="./components/AllowanceCalculator.js"></script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html { background: #F1F4EF; transition: background-color 0.4s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; }

        body { font-family: 'Inter', sans-serif; min-height: 100dvh; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.7s var(--ease-spring) both; }

        @keyframes haloPulse { 0% { transform: scale(0.85); opacity: 0.4; } 70% { opacity: 0; } 100% { transform: scale(1.8); opacity: 0; } }
        .halo-pulse { animation: haloPulse 2s var(--ease-ios) infinite; }

        @keyframes logoBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .glass-panel { background: rgba(255,255,255,0.7); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); }
        html.dark .glass-panel { background: rgba(24,38,31,0.6); border: 1px solid rgba(255,255,255,0.08); }

        .tipid-swal { border-radius: 1.5rem !important; font-family: 'Inter', sans-serif !important; }

        .hero-panel { position: relative; isolation: isolate; }
        .hero-panel::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 0 0 0 1px rgba(255,255,255,0.1);
            pointer-events: none; z-index: 20;
        }

        .hero-glow { animation: heroFloat 8s ease-in-out infinite alternate; }
        @keyframes heroFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(15px, -15px) scale(1.1); } }

        .speech-bubble {
            animation: fadeIn 0.6s var(--ease-spring) 0.5s both;
            box-shadow: 0 12px 28px -6px rgba(18, 61, 46, 0.3);
            position: relative;
        }

        .speech-bubble::after {
            content: ''; position: absolute; bottom: -6px; right: 24px;
            border-width: 6px 6px 0; border-style: solid; border-color: #F1F4EF transparent transparent transparent;
        }

        .tip-card { transition: all 0.3s var(--ease-ios); }
        .tip-card:hover { transform: translateY(-4px); box-shadow: var(--tw-shadow-glass); }

        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 8px; transition: outline-offset 0.2s; }
        html.dark :focus-visible { outline-color: #52C8A1; }

        @media (prefers-reduced-motion: reduce) {
            .fade-up, .halo-pulse, .hero-glow, .speech-bubble, .tip-card, [style*="logoBreathe"] { animation: none !important; transition: none !important; transform: none !important; }
        }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper min-h-screen flex flex-col transition-colors duration-400">

    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;

        function Icon({ path, size = 20, className = "", strokeWidth = 2.2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        window.Icons = {
            Activity: (p) => <Icon {...p} path={<><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></>} />,
            Pencil: (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />,
            Shield: (p) => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />,
            Info: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>} />
        };

        window.Logo = function Logo({ size = 30, className = "" }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) return <img src="/assets/logo.svg" alt="Tipid Logo" width={size} height={size} onError={() => setBroken(true)} className={`rounded-lg shadow-sm ${className}`} style={{ width: size, height: size }} />;
            return <span style={{ width: size, height: size }} className={`rounded-lg bg-peso text-paper flex items-center justify-center font-display font-semibold shadow-sm ${className}`}>₱</span>;
        }

        window.peso = (num) => {
            if (isNaN(num)) return "0.00";
            return Number(num).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }
    </script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10" aria-hidden="true">
                    <div className="absolute -top-32 -right-24 w-[450px] h-[450px] bg-peso/15 dark:bg-pesoLight/10 rounded-full blur-[100px] mix-blend-multiply dark:mix-blend-screen opacity-70" />
                    <div className="absolute bottom-10 -left-32 w-[400px] h-[400px] bg-gold/15 dark:bg-gold/10 rounded-full blur-[120px] mix-blend-multiply dark:mix-blend-screen opacity-60" />
                </div>
            );
        }

        function AllowanceHeroCard() {
            return (
                <section className="hero-panel relative overflow-hidden rounded-[1.75rem] sm:rounded-[2.25rem] bg-gradient-to-br from-peso via-pesoLight to-pesoDeep text-paper p-6 sm:p-9 shadow-iosLg min-h-[200px] sm:min-h-[240px] flex flex-col justify-center mb-8">
                    {/* Abstract decorative blobs */}
                    <div className="hero-glow absolute -top-20 -right-12 w-64 h-64 bg-white/15 rounded-full blur-[60px]" />
                    <div className="absolute -bottom-24 -left-12 w-72 h-72 bg-[#FFD700]/15 rounded-full blur-[70px]" />

                    <div className="relative z-10 flex items-end justify-between gap-4 h-full">
                        <div className="max-w-[70%] sm:max-w-[65%] flex flex-col justify-center">
                            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/20 border border-white/20 mb-4 backdrop-blur-md w-max shadow-sm">
                                <span className="w-2 h-2 rounded-full bg-gold animate-pulse" />
                                <span className="text-[11px] font-semibold text-white/90 uppercase tracking-widest">Daily Budget</span>
                            </div>
                            <h1 className="font-display text-4xl sm:text-5xl font-bold tracking-tight leading-[1.05] mb-3 drop-shadow-sm">
                                Allowance
                            </h1>
                            <p className="text-sm sm:text-[15px] font-medium text-white/80 leading-relaxed max-w-sm">
                                I-budget ang baon mo para umabot hanggang sa susunod na sahod o padala.
                            </p>
                        </div>

                        <div className="hidden sm:flex flex-col items-end shrink-0 pb-4">
                            <div className="speech-bubble bg-paper text-ink rounded-2xl px-4 py-3 text-xs font-bold leading-tight max-w-[160px] text-center border border-white/60">
                                Iwas petsa de peligro! 💸
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function AllowanceTipsSection() {
            const tips = [
                {
                    icon: "Activity", tone: "expense",
                    title: "Alamin ang Daily Limit",
                    body: "Hatiin ang baon sa bilang ng araw bago ang susunod na sahod para alam mo ang safe daily limit mo."
                },
                {
                    icon: "Pencil", tone: "gold",
                    title: "I-track Kahit Barya",
                    body: "Kahit barya lang yan o pamasahe sa trike, i-lista mo. Malaking bagay ang maliliit na gastos pag naipon."
                },
                {
                    icon: "Shield", tone: "peso",
                    title: "Save Before You Spend",
                    body: "Magtabi agad ng ipon pagkatanggap ng allowance bago pa mag-umpisang gumastos."
                }
            ];

            const toneClasses = {
                expense: "bg-[#FAEDE9] dark:bg-[#B5483B]/15 text-[#B5483B] dark:text-[#F38C80]",
                gold: "bg-[#FDF6E3] dark:bg-[#C9932E]/15 text-[#C9932E] dark:text-[#E8C071]",
                peso: "bg-[#E6F3EF] dark:bg-[#1F6F54]/15 text-[#1F6F54] dark:text-[#52C8A1]",
            };

            return (
                <section className="mt-10 sm:mt-12 fade-up" style={{ animationDelay: "200ms" }} aria-labelledby="tips-heading">
                    <div className="flex items-center gap-3 mb-5 px-1">
                        <window.Icons.Info size={22} className="text-peso dark:text-pesoLight" />
                        <h2 id="tips-heading" className="font-display text-xl font-bold text-ink dark:text-paper tracking-tight">Tipid hacks: baon edition</h2>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                        {tips.map((tip) => {
                            const TipIcon = window.Icons[tip.icon];
                            return (
                                <article key={tip.title} className="tip-card group cursor-default glass-panel dark:bg-ink2/30 p-6 rounded-[1.5rem] flex flex-col h-full relative overflow-hidden">
                                    <div className="absolute -right-4 -top-4 w-20 h-20 opacity-0 group-hover:opacity-10 transition-opacity duration-300 pointer-events-none rounded-full bg-current" style={{ color: "var(--tw-text-opacity)" }} />
                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center mb-4 transition-transform duration-300 group-hover:scale-110 shadow-sm ${toneClasses[tip.tone]}`}>
                                        <TipIcon size={22} strokeWidth={2.5} />
                                    </div>
                                    <h3 className="font-bold text-[14px] text-ink dark:text-paper mb-2">{tip.title}</h3>
                                    <p className="text-[13px] text-ink2/80 dark:text-paper/70 leading-relaxed">{tip.body}</p>
                                </article>
                            );
                        })}
                    </div>
                </section>
            );
        }

        function AllowancePage() {
            const authReady = window.useAuthReady();
            const [user, setUser] = React.useState(null);
            const [allowanceList, setAllowanceList] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [authChecking, setAuthChecking] = React.useState(true);
            const [componentsReady, setComponentsReady] = React.useState(false);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    if (window.AllowanceCalculator && window.Navbar) {
                        setComponentsReady(true);
                        clearInterval(interval);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                let unsub = null;
                let isMounted = true;

                const checkAuth = () => {
                    if (window.TipidAuth) {
                        window.TipidAuth.ready.then(() => {
                            if (!isMounted) return;
                            unsub = window.TipidAuth.onChange((currentUser) => {
                                if (!isMounted) return;
                                if (!currentUser) {
                                    window.location.href = "./login.html";
                                } else {
                                    setUser(currentUser);
                                    setAuthChecking(false);
                                }
                            });
                        });
                    } else {
                        setTimeout(checkAuth, 50);
                    }
                };
                checkAuth();
                return () => { isMounted = false; if (typeof unsub === "function") unsub(); };
            }, []);

            const handleLogout = async () => {
                try {
                    await window.TipidAuth.logOut();
                    window.location.href = "./login.html";
                } catch (err) {
                    console.error("Logout error:", err);
                }
            };

            React.useEffect(() => {
                if (!user) return;
                let unsubAllowance = null;

                const loadAllowance = () => {
                    if (window.TipidData?.subscribeAllowance) {
                        unsubAllowance = window.TipidData.subscribeAllowance(
                            user.uid,
                            (data) => { setAllowanceList(data); setLoading(false); },
                            (err) => { console.error("Error fetching allowance data:", err); setLoading(false); }
                        );
                    } else if (window.TipidData?.subscribeEntries) {
                        unsubAllowance = window.TipidData.subscribeEntries(
                            user.uid,
                            (data) => { setAllowanceList(data); setLoading(false); },
                            (err) => { console.error("Error fetching data:", err); setLoading(false); }
                        );
                    } else {
                        setTimeout(loadAllowance, 50);
                    }
                };
                loadAllowance();
                return () => { if (typeof unsubAllowance === "function") unsubAllowance(); };
            }, [user?.uid]);

            if (authChecking || !componentsReady) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-6 rounded-[2rem] px-12 py-12 shadow-ios transition-all">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-20 w-20 rounded-full bg-peso/20 dark:bg-pesoLight/20 halo-pulse" />
                                <div className="relative bg-white dark:bg-ink p-3 rounded-2xl shadow-sm" style={{ animation: "logoBreathe 2s ease-in-out infinite" }}>
                                    <window.Logo size={48} />
                                </div>
                            </div>
                            <p className="text-xs font-mono font-semibold tracking-widest text-ink2/70 dark:text-paper/60 text-center uppercase">
                                Preparing Workspace
                            </p>
                        </div>
                    </div>
                );
            }

            const AppAllowanceCalculator = window.AllowanceCalculator;
            const AppNavbar = window.Navbar;

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />
                    <AppNavbar user={user} onLogout={handleLogout} activeTab="allowance" />

                    <main
                        className="max-w-[1024px] mx-auto w-full px-5 sm:px-8 pt-[6.5rem] md:pt-12 pb-36 md:pb-24 flex-1 z-10"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(var(--sal) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(var(--sar) + 1.25rem))',
                            paddingBottom: 'calc(8rem + var(--sab))',
                        }}
                    >
                        <div className="fade-up">
                            <AllowanceHeroCard />
                        </div>

                        <div className="fade-up" style={{ animationDelay: "100ms" }}>
                            <AppAllowanceCalculator user={user} entries={allowanceList} loading={loading} />
                        </div>

                        <AllowanceTipsSection />
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");
            if (typeof window.AllowanceCalculator !== "function") missingNames.push("AllowanceCalculator");

            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<AllowancePage />);
                return;
            }

            if (attempt > 100) {
                document.getElementById("root").innerHTML =
                    `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Inter,sans-serif;text-align:center;">
                        <div style="background:rgba(255,255,255,0.8);backdrop-filter:blur(10px);padding:2rem;border-radius:1rem;border:1px solid rgba(0,0,0,0.1);max-width:400px;box-shadow:0 10px 25px rgba(0,0,0,0.05);">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#B5483B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 1rem;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <h2 style="font-weight:600;margin-bottom:0.5rem;color:#15231C;font-size:1.1rem;">Components Missing</h2>
                            <p style="font-size:0.9rem;color:#33443A;line-height:1.5;">Failed to load: <b>${missingNames.join(", ")}</b>.<br>Please ensure these files exist in your <code>/components/</code> directory.</p>
                        </div>
                    </div>`;
                return;
            }
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>
</body>
</html>
