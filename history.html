<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>History — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E2E8DE', ink: '#15231C', ink2: '#2F4037',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#134735',
                        gold: '#C9932E', expense: '#B5483B', line: '#D2DDD4',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <style>
        :root {
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html { background: #F1F4EF; transition: background-color 0.3s; }
        html.dark { background: #111A15; color: #F1F4EF; }

        body { font-feature-settings: "tnum" 1, "lnum" 1; -webkit-tap-highlight-color: transparent; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }

        @keyframes rowIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .row-in { animation: rowIn 0.3s ease-out both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.6s var(--ease-ios) both; }

        @keyframes bannerIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .banner-in { animation: bannerIn 0.4s cubic-bezier(0.34, 1.2, 0.4, 1) both; }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }
        .logo-breathe { animation: logoBreathe 1.6s ease-in-out infinite; }

        @keyframes haloPulse {
            0% { transform: scale(0.9); opacity: 0.35; }
            70% { opacity: 0; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .halo-pulse { animation: haloPulse 1.9s var(--ease-ios) infinite; }

        .glass-panel {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.55);
        }
        html.dark .glass-panel {
            background: rgba(24,38,31,0.55);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .tap-scale { transition: transform 0.18s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.92); }

        .swal2-popup.tipid-swal { border-radius: 20px !important; font-family: 'Inter', sans-serif; }
        .tipid-swal .swal2-title { font-family: 'Fraunces', serif; color: #15231C; }
        .tipid-swal .swal2-html-container { color: #33443A; }
        .tipid-swal .swal2-confirm,
        .tipid-swal .swal2-cancel {
            border-radius: 999px !important;
            padding: 0.65em 1.6em !important;
            font-weight: 600 !important;
            box-shadow: none !important;
        }

        /* --- Modern History Hero / Mascot --- */
        @keyframes mascotFloat {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(-1deg); }
            50% { transform: translate3d(0, -7px, 0) rotate(1deg); }
        }
        @keyframes mascotGlow {
            0%, 100% { transform: scale(0.94); opacity: 0.20; }
            50% { transform: scale(1.06); opacity: 0.34; }
        }

        .history-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 238px;
            border-radius: 28px;
            padding: 26px 24px 22px;
            margin-bottom: 22px;
            background:
                radial-gradient(circle at 18% 0%, rgba(255,255,255,0.08), transparent 28%),
                radial-gradient(circle at 96% 100%, rgba(201,147,46,0.16), transparent 34%),
                linear-gradient(135deg, #2F8E6C 0%, #1F6F54 48%, #123D2E 100%);
            box-shadow: 0 24px 50px -22px rgba(18,61,46,0.55);
        }

        .history-hero::before {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            right: -80px;
            bottom: -150px;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            filter: blur(10px);
        }

        .history-copy {
            position: relative;
            z-index: 4;
            max-width: 62%;
            padding-right: 42px;
        }

        .history-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: rgba(241,244,239,0.72);
            font: 700 10px/1.2 'JetBrains Mono', monospace;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .history-kicker::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #FCD116;
            box-shadow: 0 0 0 4px rgba(252,209,22,0.10);
        }

        .history-title {
            margin: 0;
            color: #F7FAF7;
            font: 700 clamp(2rem, 4vw, 2.65rem)/1.03 'Fraunces', serif;
            letter-spacing: -0.03em;
        }

        .history-subtitle {
            margin-top: 10px;
            max-width: 390px;
            color: rgba(247,250,247,0.72);
            font: 500 12px/1.55 'Inter', sans-serif;
        }

        .history-actions {
            position: absolute;
            z-index: 6;
            top: 18px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-action {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            color: #F7FAF7;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.24);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .history-mascot-stage {
            position: absolute;
            z-index: 3;
            right: 10px;
            bottom: -10px;
            width: 220px;
            height: 198px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
        }

        .history-mascot-stage::before {
            content: "";
            position: absolute;
            width: 136px;
            height: 136px;
            right: 28px;
            bottom: 18px;
            border-radius: 999px;
            background: rgba(255,255,255,0.10);
            filter: blur(28px);
            animation: mascotGlow 3.8s ease-in-out infinite;
        }

        .history-mascot-stage::after {
            content: "";
            position: absolute;
            width: 122px;
            height: 18px;
            right: 30px;
            bottom: 3px;
            border-radius: 999px;
            background: rgba(0,0,0,0.18);
            filter: blur(8px);
        }

        .history-mascot {
            position: relative;
            z-index: 2;
            width: 205px;
            height: 205px;
            object-fit: contain;
            object-position: center bottom;
            animation: mascotFloat 4.8s ease-in-out infinite;
            filter: drop-shadow(0 15px 18px rgba(0,0,0,0.18));
            user-select: none;
        }

        .history-bubble {
            position: absolute;
            z-index: 5;
            right: 128px;
            bottom: 112px;
            max-width: 138px;
            padding: 8px 10px;
            border-radius: 14px;
            background: #F8FAF8;
            color: #15231C;
            box-shadow: 0 16px 28px -16px rgba(0,0,0,0.35);
            font: 600 10px/1.35 'Inter', sans-serif;
        }

        .history-bubble::after {
            content: "";
            position: absolute;
            right: 10px;
            bottom: -8px;
            width: 14px;
            height: 14px;
            background: #F8FAF8;
            transform: rotate(45deg);
            border-radius: 2px;
        }

        .history-bubble strong {
            display: block;
            font-size: 10px;
            margin-bottom: 1px;
        }

        .history-list-shell {
            position: relative;
            z-index: 2;
        }

        @media (max-width: 640px) {
            .history-hero {
                min-height: 270px;
                border-radius: 24px;
                padding: 22px 20px;
            }

            .history-copy {
                max-width: 68%;
                padding-right: 10px;
            }

            .history-title {
                font-size: 2rem;
            }

            .history-mascot-stage {
                right: -10px;
                bottom: -14px;
                width: 172px;
                height: 160px;
            }

            .history-mascot {
                width: 165px;
                height: 165px;
            }

            .history-bubble {
                right: 96px;
                bottom: 102px;
                max-width: 112px;
                font-size: 9px;
            }

            .history-actions {
                top: 14px;
                right: 14px;
            }

            .history-action {
                width: 40px;
                height: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spin, .row-in, .fade-up, .banner-in, .logo-breathe, .halo-pulse,
            .tap-scale, .history-mascot, .history-mascot-stage::before {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper antialiased font-body min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        window.Icons = {
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Trash: (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Inbox: (p) => <Icon {...p} path={<><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></>} />,
            Pencil: (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />,
            TrendUp: (p) => <Icon {...p} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />,
            TrendDown: (p) => <Icon {...p} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            Home: (p) => <Icon {...p} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
            Chart: (p) => <Icon {...p} path={<><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></>} />,
            List: (p) => <Icon {...p} path={<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>} />,
            Category: (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            LogOut: (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />,
            Sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
        };

        window.Logo = function Logo({ size = 30 }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>;
        }

        window.peso = function peso(n) {
            return (n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        window.CATEGORIES = ["Pagkain", "Pamasahe", "Bills", "Load", "Ipon", "Project Components", "Iba pa"];
        window.CATEGORY_COLOR = {
            Pagkain: "bg-peso", Pamasahe: "bg-ink2", Bills: "bg-gold",
            Load: "bg-pesoDeep", Ipon: "bg-pesoLight", "Project Components": "bg-ink", "Iba pa": "bg-expense",
        };
        window.METHODS = ["Cash", "GCash", "Maya", "Bank"];

        window.startOfMonth = function startOfMonth() {
            const d = new Date();
            d.setDate(1);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        window.useDataReady = function useDataReady() {
            const [ready, setReady] = React.useState(!!window.TipidData);
            React.useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }
    </script>

    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/ExpenseItem.js"></script>
    <script type="text/babel" src="./components/ExpenseList.js"></script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[360px] h-[360px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[380px] h-[380px] bg-gold/10 dark:bg-gold/5 rounded-full blur-[100px]" />
                </div>
            );
        }

        function HistoryHero() {
            return (
                <div className="history-hero">
                    <div className="history-copy">
                        <div className="history-kicker">Tipid Buddy</div>
                        <h1 className="history-title">Transaction History</h1>
                        <p className="history-subtitle">
                            Balikan ang mga nakaraang gastos at kita para mas madaling makita ang spending habits mo.
                        </p>
                    </div>

                    <div className="history-actions">
                        <button
                            onClick={() => window.dispatchEvent(new CustomEvent("tipid-toggle-theme"))}
                            aria-label="Toggle Dark Mode"
                            className="history-action tap-scale"
                            id="history-theme-toggle"
                        >
                            <Icons.Moon size={18} />
                        </button>
                    </div>

                    <div className="history-bubble">
                        <strong>Nice work!</strong>
                        Keep checking your gastos. 💚
                    </div>

                    <div className="history-mascot-stage" aria-hidden="true">
                        <img
                            src="/assets/history_mascot.png"
                            alt="Tipid Buddy with a savings piggy bank"
                            className="history-mascot"
                            draggable="false"
                        />
                    </div>
                </div>
            );
        }

        function HistoryApp() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();
            const [user, setUser] = React.useState(undefined);
            const [entries, setEntries] = React.useState([]);
            const [loadingEntries, setLoadingEntries] = React.useState(true);
            const [dataError, setDataError] = React.useState("");

            const [darkMode, setDarkMode] = React.useState(() => {
                return localStorage.getItem("theme") === "dark" ||
                    (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches);
            });

            React.useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add("dark");
                    localStorage.setItem("theme", "dark");
                } else {
                    document.documentElement.classList.remove("dark");
                    localStorage.setItem("theme", "light");
                }
            }, [darkMode]);

            React.useEffect(() => {
                const handler = () => setDarkMode(d => !d);
                window.addEventListener("tipid-toggle-theme", handler);
                return () => window.removeEventListener("tipid-toggle-theme", handler);
            }, []);

            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => setUser(u || null));
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                setLoadingEntries(true);
                return window.TipidData.subscribeEntries(
                    user.uid,
                    (list) => { setEntries(list); setLoadingEntries(false); },
                    (err) => {
                        console.error(err);
                        setDataError("Failed to load data.");
                        setLoadingEntries(false);
                    }
                );
            }, [dataReady, user]);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-3 rounded-[28px] px-10 py-9 shadow-sm">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/20 halo-pulse" />
                                <div className="relative logo-breathe">
                                    <window.Logo size={40} />
                                </div>
                            </div>
                            <p className="text-xs font-mono tracking-[0.2em] uppercase text-ink2/60 dark:text-paper/50">
                                Loading your history
                            </p>
                        </div>
                    </div>
                );
            }

            const logout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />
                    <Navbar user={user} onLogout={logout} activeTab="history" />

                    <main
                        className="w-full max-w-5xl mx-auto px-5 sm:px-6 pt-32 md:pt-12 pb-40 md:pb-16 space-y-6 md:space-y-8"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(env(safe-area-inset-left) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(env(safe-area-inset-right) + 1.25rem))',
                        }}
                    >
                        <div className="fade-up" style={{ animationDelay: "0ms" }}>
                            <HistoryHero />
                        </div>

                        {dataError && (
                            <div
                                className="fade-up banner-in flex items-start gap-3 bg-expense/10 text-expense text-sm font-medium border border-expense/20 rounded-2xl px-5 py-4 shadow-sm"
                                style={{ animationDelay: "45ms" }}
                            >
                                <Icons.AlertCircle size={18} className="shrink-0 mt-0.5" />
                                <span>{dataError}</span>
                            </div>
                        )}

                        <div className="history-list-shell fade-up" style={{ animationDelay: "90ms" }}>
                            <div className="mb-4 flex items-center justify-between">
                                <div>
                                    <p className="text-[10px] font-mono uppercase tracking-[0.2em] text-peso dark:text-pesoLight">Kasaysayan</p>
                                    <p className="text-sm text-ink2/60 dark:text-paper/50 mt-1">Your recorded transactions</p>
                                </div>
                                <span className="text-xs font-mono text-ink2/45 dark:text-paper/35">
                                    {entries.length} {entries.length === 1 ? "entry" : "entries"}
                                </span>
                            </div>

                            <EntryList uid={user.uid} entries={entries} loading={loadingEntries} />
                        </div>
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady() {
            if (typeof Navbar === "function" && typeof EntryList === "function") {
                ReactDOM.createRoot(document.getElementById("root")).render(<HistoryApp />);
            } else {
                setTimeout(mountWhenComponentsReady, 30);
            }
        }
        mountWhenComponentsReady();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                Swal.fire({
                                    title: "May Bagong Update! 🎉",
                                    text: "May in-add kaming bagong features sa Tipid App. I-refresh ang app para magamit ito.",
                                    icon: "info",
                                    confirmButtonText: "I-update Ngayon",
                                    confirmButtonColor: "#1F6F54",
                                    allowOutsideClick: false,
                                    customClass: { popup: "tipid-swal" }
                                }).then(() => {
                                    window.location.reload();
                                });
                            }
                        });
                    });
                }).catch(err => console.error("Service Worker registration failed:", err));
            });
        }
    </script>
</body>
</html>
