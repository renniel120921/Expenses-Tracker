<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Utang Tracker — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)',
                        'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/UtangTracker.js"></script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html { background: #F1F4EF; transition: background-color 0.3s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; }

        body { font-family: 'Inter', sans-serif; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.6s var(--ease-ios) both; }

        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes haloPulse { 0% { transform: scale(0.9); opacity: 0.35; } 70% { opacity: 0; } 100% { transform: scale(1.6); opacity: 0; } }
        .halo-pulse { animation: haloPulse 1.9s var(--ease-ios) infinite; }

        @keyframes heroFloat { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -10px); } }
        .hero-float { animation: heroFloat 6s ease-in-out infinite; }

        .glass-panel { background: rgba(255,255,255,0.65); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(255,255,255,0.55); }
        html.dark .glass-panel { background: rgba(24,38,31,0.55); border: 1px solid rgba(255,255,255,0.08); }

        .tap-scale { transition: transform 0.15s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.92); }

        .tipid-swal { border-radius: 1.5rem !important; font-family: 'Inter', sans-serif !important; }

        @keyframes mascotHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .utang-mascot-img {
            animation: mascotHover 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(18,61,46,0.35));
        }
        .speech-bubble {
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
            box-shadow: 0 10px 25px -5px rgba(18, 61, 46, 0.25);
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up, .spin, .halo-pulse, .hero-float, .tap-scale, .utang-mascot-img, .speech-bubble { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper min-h-screen flex flex-col transition-colors duration-300">

    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;

        function Icon({ path, size = 20, className = "", strokeWidth = 2.2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        window.Icons = {
            Sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
            Trash: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Pencil: (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />,
            Calendar: (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
            Category: (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Check: (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12"/></>} strokeWidth={3} />,
            Inbox: (p) => <Icon {...p} path={<><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2a10 10 0 0 1 10 10"/></>} />,
            Info: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>} />,
            Shield: (p) => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />,
            Users: (p) => <Icon {...p} path={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />,
            Clock: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />
        };

        window.Logo = function Logo({ size = 30 }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>;
        }

        window.peso = (num) => {
            if (isNaN(num)) return "0.00";
            return Number(num).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }
    </script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[360px] h-[360px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[380px] h-[380px] bg-gold/10 dark:bg-gold/5 rounded-full blur-[100px]" />
                </div>
            );
        }

        function UtangHeroCard({ darkMode, toggleDarkMode }) {
            const [mascotOk, setMascotOk] = React.useState(true);

            return (
                <div className="relative overflow-hidden rounded-[1.75rem] sm:rounded-[2rem] bg-gradient-to-br from-[#247E61] via-[#1A614A] to-[#0F382A] text-paper p-5 sm:p-7 shadow-iosLg ring-1 ring-white/15 min-h-[200px] sm:min-h-[230px] flex flex-col justify-between mb-6 sm:mb-8">
                    <div className="absolute -top-16 -right-10 w-56 h-56 bg-white/10 rounded-full blur-[50px] hero-float" />
                    <div className="absolute -bottom-24 -left-10 w-60 h-60 bg-[#FFD700]/10 rounded-full blur-[60px]" />

                    <div className="absolute top-5 right-5 sm:top-6 sm:right-6 z-30">
                        <button
                            onClick={toggleDarkMode}
                            aria-label="Toggle Dark Mode"
                            className="tap-scale w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/20 hover:bg-white/30 border border-white/20 flex items-center justify-center text-white shadow-sm backdrop-blur-md transition-colors"
                        >
                            {darkMode ? <window.Icons.Sun size={18} /> : <window.Icons.Moon size={18} />}
                        </button>
                    </div>

                    {mascotOk && (
                        <div className="absolute right-0 bottom-0 w-[130px] sm:w-[170px] h-full pointer-events-none z-0 overflow-visible hidden sm:block">
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-24 h-24 bg-white/15 blur-2xl rounded-full"></div>
                            <div className="speech-bubble absolute top-[15%] right-[60%] sm:right-[70%] bg-paper text-ink rounded-2xl px-3 py-2 text-[10px] sm:text-xs font-semibold leading-tight w-max max-w-[120px] sm:max-w-[140px] border border-white/50">
                                Lista mo 'yan!<br/>Para iwas limot. ✍️
                                <div className="absolute -bottom-1.5 right-6 w-3 h-3 bg-paper rotate-45 border-r border-b border-white/50"></div>
                            </div>
                        </div>
                    )}

                    <div className="relative z-10 flex flex-col h-full gap-5 sm:gap-6 max-w-[70%] sm:max-w-[60%]">
                        <div className="mt-2 sm:mt-4">
                            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/15 border border-white/10 text-white mb-3 backdrop-blur-sm">
                                <span className="w-1.5 h-1.5 rounded-full bg-[#FFD700] animate-pulse" />
                                <span className="text-[9px] font-bold uppercase tracking-[0.1em] text-paper/90">Personal Ledger</span>
                            </div>
                            <h1 className="font-display text-[1.6rem] sm:text-[2.25rem] font-bold tracking-tight leading-[1.1] mb-2 sm:mb-3">
                                Utang Tracker
                            </h1>
                            <p className="text-[11px] sm:text-[13px] font-medium text-white/80 leading-relaxed pr-2">
                                Subaybayan kung sino ang may utang sa'yo at kung magkano pa ang utang mo sa iba.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function UtangTipsSection() {
            return (
                <div className="mt-8 sm:mt-10 fade-up" style={{ animationDelay: "150ms" }}>
                    <div className="flex items-center gap-2.5 mb-4 px-1">
                        <window.Icons.Info size={20} className="text-peso dark:text-pesoLight" />
                        <h3 className="font-display text-[1.15rem] font-semibold text-ink dark:text-paper tracking-tight">Tipid Hacks: Utang Edition</h3>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white/60 dark:bg-ink2/30 backdrop-blur-xl p-5 rounded-[1.25rem] border border-white/60 dark:border-white/5 shadow-sm transition-transform hover:-translate-y-1 duration-300">
                            <div className="w-10 h-10 rounded-full bg-[#FAEDE9] dark:bg-[#B5483B]/20 text-[#B5483B] dark:text-[#F38C80] flex items-center justify-center mb-3">
                                <window.Icons.Shield size={18} />
                            </div>
                            <h4 className="font-semibold text-[13px] text-ink dark:text-paper mb-1.5">Set Boundaries</h4>
                            <p className="text-[11.5px] text-ink2/70 dark:text-paper/60 leading-relaxed">Okay lang humindi kung wala talagang extra. Unahin ang sariling budget at emergency fund bago magpautang.</p>
                        </div>

                        <div className="bg-white/60 dark:bg-ink2/30 backdrop-blur-xl p-5 rounded-[1.25rem] border border-white/60 dark:border-white/5 shadow-sm transition-transform hover:-translate-y-1 duration-300">
                            <div className="w-10 h-10 rounded-full bg-[#FDF6E3] dark:bg-[#C9932E]/20 text-[#C9932E] dark:text-[#E8C071] flex items-center justify-center mb-3">
                                <window.Icons.Clock size={18} />
                            </div>
                            <h4 className="font-semibold text-[13px] text-ink dark:text-paper mb-1.5">Kusang Magbayad</h4>
                            <p className="text-[11.5px] text-ink2/70 dark:text-paper/60 leading-relaxed">Bayaran ang utang sa pinangakong araw bago pa singilin. Nakakasira ng tiwala at pagkakaibigan ang pagtatago.</p>
                        </div>

                        <div className="bg-white/60 dark:bg-ink2/30 backdrop-blur-xl p-5 rounded-[1.25rem] border border-white/60 dark:border-white/5 shadow-sm transition-transform hover:-translate-y-1 duration-300">
                            <div className="w-10 h-10 rounded-full bg-[#E6F3EF] dark:bg-[#1F6F54]/20 text-[#1F6F54] dark:text-[#52C8A1] flex items-center justify-center mb-3">
                                <window.Icons.Users size={18} />
                            </div>
                            <h4 className="font-semibold text-[13px] text-ink dark:text-paper mb-1.5">Iwas Kalimutan sa KKB</h4>
                            <p className="text-[11.5px] text-ink2/70 dark:text-paper/60 leading-relaxed">Kung may ambagan o Kanya-Kanyang Bayad (KKB), i-lista agad dito sa tracker para walang nagkakalimutan pagkatapos kumain.</p>
                        </div>
                    </div>
                </div>
            );
        }

        function UtangPage() {
            const authReady = window.useAuthReady();
            const [user, setUser] = React.useState(null);
            const [utangList, setUtangList] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [authChecking, setAuthChecking] = React.useState(true);
            const [componentsReady, setComponentsReady] = React.useState(false);

            const [darkMode, setDarkMode] = React.useState(() => {
                return localStorage.getItem("tipid_theme") === "dark" ||
                    (!localStorage.getItem("tipid_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
            });

            React.useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem("tipid_theme", "dark");
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem("tipid_theme", "light");
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    if (window.UtangTracker && window.Navbar) {
                        setComponentsReady(true);
                        clearInterval(interval);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                let unsub = null;
                let isMounted = true;

                const checkAuth = () => {
                    if (window.TipidAuth) {
                        unsub = window.TipidAuth.onChange((currentUser) => {
                            if (!isMounted) return;
                            if (!currentUser) {
                                window.location.href = "./login.html";
                            } else {
                                setUser(currentUser);
                                setAuthChecking(false);
                            }
                        });
                    } else {
                        setTimeout(checkAuth, 50);
                    }
                };

                checkAuth();

                return () => {
                    isMounted = false;
                    if (typeof unsub === "function") unsub();
                };
            }, []);

            const handleLogout = async () => {
                try {
                    await window.TipidAuth.logOut();
                    window.location.href = "./login.html";
                } catch (err) {
                    console.error("Logout error:", err);
                }
            };

            // Stabilized Utang Subscription with useRef to prevent re-triggering re-mounts while typing
            const utangListRef = React.useRef(utangList);
            utangListRef.current = utangList;

            React.useEffect(() => {
                if (!user) return;
                let unsubUtang = null;

                const loadUtang = () => {
                    if (window.TipidData && window.TipidData.subscribeUtang) {
                        unsubUtang = window.TipidData.subscribeUtang(
                            user.uid,
                            (data) => {
                                // Only update state if data actually changed to prevent input focus resets
                                setUtangList(data);
                                setLoading(false);
                            },
                            (err) => {
                                console.error("Error fetching utang:", err);
                                setLoading(false);
                            }
                        );
                    } else {
                        setTimeout(loadUtang, 50);
                    }
                };

                loadUtang();

                return () => {
                    if (typeof unsubUtang === "function") unsubUtang();
                };
            }, [user?.uid]);

            if (authChecking || !componentsReady) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-5 rounded-[32px] px-10 py-10 shadow-ios">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/25 halo-pulse" />
                                <div className="relative animate-[logoBreathe_1.7s_ease-in-out_infinite]">
                                    <window.Logo size={44} />
                                </div>
                            </div>
                            <p className="text-[11px] font-mono font-semibold tracking-widest uppercase text-ink2 dark:text-paper/60 text-center">
                                Loading Utang
                            </p>
                        </div>
                    </div>
                );
            }

            const AppUtangTracker = window.UtangTracker;
            const AppNavbar = window.Navbar;

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />

                    <AppNavbar user={user} onLogout={handleLogout} activeTab="utang" />

                    <main
                        className="max-w-[1000px] mx-auto w-full px-5 sm:px-8 pt-[6.5rem] md:pt-10 pb-36 md:pb-20 flex-1"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(var(--sal) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(var(--sar) + 1.25rem))',
                            paddingBottom: 'calc(8rem + var(--sab))',
                        }}
                    >
                        <div className="fade-up">
                            <UtangHeroCard darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
                        </div>

                        <div className="fade-up" style={{ animationDelay: "60ms" }}>
                            <AppUtangTracker uid={user.uid} utangList={utangList} loading={loading} />
                        </div>

                        <UtangTipsSection />
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");
            if (typeof window.UtangTracker !== "function") missingNames.push("UtangTracker");

            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<UtangPage />);
                return;
            }
            if (attempt > 100) {
                document.getElementById("root").innerHTML =
                    `<div style="min-h-dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Inter,sans-serif;text-align:center;color:#15231C;">
                        <div>
                            <p style="font-weight:600;margin-bottom:0.5rem;">Failed to load: ${missingNames.join(", ")}</p>
                            <p style="font-size:0.875rem;opacity:0.7;">Check the file path (Network tab) and ensure component exports match.</p>
                        </div>
                    </div>`;
                return;
            }
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>
</body>
</html>
