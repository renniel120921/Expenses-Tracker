<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bills Center — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ink: '#15231C',
                        ink2: '#2F4037',
                        paper: '#F1F4EF',
                        paperDim: '#E2E8DE',
                        peso: '#1F6F54',
                        pesoDeep: '#134735',
                        pesoLight: '#2F8E6C',
                        gold: '#C9932E',
                        expense: '#B5483B',
                        line: '#D2DDD4',
                    },
                    fontFamily: {
                        display: ['Fraunces', 'serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 1px 2px rgba(18,61,46,0.04), 0 12px 28px -12px rgba(18,61,46,0.18)',
                        'iosLg': '0 24px 48px -16px rgba(18,61,46,0.35)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase Scripts -->
    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <!-- Components -->
    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/BillsCenter.js"></script>

    <style>
        :root {
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body { font-family: 'Inter', sans-serif; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.5s var(--ease-ios) both; }
        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes haloPulse {
            0%   { transform: scale(0.9); opacity: 0.35; }
            70%  { opacity: 0; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .halo-pulse { animation: haloPulse 1.9s var(--ease-ios) infinite; }

        .glass-panel {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.55);
        }
        html.dark .glass-panel { background: rgba(24,38,31,0.55); border: 1px solid rgba(255,255,255,0.08); }

        .tap-scale { transition: transform 0.18s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.92); }

        /* Custom SweetAlert styling */
        .tipid-swal {
            border-radius: 1.5rem !important;
            font-family: 'Inter', sans-serif !important;
        }

        /* --- Modern Premium Bills Hero --- */
        @keyframes mascotHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .bills-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 220px;
            border-radius: 28px;
            padding: 32px 28px;
            background: linear-gradient(135deg, #2F8E6C 0%, #1F6F54 50%, #123D2E 100%);
            box-shadow: 0 20px 40px -16px rgba(18,61,46,0.45);
        }

        /* Ambient Glows Inside the Card */
        .bills-hero::before {
            content: "";
            position: absolute;
            top: -60px; right: -40px;
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .bills-hero::after {
            content: "";
            position: absolute;
            bottom: -80px; left: -40px;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(201,147,46,0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Mascot Container */
        .bills-mascot-stage {
            position: absolute;
            bottom: 0; right: 10px;
            width: 170px; height: 180px;
            display: flex; align-items: flex-end; justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        .bills-mascot-img {
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: bottom center;
            animation: mascotHover 4.5s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
        }

        /* Speech Bubble */
        .bills-bubble {
            position: absolute;
            z-index: 20;
            right: 140px; top: 45px;
            background: #F1F4EF;
            color: #15231C;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.35;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.4);
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
            min-width: max-content;
        }
        .bills-bubble::after {
            content: "";
            position: absolute;
            bottom: -5px; right: 20px;
            width: 14px; height: 14px;
            background: #F1F4EF;
            transform: rotate(45deg);
            border-radius: 2px;
        }

        @media (max-width: 640px) {
            .bills-hero {
                min-height: 240px;
                padding: 24px 20px;
                border-radius: 24px;
            }
            .bills-mascot-stage {
                right: -5px;
                width: 140px; height: 150px;
            }
            .bills-bubble {
                right: 110px; top: 55px;
                padding: 8px 12px;
                font-size: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up, .spin, .halo-pulse, .tap-scale, .bills-mascot-img, .bills-bubble { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper min-h-screen flex flex-col transition-colors duration-300">

    <div id="root"></div>

    <script type="text/babel">
        // --- GLOBAL COMPONENTS SETUP ---
        window.Icons = {
            Sun: ({ size = 24 }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            ),
            Moon: ({ size = 24 }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            ),
            Trash: ({ size = 24 }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            )
        };
        const Icons = window.Icons;

        window.Logo = window.Logo || (({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-peso">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
            </svg>
        ));

        window.peso = (num) => {
            if (isNaN(num)) return "0.00";
            return Number(num).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[360px] h-[360px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[380px] h-[380px] bg-pesoLight/10 dark:bg-pesoLight/5 rounded-full blur-[100px]" />
                </div>
            );
        }

        // --- MODERN BILLS HERO CARD (DEEP GREEN ESTHETIC) ---
        function BillsHeroCard({ darkMode, toggleDarkMode }) {
            return (
                <div className="bills-hero mb-8">
                    {/* Dark Mode Toggle - Positioned Absolute Top Right */}
                    <div className="absolute top-6 right-6 z-30">
                        <button
                            onClick={toggleDarkMode}
                            aria-label="Toggle Dark Mode"
                            className="tap-scale w-11 h-11 rounded-full bg-black/20 hover:bg-black/30 border border-white/20 flex items-center justify-center text-white shadow-sm backdrop-blur-md transition-colors"
                        >
                            {darkMode ? <Icons.Sun size={18} /> : <Icons.Moon size={18} />}
                        </button>
                    </div>

                    {/* Content */}
                    <div className="relative z-20 max-w-[60%] sm:max-w-[65%] mt-2 sm:mt-4">
                        <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 border border-white/20 text-white mb-4 shadow-sm backdrop-blur-md">
                            <span className="w-2 h-2 rounded-full bg-gold animate-pulse" />
                            <span className="text-[10px] font-bold uppercase tracking-[0.1em]">Paalala</span>
                        </div>
                        <h1 className="font-display text-3xl sm:text-4xl font-bold text-white tracking-tight leading-tight mb-2.5 drop-shadow-md">
                            Bills Center
                        </h1>
                        <p className="text-xs sm:text-sm font-medium text-white/80 max-w-[240px] sm:max-w-sm leading-relaxed">
                            Subaybayan ang due dates para iwas penalty.
                        </p>
                    </div>

                    {/* Speech Bubble */}
                    <div className="bills-bubble">
                        Kaya mo 'yan!<br/>Tipid lang. 💚
                    </div>

                    {/* Mascot */}
                    <div className="bills-mascot-stage">
                        <img
                            src="/assets/bills_mascot.png"
                            alt="Tipid Buddy reviewing bills"
                            className="bills-mascot-img"
                            draggable="false"
                        />
                    </div>
                </div>
            );
        }

        function BillsPage() {
            const { useState, useEffect } = React;
            const [user, setUser] = useState(null);
            const [bills, setBills] = useState([]);
            const [loading, setLoading] = useState(true);
            const [authChecking, setAuthChecking] = useState(true);
            const [componentsReady, setComponentsReady] = useState(false);

            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem("tipid_theme") === "dark" ||
                    (!localStorage.getItem("tipid_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
            });

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem("tipid_theme", "dark");
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem("tipid_theme", "light");
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.BillsCenter && window.Navbar) {
                        setComponentsReady(true);
                        clearInterval(interval);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                let unsub = null;
                let isMounted = true;

                const checkAuth = () => {
                    if (window.TipidAuth) {
                        unsub = window.TipidAuth.onChange((currentUser) => {
                            if (!isMounted) return;
                            if (!currentUser) {
                                window.location.href = "./login.html";
                            } else {
                                setUser(currentUser);
                                setAuthChecking(false);
                            }
                        });
                    } else {
                        setTimeout(checkAuth, 50);
                    }
                };

                checkAuth();

                return () => {
                    isMounted = false;
                    if (typeof unsub === "function") unsub();
                };
            }, []);

            const handleLogout = async () => {
                try {
                    await window.TipidAuth.logOut();
                    window.location.href = "./login.html";
                } catch (err) {
                    console.error("Logout error:", err);
                }
            };

            useEffect(() => {
                if (!user) return;

                let unsubBills = null;

                const loadBills = () => {
                    if (window.TipidData) {
                        unsubBills = window.TipidData.subscribeBills(
                            user.uid,
                            (data) => {
                                setBills(data);
                                setLoading(false);
                            },
                            (err) => {
                                console.error("Error fetching bills:", err);
                                setLoading(false);
                            }
                        );
                    } else {
                        setTimeout(loadBills, 50);
                    }
                };

                loadBills();

                return () => {
                    if (typeof unsubBills === "function") unsubBills();
                };
            }, [user]);

            if (authChecking || !componentsReady) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-3 rounded-[28px] px-10 py-9 shadow-sm">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-14 w-14 rounded-full bg-peso/20 halo-pulse" />
                                <span className="relative w-8 h-8 rounded-full border-2 border-peso border-t-transparent spin" />
                            </div>
                            <p className="text-xs font-mono text-ink2/60 dark:text-paper/60">Nagpapatunay...</p>
                        </div>
                    </div>
                );
            }

            const AppBillsCenter = window.BillsCenter;
            const AppNavbar = window.Navbar;

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />

                    <AppNavbar user={user} onLogout={handleLogout} activeTab="bills" />

                    <main
                        className="max-w-4xl mx-auto w-full px-5 sm:px-6 pt-32 md:pt-14 pb-40 md:pb-16 flex-1"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(env(safe-area-inset-left) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(env(safe-area-inset-right) + 1.25rem))',
                            paddingBottom: 'calc(10rem + env(safe-area-inset-bottom, 0px))',
                        }}
                    >
                        <div className="fade-up">
                            <BillsHeroCard darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
                        </div>

                        <div className="fade-up" style={{ animationDelay: "60ms" }}>
                            <AppBillsCenter uid={user.uid} bills={bills} loading={loading} />
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<BillsPage />);
    </script>
</body>
</html>
