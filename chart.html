<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart — Tipid</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Global Dark Mode Script Initializer -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js UMD Integration -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <style>
        html { background: #F9FAFB; transition: background-color 0.3s; }
        html.dark { background: #111A15; color: #F1F4EF; }

        body { font-feature-settings: "tnum" 1, "lnum" 1; }
        ::selection { background: #C9932E33; color: #15231C; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

        .bar-fill { transition: width 0.9s cubic-bezier(.22,.61,.36,1); }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.08); opacity: 0.85; }
        }
        .logo-breathe { animation: logoBreathe 1.6s ease-in-out infinite; }

        @keyframes haloPulse {
            0%   { transform: scale(0.9); opacity: 0.35; }
            70%  { opacity: 0; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .halo-pulse { animation: haloPulse 1.8s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

        @media (prefers-reduced-motion: reduce) {
            .spin, .fade-up, .bar-fill, .logo-breathe, .halo-pulse {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-ink text-ink dark:text-paper antialiased font-body min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <!-- Global Utilities -->
    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;
        window.useRef = React.useRef;

        window.Logo = function Logo({ size = 30 }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>;
        }

        window.peso = function peso(n) {
            return (n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        window.CATEGORIES = ["Pagkain", "Pamasahe", "Bills", "Load", "Ipon", "Project Components", "Iba pa"];
        window.CATEGORY_COLOR = {
            Pagkain: "#1F6F54", Pamasahe: "#33443A", Bills: "#C9932E",
            Load: "#123D2E", Ipon: "#2F8E6C", "Project Components": "#15231C", "Iba pa": "#B5483B",
        };

        window.startOfMonth = function startOfMonth() {
            const d = new Date();
            d.setDate(1);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        window.useDataReady = function useDataReady() {
            const [ready, setReady] = React.useState(!!window.TipidData);
            React.useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }
    </script>

    <!-- Components -->
    <script type="text/babel" src="./components/Navbar.js"></script>
    <script type="text/babel" src="./components/ExpenseChart.js"></script>

    <!-- Chart Page Application -->
    <script type="text/babel">
        function ChartApp() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();
            const [user, setUser] = React.useState(undefined);
            const [entries, setEntries] = React.useState([]);

            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => setUser(u || null));
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                return window.TipidData.subscribeEntries(
                    user.uid,
                    (list) => setEntries(list),
                    (err) => console.error(err)
                );
            }, [dataReady, user]);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-ink">
                        <div className="flex flex-col items-center gap-4">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/20 halo-pulse" />
                                <div className="relative logo-breathe">
                                    <window.Logo size={40} />
                                </div>
                            </div>
                            <p className="text-xs font-mono tracking-[0.2em] uppercase text-ink2 dark:text-paper/50">
                                Loading your chart
                            </p>
                        </div>
                    </div>
                );
            }

            const logout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            return (
                <div className="min-h-screen relative pb-32">
                    <Navbar user={user} onLogout={logout} activeTab="chart" />

                    <main className="max-w-4xl mx-auto px-6 pt-24 md:pt-10 space-y-6">
                        <div className="fade-up" style={{ animationDelay: "0ms" }}>
                            <h1 className="font-display text-3xl font-semibold text-ink dark:text-paper">Analytics</h1>
                            <p className="text-ink2/60 dark:text-paper/60 mt-1">Review your spending distribution.</p>
                        </div>

                        <div className="fade-up" style={{ animationDelay: "90ms" }}>
                            <ExpenseChart entries={entries} />
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<ChartApp />);
    </script>
</body>
</html>
