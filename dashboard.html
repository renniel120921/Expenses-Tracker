<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Global Dark Mode Script Initializer -->
    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)',
                        'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html { background: #F1F4EF; transition: background-color 0.3s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; }

        body {
            font-feature-settings: "tnum" 1, "lnum" 1;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.85s linear infinite; }

        @keyframes rowIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .row-in { animation: rowIn 0.4s var(--ease-ios) both; }

        .bar-fill { transition: width 1s var(--ease-ios); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.7s var(--ease-ios) both; }

        @keyframes bannerIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .banner-in { animation: bannerIn 0.45s var(--ease-spring) both; }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.08); opacity: 0.85; }
        }
        .logo-breathe { animation: logoBreathe 1.7s ease-in-out infinite; }

        @keyframes haloPulse {
            0%   { transform: scale(0.9); opacity: 0.35; }
            70%  { opacity: 0; }
            100% { transform: scale(1.7); opacity: 0; }
        }
        .halo-pulse { animation: haloPulse 2s var(--ease-ios) infinite; }

        @keyframes heroFloat {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(0, -10px); }
        }
        .hero-float { animation: heroFloat 6s ease-in-out infinite; }

        .glass-panel {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.8);
        }
        html.dark .glass-panel {
            background: rgba(24,38,31,0.55);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .tap-scale { transition: transform 0.15s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.92); }

        .tipid-swal { border-radius: 28px !important; font-family: 'Inter', sans-serif !important; }

        /* Wallet Horizontal Scroll Hidden Scrollbar */
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }

        /* Custom dragging state classes for desktop scroll */
        .is-dragging { cursor: grabbing !important; user-select: none; }
        .is-dragging * { pointer-events: none; }
        .scroll-grab { cursor: grab; }

        @keyframes mascotHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .tipid-mascot-img {
            animation: mascotHover 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(18,61,46,0.35));
        }
        .speech-bubble {
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
            box-shadow: 0 10px 25px -5px rgba(18, 61, 46, 0.25);
        }

        @media (prefers-reduced-motion: reduce) {
            .spin, .row-in, .bar-fill, .fade-up, .banner-in, .logo-breathe, .halo-pulse, .hero-float, .tipid-mascot-img, .speech-bubble {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper antialiased font-body min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;
        window.useRef = React.useRef;
        window.useCallback = React.useCallback;

        function Icon({ path, size = 20, className = "", strokeWidth = 2.2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        // FULL SET OF ICONS TO PREVENT REACT ERROR #130
        window.Icons = {
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Trash: (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2a10 10 0 0 1 10 10"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Inbox: (p) => <Icon {...p} path={<><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></>} />,
            List: (p) => <Icon {...p} path={<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>} />,
            Pencil: (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />,
            Check: (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12"/></>} strokeWidth={3} />,
            TrendUp: (p) => <Icon {...p} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />,
            TrendDown: (p) => <Icon {...p} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            Home: (p) => <Icon {...p} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
            Chart: (p) => <Icon {...p} path={<><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></>} />,
            Category: (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            LogOut: (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />,
            Eye: (p) => <Icon {...p} path={<><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></>} />,
            EyeOff: (p) => <Icon {...p} path={<><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.94 3.71M6.16 6.16A18.6 18.6 0 0 0 1 11s4 7 11 7a10.9 10.9 0 0 0 5.64-1.56M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></>} />,
            Bell: (p) => <Icon {...p} path={<><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>} />,
            Sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
            Chip: (p) => (
                <svg width={p.size || 24} height={p.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={p.className}>
                    <rect x="4" y="4" width="16" height="16" rx="4" />
                    <line x1="4" y1="9" x2="9" y2="9" />
                    <line x1="4" y1="15" x2="9" y2="15" />
                    <line x1="15" y1="9" x2="20" y2="9" />
                    <line x1="15" y1="15" x2="20" y2="15" />
                    <line x1="9" y1="4" x2="9" y2="20" />
                    <line x1="15" y1="4" x2="15" y2="20" />
                </svg>
            ),
            Contactless: (p) => (
                <svg width={p.size || 24} height={p.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={p.className}>
                    <path d="M8.5 21c-2.4-3.8-2.4-14.2 0-18" />
                    <path d="M12.5 18c-1.6-2.5-1.6-9.5 0-12" />
                    <path d="M16.5 15c-.8-1.2-.8-4.8 0-6" />
                </svg>
            )
        };
        const Icons = window.Icons; // Ensures Icons is strictly available in Babel scope

        window.Logo = function Logo({ size = 30 }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>;
        }

        window.peso = function peso(n) {
            return (n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        window.CATEGORIES = ["Pagkain", "Pamasahe", "Bills", "Load", "Ipon", "Project Components", "Iba pa"];
        window.CATEGORY_COLOR = {
            Pagkain: "#1F6F54", Pamasahe: "#33443A", Bills: "#C9932E",
            Load: "#123D2E", Ipon: "#2F8E6C", "Project Components": "#15231C", "Iba pa": "#B5483B",
        };

        window.METHODS = ["Cash", "GCash", "Maya", "Bank", "PayPal"];

        window.startOfMonth = function startOfMonth() {
            const d = new Date();
            d.setDate(1);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        window.useDataReady = function useDataReady() {
            const [ready, setReady] = React.useState(!!window.TipidData);
            React.useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }
    </script>

    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/DashboardSummary.js"></script>
    <script type="text/babel" src="./components/ExpenseChart.js"></script>
    <script type="text/babel" src="./components/ExpenseForm.js"></script>
    <script type="text/babel" src="./components/ExpenseItem.js"></script>
    <script type="text/babel" src="./components/ExpenseList.js"></script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[380px] h-[380px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[400px] h-[400px] bg-gold/10 dark:bg-gold/5 rounded-full blur-[100px]" />
                </div>
            );
        }

        function SectionHeader({ title, subtitle, action }) {
            return (
                <div className="flex items-end justify-between gap-4 mb-4 sm:mb-6 mt-2 ml-1">
                    <div className="min-w-0">
                        <div className="flex items-center gap-2.5 mb-1.5">
                            <span className="w-4 h-[3px] rounded-full bg-peso dark:bg-pesoLight shrink-0" />
                            <h2 className="font-display text-[1.35rem] sm:text-[1.5rem] font-semibold text-ink dark:text-paper tracking-tight leading-tight">
                                {title}
                            </h2>
                        </div>
                        {subtitle && (
                            <p className="text-[12.5px] text-ink2/60 dark:text-paper/50 ml-[1.625rem]">{subtitle}</p>
                        )}
                    </div>
                    {action}
                </div>
            );
        }

        function timeGreeting() {
            const h = new Date().getHours();
            if (h < 12) return "Magandang umaga";
            if (h < 18) return "Magandang hapon";
            return "Magandang gabi";
        }

        function scrollToId(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function NotificationBell({ entries, budget }) {
            const monthlyBudget = budget?.amount || 0;
            const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
            const dailyBudget = monthlyBudget > 0 ? monthlyBudget / daysInMonth : 0;

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            const todayExpenses = entries
                .filter(e => e.type === "expense" && e.date === todayStr)
                .reduce((sum, e) => sum + (e.amount || 0), 0);

            const isOverspent = monthlyBudget > 0 && todayExpenses > dailyBudget;

            const handleBellClick = () => {
                if (monthlyBudget === 0) {
                    Swal.fire({
                        title: "Walang Budget ⚙️",
                        text: "I-set muna ang iyong Monthly Budget sa ibaba para ma-track natin kung nag-o-overspend ka araw-araw.",
                        icon: "info",
                        confirmButtonText: "Sige",
                        confirmButtonColor: "#1F6F54",
                        customClass: { popup: 'tipid-swal' }
                    });
                } else if (isOverspent) {
                    Swal.fire({
                        title: "Alerto sa Gastos! ⚠️",
                        html: `Ang safe daily spending mo ay <b>₱${window.peso(dailyBudget)}</b>, pero gumastos ka na ng <b>₱${window.peso(todayExpenses)}</b> ngayong araw.<br><br>Hinay-hinay lang para hindi maubos ang monthly budget mo!`,
                        icon: "warning",
                        confirmButtonText: "Noted, Salamat",
                        confirmButtonColor: "#B5483B",
                        customClass: { popup: 'tipid-swal' }
                    });
                } else {
                    Swal.fire({
                        title: "Pasok sa Budget! 🎉",
                        html: `Wala kang overspending alerts. Ang safe daily spending mo ay <b>₱${window.peso(dailyBudget)}</b> at nakagastos ka pa lang ng <b>₱${window.peso(todayExpenses)}</b> ngayong araw.<br><br>Keep it up!`,
                        icon: "success",
                        confirmButtonText: "Ayos",
                        confirmButtonColor: "#1F6F54",
                        customClass: { popup: 'tipid-swal' }
                    });
                }
            };

            return (
                <button
                    onClick={handleBellClick}
                    aria-label="Tingnan ang alerts"
                    className="relative tap-scale shrink-0 w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-md flex items-center justify-center transition-colors duration-200 shadow-sm"
                >
                    <Icons.Bell size={20} className="text-paper" strokeWidth={2.2} />
                    {isOverspent && (
                        <span className="absolute top-[0.45rem] right-[0.45rem] w-2.5 h-2.5 bg-[#FF6B6B] border-2 border-pesoDeep rounded-full animate-pulse" />
                    )}
                </button>
            );
        }

        /* --- MODERNIZED HERO CARD --- */
        function HeroCard({ firstName, balance, entries, budget }) {
            const [hidden, setHidden] = React.useState(false);

            return (
                <div className="relative overflow-hidden rounded-[1.75rem] sm:rounded-[2rem] bg-gradient-to-br from-[#247E61] via-[#1A614A] to-[#0F382A] text-paper p-5 sm:p-7 shadow-iosLg ring-1 ring-white/15 min-h-[200px] sm:min-h-[220px] flex flex-col justify-between">
                    <div className="absolute -top-16 -right-10 w-56 h-56 bg-white/[0.08] rounded-full blur-[50px] hero-float pointer-events-none" />
                    <div className="absolute -bottom-24 -left-10 w-60 h-60 bg-[#FFD700]/[0.08] rounded-full blur-[60px] pointer-events-none" />

                    <div className="absolute right-0 bottom-0 w-[140px] sm:w-[170px] h-full pointer-events-none z-0 overflow-visible">
                        <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-24 h-24 bg-white/15 blur-2xl rounded-full"></div>
                        <img
                            src="/assets/tipid_mascot.png"
                            alt="Tipid Buddy"
                            className="absolute bottom-[-10px] sm:bottom-[-15px] right-[-10px] sm:right-2 w-full object-contain tipid-mascot-img"
                            draggable="false"
                        />
                        <div className="speech-bubble absolute top-[15%] right-[60%] sm:right-[70%] bg-paper text-ink rounded-2xl px-3 py-2 text-[10px] sm:text-xs font-semibold leading-tight w-max max-w-[110px] sm:max-w-[130px] border border-white/50">
                            Kaya mo 'yan!<br/>Tipid lang. 🇵🇭
                            <div className="absolute -bottom-1.5 right-6 w-3 h-3 bg-paper rotate-45 border-r border-b border-white/50"></div>
                        </div>
                    </div>

                    <div className="relative z-10 flex flex-col h-full gap-5 sm:gap-6">
                        <div className="flex justify-between items-start gap-3">
                            <div className="min-w-0 flex-1 pr-2">
                                <p className="text-[9px] sm:text-[10px] font-mono font-semibold tracking-[0.2em] uppercase text-paper/80 mb-1.5">
                                    {timeGreeting()}
                                </p>
                                <h1 className="font-display text-[1.4rem] sm:text-[1.75rem] font-bold leading-[1.1] truncate">
                                    Kumusta, {firstName}!
                                </h1>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                <NotificationBell entries={entries} budget={budget} />
                                <button
                                    onClick={() => scrollToId("add-entry")}
                                    aria-label="Magdagdag ng gastos"
                                    className="tap-scale shrink-0 w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-paper text-pesoDeep hover:bg-white flex items-center justify-center transition-colors duration-200 shadow-md"
                                >
                                    <Icons.Plus size={20} strokeWidth={2.4} />
                                </button>
                            </div>
                        </div>

                        <div className="mt-auto pt-2 max-w-[55%] sm:max-w-[65%]">
                            <div className="flex items-center gap-1.5 mb-1">
                                <p className="text-[11px] sm:text-xs font-medium text-paper/80">Kasalukuyang Balanse</p>
                                <button
                                    onClick={() => setHidden(h => !h)}
                                    aria-label={hidden ? "Ipakita ang balanse" : "Itago ang balanse"}
                                    className="text-paper/60 hover:text-paper transition-colors duration-200 p-1 relative z-20 focus:outline-none"
                                >
                                    {hidden ? <Icons.EyeOff size={14} /> : <Icons.Eye size={14} />}
                                </button>
                            </div>
                            <p className="font-mono text-[2rem] sm:text-[2.5rem] font-bold tracking-tight leading-none drop-shadow-md truncate">
                                {hidden ? "₱ ••••••" : `₱${peso(balance)}`}
                            </p>
                            <div className="mt-3.5 inline-flex items-center gap-1.5 rounded-full bg-black/15 border border-white/10 px-2.5 py-1 backdrop-blur-sm">
                                <span className="w-1.5 h-1.5 rounded-full bg-[#FFD700] animate-pulse" />
                                <span className="text-[9px] sm:text-[10px] font-medium text-paper/90 whitespace-nowrap">Kasama mo si Tipid Buddy</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* --- MODERN QUICK ACTIONS --- */
        function QuickActionButton({ icon, label, tone, onClick }) {
            const tones = {
                peso: "bg-[#E6F3EF] text-[#1F6F54] ring-1 ring-black/[0.03] dark:bg-[#1F6F54]/20 dark:text-[#52C8A1] dark:ring-white/[0.06]",
                gold: "bg-[#FDF6E3] text-[#C9932E] ring-1 ring-black/[0.03] dark:bg-[#C9932E]/20 dark:text-[#E8C071] dark:ring-white/[0.06]",
                expense: "bg-[#FAEDE9] text-[#B5483B] ring-1 ring-black/[0.03] dark:bg-[#B5483B]/20 dark:text-[#F38C80] dark:ring-white/[0.06]",
                ink: "bg-[#F0F2F1] text-[#33443A] ring-1 ring-black/[0.03] dark:bg-white/10 dark:text-[#E9EDE6] dark:ring-white/[0.06]",
            };

            return (
                <button onClick={onClick} className="tap-scale flex flex-col items-center gap-2 w-full group focus:outline-none">
                    <div className={`w-[3.25rem] h-[3.25rem] sm:w-[3.75rem] sm:h-[3.75rem] rounded-[18px] sm:rounded-2xl flex items-center justify-center transition-all duration-300 group-hover:-translate-y-0.5 group-hover:shadow-md ${tones[tone] || tones.peso}`}>
                        {icon}
                    </div>
                    <span className="text-[10px] sm:text-[11px] font-medium text-ink2 dark:text-paper/70 text-center leading-tight w-full truncate px-0.5">
                        {label}
                    </span>
                </button>
            );
        }

        function QuickActions() {
            return (
                <div>
                    <SectionHeader title="Mabilisang Aksyon" />
                    <div className="grid grid-cols-4 gap-2 sm:gap-4 justify-items-center">
                        <QuickActionButton icon={<Icons.Plus size={22} />} label="Magdagdag" tone="peso" onClick={() => scrollToId("add-entry")} />
                        <QuickActionButton icon={<Icons.Wallet size={22} />} label="Budget" tone="gold" onClick={() => scrollToId("summary")} />
                        <QuickActionButton icon={<Icons.Chart size={22} />} label="Analytics" tone="expense" onClick={() => scrollToId("analytics")} />
                        <QuickActionButton icon={<Icons.List size={22} />} label="Kasaysayan" tone="ink" onClick={() => scrollToId("history")} />
                    </div>
                </div>
            );
        }

        /* --- MODERN REALISTIC WALLET CARD COMPONENT --- */
        function WalletCard({ uid, method, entries, baseBalance, onSaveBase }) {
            const { useState, useMemo } = React;
            const [editing, setEditing] = useState(false);
            const [inputValue, setInputValue] = useState("");
            const [saving, setSaving] = useState(false);

            const net = useMemo(() => {
                const methodEntries = entries.filter(e => e.method === method);
                const inc = methodEntries.filter(e => e.type === "income").reduce((s, e) => s + (Number(e.amount) || 0), 0);
                const exp = methodEntries.filter(e => e.type !== "income").reduce((s, e) => s + (Number(e.amount) || 0), 0);
                return inc - exp;
            }, [entries, method]);

            const currentBalance = baseBalance + net;

            const handleEdit = () => {
                setInputValue(currentBalance > 0 ? currentBalance.toString() : "");
                setEditing(true);
            };

            const handleSave = async (e) => {
                e.preventDefault();
                const targetBalance = parseFloat(inputValue) || 0;
                const newBase = targetBalance - net;
                setSaving(true);
                await onSaveBase(method, newBase);
                setSaving(false);
                setEditing(false);
            };

            const styles = {
                GCash: {
                    bg: "from-[#0052FE] to-[#007DFE]",
                    text: "GCash",
                    font: "font-sans italic font-extrabold tracking-tighter",
                    logoSize: "text-lg",
                    shadow: "shadow-[#0052FE]/30"
                },
                Maya: {
                    bg: "from-[#111111] via-[#1E1E1E] to-[#2B2B2B]",
                    text: "maya",
                    font: "font-sans font-black tracking-widest",
                    logoSize: "text-lg lowercase",
                    shadow: "shadow-black/40 ring-1 ring-[#48FF91]/20"
                },
                PayPal: {
                    bg: "from-[#003087] to-[#0079C1]",
                    text: "PayPal",
                    font: "font-sans italic font-bold",
                    logoSize: "text-lg",
                    shadow: "shadow-[#003087]/30"
                },
                Bank: {
                    bg: "from-[#D4AF37] via-[#FFE28A] to-[#AA7700]",
                    text: "BANK",
                    font: "font-serif tracking-widest text-[#554400]",
                    logoSize: "text-base font-bold",
                    shadow: "shadow-gold/30 text-[#4A3B00]"
                },
                Cash: {
                    bg: "from-[#1F6F54] to-[#2F8E6C]",
                    text: "CASH",
                    font: "font-display tracking-widest",
                    logoSize: "text-base font-bold",
                    shadow: "shadow-peso/30"
                }
            };
            const theme = styles[method] || styles.Cash;

            const stopPropagation = (e) => e.stopPropagation();

            return (
                <div
                    className={`shrink-0 w-[17rem] h-[10.5rem] rounded-2xl bg-gradient-to-br ${theme.bg} p-5 flex flex-col justify-between shadow-lg ${theme.shadow} relative overflow-hidden transition-transform duration-200 select-none ${theme.text === 'BANK' ? 'text-[#3E3100]' : 'text-white'}`}
                >
                    <div className="absolute -right-8 -top-8 w-32 h-32 bg-white/20 rounded-full blur-2xl pointer-events-none" />
                    <div className="absolute -bottom-10 -left-6 w-24 h-24 bg-black/10 rounded-full blur-xl pointer-events-none" />
                    <div className="absolute inset-0 opacity-[0.03] mix-blend-overlay pointer-events-none" style={{ backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E")' }}></div>

                    <div className="relative z-10 flex justify-between items-start">
                        <span className={`${theme.font} ${theme.logoSize} drop-shadow-sm`}>{theme.text}</span>
                        {!editing && (
                            <button
                                onClick={handleEdit}
                                onMouseDown={stopPropagation}
                                onTouchStart={stopPropagation}
                                className="opacity-50 hover:opacity-100 transition-opacity p-1 active:scale-90"
                                aria-label={`Edit ${method} Balance`}
                            >
                                <Icons.Pencil size={15} />
                            </button>
                        )}
                    </div>

                    {!editing && (
                        <div className="relative z-10 flex items-center justify-between mt-2">
                            <Icons.Chip size={32} className={theme.text === 'BANK' ? 'text-[#8A6A00] opacity-80' : 'text-[#FFD700] opacity-90 drop-shadow-sm'} />
                            <Icons.Contactless size={20} className="opacity-50" />
                        </div>
                    )}

                    <div className="relative z-10 mt-auto">
                        {editing ? (
                            <form onSubmit={handleSave} onMouseDown={stopPropagation} onTouchStart={stopPropagation} className="flex items-center gap-2 mt-2 bg-black/20 p-1.5 rounded-xl backdrop-blur-sm">
                                <input
                                    autoFocus
                                    type="number"
                                    step="0.01"
                                    placeholder="0.00"
                                    value={inputValue}
                                    onChange={e => setInputValue(e.target.value)}
                                    className="w-full bg-transparent text-white placeholder-white/50 px-2 py-1 text-base font-mono focus:outline-none font-bold"
                                />
                                <button type="submit" disabled={saving} className="bg-white/20 hover:bg-white/30 p-2 rounded-lg transition-colors shrink-0 text-white">
                                    {saving ? <Icons.Loader size={16} className="spin" /> : <Icons.Check size={16} />}
                                </button>
                                <button type="button" onClick={() => setEditing(false)} className="bg-black/20 hover:bg-black/40 p-2 rounded-lg transition-colors shrink-0 text-white/80 hover:text-white">
                                    <span className="text-xs font-bold px-0.5">✕</span>
                                </button>
                            </form>
                        ) : (
                            <div>
                                <p className="text-[10px] font-medium opacity-70 mb-0.5 uppercase tracking-wider">Available Balance</p>
                                <p className="font-mono text-2xl font-bold tracking-tight drop-shadow-md">₱{window.peso(currentBalance)}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function WalletsOverview({ uid, entries }) {
            const { useState, useEffect, useRef, useCallback } = React;
            const [baseBalances, setBaseBalances] = useState({});
            const [loading, setLoading] = useState(true);

            const scrollRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [startX, setStartX] = useState(0);
            const [scrollLeft, setScrollLeft] = useState(0);

            const handleMouseDown = useCallback((e) => {
                if (!scrollRef.current) return;
                setIsDragging(true);
                setStartX(e.pageX - scrollRef.current.offsetLeft);
                setScrollLeft(scrollRef.current.scrollLeft);
            }, []);

            const handleMouseLeave = useCallback(() => setIsDragging(false), []);
            const handleMouseUp = useCallback(() => setIsDragging(false), []);

            const handleMouseMove = useCallback((e) => {
                if (!isDragging || !scrollRef.current) return;
                e.preventDefault();
                const x = e.pageX - scrollRef.current.offsetLeft;
                const walk = (x - startX) * 2;
                scrollRef.current.scrollLeft = scrollLeft - walk;
            }, [isDragging, startX, scrollLeft]);

            useEffect(() => {
                if (!uid || !window.db || !window.FirestoreAPI) return;
                const { doc, getDoc } = window.FirestoreAPI;

                getDoc(doc(window.db, "users", uid)).then(snap => {
                    if (snap.exists()) {
                        setBaseBalances(snap.data().wallets || {});
                    }
                    setLoading(false);
                }).catch(err => {
                    console.error("Failed to load wallets:", err);
                    setLoading(false);
                });
            }, [uid]);

            const handleSaveBase = async (method, newBase) => {
                if (!uid || !window.db || !window.FirestoreAPI) return;
                const { doc, setDoc } = window.FirestoreAPI;

                const updatedWallets = { ...baseBalances, [method]: newBase };

                try {
                    await setDoc(doc(window.db, "users", uid), { wallets: updatedWallets }, { merge: true });
                    setBaseBalances(updatedWallets);

                    const Toast = Swal.mixin({
                        toast: true,
                        position: "top-end",
                        showConfirmButton: false,
                        timer: 2000,
                        timerProgressBar: true,
                        customClass: { popup: 'tipid-swal text-sm font-body' }
                    });
                    Toast.fire({ icon: "success", title: "Balance Updated" });

                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'Error', text: 'Hindi ma-save ang balance.', confirmButtonColor: '#B5483B', customClass: { popup: 'tipid-swal' }});
                }
            };

            if (loading) return null;

            return (
                <div className="fade-up">
                    <SectionHeader title="Aking mga Wallet" subtitle="I-edit ang balanse at kusa na itong mababawasan kapag gumastos ka." />
                    <div
                        ref={scrollRef}
                        className={`flex overflow-x-auto gap-4 pb-4 hide-scroll snap-x snap-mandatory ${isDragging ? 'is-dragging' : 'scroll-grab'}`}
                        style={{ paddingLeft: '2px', paddingRight: '20px' }}
                        onMouseDown={handleMouseDown}
                        onMouseLeave={handleMouseLeave}
                        onMouseUp={handleMouseUp}
                        onMouseMove={handleMouseMove}
                    >
                        {window.METHODS.map((method) => (
                            <div key={method} className="snap-start pointer-events-auto">
                                <WalletCard
                                    uid={uid}
                                    method={method}
                                    entries={entries}
                                    baseBalance={baseBalances[method] || 0}
                                    onSaveBase={handleSaveBase}
                                />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        /* --- DASHBOARD MAIN APP --- */
        function Dashboard() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();
            const [user, setUser] = React.useState(undefined);
            const [entries, setEntries] = React.useState([]);
            const [budget, setBudgetState] = React.useState(null);
            const [loadingEntries, setLoadingEntries] = React.useState(true);
            const [dataError, setDataError] = React.useState("");

            React.useEffect(() => {
                if (!authReady) return;
                const unsub = window.TipidAuth.onChange((u) => setUser(u || null));
                return unsub;
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                setLoadingEntries(true);
                const unsub = window.TipidData.subscribeEntries(
                    user.uid,
                    (list) => { setEntries(list); setLoadingEntries(false); },
                    () => { setDataError("Failed to load data. Check Firestore rules."); setLoadingEntries(false); }
                );
                return unsub;
            }, [dataReady, user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                const unsub = window.TipidData.subscribeBudget(user.uid, setBudgetState, () => {});
                return unsub;
            }, [dataReady, user]);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-5 rounded-[32px] px-10 py-10 shadow-ios">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/25 halo-pulse" />
                                <div className="relative logo-breathe">
                                    <window.Logo size={44} />
                                </div>
                            </div>
                            <p className="text-[11px] font-mono font-semibold tracking-widest uppercase text-ink2 dark:text-paper/60 text-center">
                                Loading dashboard
                            </p>
                        </div>
                    </div>
                );
            }

            const logout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            const firstName = user.displayName ? user.displayName.split(" ")[0] : user.email.split("@")[0];

            const totalIncome = entries.filter(e => e.type === "income").reduce((s, e) => s + (e.amount || 0), 0);
            const totalExpense = entries.filter(e => e.type !== "income").reduce((s, e) => s + (e.amount || 0), 0);
            const balance = totalIncome - totalExpense;

            return (
                <div className="min-h-dvh relative">
                    <AmbientBackground />

                    <window.Navbar user={user} onLogout={logout} activeTab="home" />

                    <main
                        className="max-w-[1000px] mx-auto w-full px-5 sm:px-8 pt-[6.5rem] md:pt-10 pb-36 md:pb-20 space-y-9 sm:space-y-12"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(var(--sal) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(var(--sar) + 1.25rem))',
                            paddingBottom: 'calc(8rem + var(--sab))',
                        }}
                    >
                        <div className="fade-up" style={{ animationDelay: "0ms" }}>
                            <HeroCard firstName={firstName} balance={balance} entries={entries} budget={budget} />
                        </div>

                        {dataError && (
                            <div className="banner-in glass-panel flex items-start gap-3 text-[#B5483B] dark:text-[#F38C80] text-sm font-medium border border-expense/20 rounded-2xl px-5 py-4 shadow-sm bg-[#FAEDE9] dark:bg-[#B5483B]/20">
                                <Icons.AlertCircle size={18} className="shrink-0 mt-0.5" /><span>{dataError}</span>
                            </div>
                        )}

                        <div className="fade-up" style={{ animationDelay: "60ms" }}>
                            <QuickActions />
                        </div>

                        <div className="fade-up" style={{ animationDelay: "100ms" }}>
                            <WalletsOverview uid={user.uid} entries={entries} />
                        </div>

                        <div id="summary" className="fade-up scroll-mt-28" style={{ animationDelay: "120ms" }}>
                            <SectionHeader title="Buod ng Buwan" subtitle="Kita, gastos, at natitirang budget" />
                            <window.SmartSummary uid={user.uid} entries={entries} budget={budget} />
                        </div>

                        <div id="analytics" className="fade-up scroll-mt-28" style={{ animationDelay: "180ms" }}>
                            <SectionHeader title="Uso ng Paggastos" subtitle="Saan napupunta ang pera mo" />
                            <window.ExpenseChart entries={entries} />
                        </div>

                        <div id="add-entry" className="fade-up scroll-mt-28" style={{ animationDelay: "240ms" }}>
                            <SectionHeader title="Magdagdag ng Gastos" />
                            <window.AddEntryForm uid={user.uid} entries={entries} />
                        </div>

                        <div id="history" className="fade-up scroll-mt-28" style={{ animationDelay: "300ms" }}>
                            <SectionHeader
                                title="Kasaysayan"
                                action={<span className="text-[11px] font-mono font-medium bg-black/5 dark:bg-white/10 px-2.5 py-1 rounded-full text-ink2/60 dark:text-paper/50 shrink-0">{entries.length} entries</span>}
                            />
                            <window.EntryList uid={user.uid} entries={entries} loading={loadingEntries} />
                        </div>
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");
            if (typeof window.SmartSummary !== "function") missingNames.push("SmartSummary");
            if (typeof window.ExpenseChart !== "function") missingNames.push("ExpenseChart");
            if (typeof window.AddEntryForm !== "function") missingNames.push("AddEntryForm");
            if (typeof window.EntryList !== "function") missingNames.push("EntryList");
            if (typeof window.ExpenseItem !== "function") missingNames.push("ExpenseItem");

            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
                return;
            }
            if (attempt > 100) {
                document.getElementById("root").innerHTML =
                    `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Inter,sans-serif;text-align:center;color:#15231C;">
                        <div>
                            <p style="font-weight:600;margin-bottom:0.5rem;">Failed to load: ${missingNames.join(", ")}</p>
                            <p style="font-size:0.875rem;opacity:0.7;">Check the file path (Network tab) and that each component's export name matches what dashboard.html expects.</p>
                        </div>
                    </div>`;
                return;
            }
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>

    <!-- PWA Service Worker Registration & Auto-Update Alert -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                Swal.fire({
                                    title: "May Bagong Update! 🎉",
                                    text: "May in-add kaming bagong features sa Tipid App. I-refresh ang app para magamit ito.",
                                    icon: "info",
                                    confirmButtonText: "I-update Ngayon",
                                    confirmButtonColor: "#1F6F54",
                                    allowOutsideClick: false,
                                    customClass: { popup: "tipid-swal" }
                                }).then(() => {
                                    window.location.reload();
                                });
                            }
                        });
                    });
                }).catch(err => console.error("Service Worker registration failed:", err));
            });
        }
    </script>
</body>
</html>
