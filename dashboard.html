<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Tipid</title>
    <meta name="theme-color" content="#15231C">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module" src="/firebase.js"></script>
    <script type="module" src="/firebase-auth.js"></script>
    <script type="module" src="/firebase-data.js"></script>

    <style>
        html { background: #F1F4EF; }
        body { font-feature-settings: "tnum" 1, "lnum" 1; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        .ledger-rule { background-image: repeating-linear-gradient(to right, #D3DAD0 0, #D3DAD0 6px, transparent 6px, transparent 14px); height: 1px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }

        @keyframes rowIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .row-in { animation: rowIn 0.3s ease-out both; }

        @keyframes pulseTotal { 0% { transform: scale(1); } 30% { transform: scale(1.05); color: #1F6F54; } 100% { transform: scale(1); } }
        .pulse-total { animation: pulseTotal 0.5s ease-out; }

        .bar-fill { transition: width 0.9s cubic-bezier(.22,.61,.36,1); }

        @media (prefers-reduced-motion: reduce) { .spin, .row-in, .pulse-total, .bar-fill { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="bg-paper text-ink antialiased font-body min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        /* ---------- Icons ---------- */

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }
        const Icons = {
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Trash: (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Inbox: (p) => <Icon {...p} path={<><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></>} />,
        };

        function Logo({ light = false, size = 30 }) {
            const [broken, setBroken] = useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return (
                <span style={{ width: size, height: size }} className={`rounded-md flex items-center justify-center font-display font-semibold ${light ? "bg-white/10 text-paper" : "bg-ink text-paper"}`}>₱</span>
            );
        }

        function peso(n) {
            return (n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        const CATEGORIES = ["Pagkain", "Pamasahe", "Bills", "Load", "Ipon", "Iba pa"];
        const CATEGORY_COLOR = {
            Pagkain: "bg-peso",
            Pamasahe: "bg-ink2",
            Bills: "bg-gold",
            Load: "bg-pesoDeep",
            Ipon: "bg-pesoLight",
            "Iba pa": "bg-expense",
        };

        function startOfWeek() {
            const d = new Date();
            const day = (d.getDay() + 6) % 7; // Monday = 0
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() - day);
            return d;
        }

        function useAuthReady() {
            const [ready, setReady] = useState(!!window.TipidAuth);
            useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        function useDataReady() {
            const [ready, setReady] = useState(!!window.TipidData);
            useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }

        /* ---------- Add expense form ---------- */

        function AddExpenseForm({ uid, onAdded }) {
            const [desc, setDesc] = useState("");
            const [amount, setAmount] = useState("");
            const [category, setCategory] = useState(CATEGORIES[0]);
            const [saving, setSaving] = useState(false);
            const [error, setError] = useState("");

            const submit = async (e) => {
                e.preventDefault();
                const amt = parseFloat(amount);
                if (!desc.trim()) return setError("Ilagay kung ano ang binili.");
                if (!amt || amt <= 0) return setError("Ilagay ang halaga.");
                setError("");
                setSaving(true);
                try {
                    await window.TipidData.addExpense(uid, { desc: desc.trim(), amount: amt, category });
                    setDesc("");
                    setAmount("");
                    onAdded && onAdded();
                } catch (err) {
                    setError("Hindi na-save. Subukan ulit.");
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div className="bg-white rounded-2xl border border-line shadow-sm p-6 sm:p-7">
                    <h2 className="font-display text-xl font-semibold text-ink mb-4">Magdagdag ng Gastos</h2>

                    {error && (
                        <div className="mb-4 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-2.5">
                            <Icons.AlertCircle size={15} className="shrink-0 mt-0.5" /><span>{error}</span>
                        </div>
                    )}

                    <form onSubmit={submit} className="flex flex-col sm:flex-row gap-3">
                        <input
                            type="text" value={desc} onChange={e => setDesc(e.target.value)}
                            placeholder="e.g., Tricycle papuntang trabaho"
                            className="flex-1 min-w-0 bg-paperDim/60 border border-line rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-peso/40"
                        />
                        <input
                            type="number" inputMode="decimal" value={amount} onChange={e => setAmount(e.target.value)}
                            placeholder="₱0.00"
                            className="sm:w-32 bg-paperDim/60 border border-line rounded-xl px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-peso/40"
                        />
                        <select
                            value={category} onChange={e => setCategory(e.target.value)}
                            className="sm:w-40 bg-paperDim/60 border border-line rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-peso/40"
                        >
                            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <button type="submit" disabled={saving}
                            className="bg-peso hover:bg-pesoLight disabled:opacity-60 text-paper font-semibold rounded-xl px-6 py-3 text-sm flex items-center justify-center gap-2 transition-colors shrink-0">
                            {saving ? <Icons.Loader size={16} className="spin" /> : <Icons.Plus size={16} />}
                            {saving ? "Sinasave..." : "Idagdag"}
                        </button>
                    </form>
                </div>
            );
        }

        /* ---------- Weekly summary ---------- */

        function WeeklySummary({ expenses }) {
            const weekStart = useMemo(() => startOfWeek(), []);
            const thisWeek = useMemo(() => expenses.filter(e => !e.createdAt || e.createdAt.toDate() >= weekStart), [expenses, weekStart]);
            const total = thisWeek.reduce((s, e) => s + (e.amount || 0), 0);

            const byCategory = useMemo(() => {
                const totals = {};
                thisWeek.forEach(e => { totals[e.category] = (totals[e.category] || 0) + (e.amount || 0); });
                return CATEGORIES
                    .map(c => ({ label: c, amount: totals[c] || 0 }))
                    .filter(c => c.amount > 0)
                    .sort((a, b) => b.amount - a.amount);
            }, [thisWeek]);

            return (
                <div className="grid md:grid-cols-[minmax(0,1fr)_minmax(0,1.3fr)] gap-6">
                    <div className="bg-white rounded-2xl border border-line shadow-sm p-7 flex flex-col justify-center">
                        <p className="text-xs font-mono tracking-[0.2em] uppercase text-peso mb-3">Ngayong Linggo</p>
                        <p className="font-mono text-4xl font-semibold text-ink">₱{peso(total)}</p>
                        <p className="text-sm text-ink2 mt-1.5">{thisWeek.length} {thisWeek.length === 1 ? "entry" : "entries"}</p>
                    </div>

                    <div className="bg-white rounded-2xl border border-line shadow-sm p-7">
                        <p className="text-xs font-mono tracking-[0.2em] uppercase text-peso mb-4">Breakdown</p>
                        {byCategory.length === 0 ? (
                            <p className="text-sm text-ink2/60 italic">Wala pang gastos ngayong linggo.</p>
                        ) : (
                            <div className="space-y-3.5">
                                {byCategory.map(c => (
                                    <div key={c.label}>
                                        <div className="flex justify-between text-sm mb-1.5">
                                            <span className="font-medium text-ink">{c.label}</span>
                                            <span className="font-mono text-ink2">₱{peso(c.amount)}</span>
                                        </div>
                                        <div className="h-2 bg-paperDim rounded-full overflow-hidden">
                                            <div className={`bar-fill h-full rounded-full ${CATEGORY_COLOR[c.label] || "bg-peso"}`}
                                                 style={{ width: total ? `${(c.amount / total) * 100}%` : "0%" }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* ---------- Expense list ---------- */

        function ExpenseList({ uid, expenses, loading }) {
            const [deletingId, setDeletingId] = useState(null);

            const remove = async (id) => {
                setDeletingId(id);
                try {
                    await window.TipidData.deleteExpense(uid, id);
                } catch (err) {
                    // onSnapshot will just keep showing the item if delete failed
                } finally {
                    setDeletingId(null);
                }
            };

            const formatDate = (ts) => {
                if (!ts) return "Ngayon lang";
                return ts.toDate().toLocaleDateString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
            };

            return (
                <div className="bg-white rounded-2xl border border-line shadow-sm overflow-hidden">
                    <div className="px-6 sm:px-7 py-5 border-b border-line flex items-center justify-between">
                        <h2 className="font-display text-xl font-semibold text-ink">Kasaysayan</h2>
                        <span className="font-mono text-xs text-ink2/60">{expenses.length} total</span>
                    </div>

                    {loading ? (
                        <div className="py-16 flex justify-center">
                            <Icons.Loader size={20} className="spin text-peso" />
                        </div>
                    ) : expenses.length === 0 ? (
                        <div className="py-16 flex flex-col items-center gap-3 text-ink2/50">
                            <Icons.Inbox size={26} />
                            <p className="text-sm">Wala pang gastos na naka-log. Simulan sa itaas.</p>
                        </div>
                    ) : (
                        <ul className="divide-y divide-line max-h-[28rem] overflow-y-auto">
                            {expenses.map(e => (
                                <li key={e.id} className="row-in flex items-center justify-between gap-3 px-6 sm:px-7 py-4 group">
                                    <div className="min-w-0">
                                        <p className="font-medium text-ink truncate">{e.desc}</p>
                                        <p className="font-mono text-[11px] text-ink2/60 mt-0.5">{e.category} · {formatDate(e.createdAt)}</p>
                                    </div>
                                    <div className="flex items-center gap-3 shrink-0">
                                        <span className="font-mono text-expense">-₱{peso(e.amount)}</span>
                                        <button
                                            onClick={() => remove(e.id)}
                                            disabled={deletingId === e.id}
                                            aria-label="Delete entry"
                                            className="opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity text-ink2/40 hover:text-expense disabled:opacity-100"
                                        >
                                            {deletingId === e.id ? <Icons.Loader size={15} className="spin" /> : <Icons.Trash size={15} />}
                                        </button>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        }

        /* ---------- Dashboard ---------- */

        function Dashboard() {
            const authReady = useAuthReady();
            const dataReady = useDataReady();
            const [user, setUser] = useState(undefined); // undefined = checking, null = signed out
            const [expenses, setExpenses] = useState([]);
            const [loadingExpenses, setLoadingExpenses] = useState(true);
            const [dataError, setDataError] = useState("");

            useEffect(() => {
                if (!authReady) return;
                const unsub = window.TipidAuth.onChange((u) => setUser(u || null));
                return unsub;
            }, [authReady]);

            useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            useEffect(() => {
                if (!dataReady || !user) return;
                setLoadingExpenses(true);
                const unsub = window.TipidData.subscribeExpenses(
                    user.uid,
                    (list) => { setExpenses(list); setLoadingExpenses(false); },
                    (err) => { setDataError("Hindi ma-load ang datos. Tingnan ang Firestore rules mo."); setLoadingExpenses(false); }
                );
                return unsub;
            }, [dataReady, user]);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <Icons.Loader size={22} className="spin text-peso" />
                    </div>
                );
            }

            const logout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            return (
                <div className="min-h-screen">
                    <nav className="border-b border-line px-6 py-4 flex justify-between items-center bg-white/70 backdrop-blur-sm sticky top-0 z-10">
                        <a href="index.html" className="flex items-center gap-2.5">
                            <Logo size={28} />
                            <span className="font-display font-semibold text-lg text-ink">Tipid</span>
                        </a>
                        <div className="flex items-center gap-4">
                            <span className="text-sm text-ink2 hidden sm:inline">
                                {user.displayName ? user.displayName.split(" ")[0] : user.email}
                            </span>
                            <button onClick={logout} className="text-sm font-semibold text-ink2 hover:text-expense transition-colors">Mag-log out</button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto px-6 py-10 space-y-6">
                        <div>
                            <p className="text-xs font-mono tracking-[0.2em] uppercase text-peso mb-2">Naka-log in</p>
                            <h1 className="font-display text-3xl font-semibold text-ink">
                                Kumusta, {user.displayName ? user.displayName.split(" ")[0] : user.email.split("@")[0]}!
                            </h1>
                        </div>

                        {dataError && (
                            <div className="flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-4 py-3">
                                <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" /><span>{dataError}</span>
                            </div>
                        )}

                        <WeeklySummary expenses={expenses} />
                        <AddExpenseForm uid={user.uid} />
                        <ExpenseList uid={user.uid} expenses={expenses} loading={loadingExpenses} />
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
    </script>
</body>
</html>
