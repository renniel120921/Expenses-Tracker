<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Tipid</title>
    <meta name="theme-color" content="#15231C">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module" src="/assets/firebase-config.js"></script>
    <script type="module" src="/assets/firebase-auth.js"></script>

    <style>
        html { background: #F1F4EF; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="bg-paper text-ink antialiased font-body min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function useAuthReady() {
            const [ready, setReady] = useState(!!window.TipidAuth);
            useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        function Dashboard() {
            const authReady = useAuthReady();
            const [user, setUser] = useState(undefined); // undefined = checking, null = signed out

            useEffect(() => {
                if (!authReady) return;
                const unsub = window.TipidAuth.onChange((u) => setUser(u || null));
                return unsub;
            }, [authReady]);

            useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                             strokeLinecap="round" className="spin text-peso">
                            <path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/>
                            <path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/>
                            <path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/>
                        </svg>
                    </div>
                );
            }

            const logout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            return (
                <div className="min-h-screen">
                    <nav className="border-b border-line px-6 py-4 flex justify-between items-center">
                        <span className="font-display font-semibold text-lg">Tipid</span>
                        <button onClick={logout} className="text-sm font-semibold text-ink2 hover:text-expense transition-colors">Mag-log out</button>
                    </nav>
                    <div className="max-w-lg mx-auto px-6 py-24 text-center">
                        <p className="text-xs font-mono tracking-[0.2em] uppercase text-peso mb-3">Naka-log in</p>
                        <h1 className="font-display text-3xl font-semibold text-ink mb-3">
                            Kumusta, {user.displayName ? user.displayName.split(" ")[0] : user.email}!
                        </h1>
                        <p className="text-ink2 mb-1">{user.email}</p>
                        <p className="text-ink2/60 text-sm mt-8">Gumagana na ang sign up / log in. Dito na idadagdag ang totoong expense tracker view.</p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
    </script>
</body>
</html>
