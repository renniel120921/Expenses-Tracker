<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipid — Know Where It Went</title>
    <meta name="description" content="Tipid is an offline-ready expense tracker built for how Filipinos actually spend. Log it in seconds, see it sorted automatically.">

    <!-- PWA -->
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#15231C">

    <!-- Fonts: Fraunces (display/ledger serif), Inter (body), IBM Plex Mono (amounts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF',
                        paperDim: '#E9EDE6',
                        ink: '#15231C',
                        ink2: '#33443A',
                        peso: '#1F6F54',
                        pesoLight: '#2F8E6C',
                        pesoDeep: '#123D2E',
                        gold: '#C9932E',
                        expense: '#B5483B',
                        line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Module (kept for backend connection) -->
    <script type="module" src="/firebase.js"></script>

    <style>
        html { background: #F1F4EF; }
        body { font-feature-settings: "tnum" 1, "lnum" 1; }

        ::selection { background: #C9932E33; color: #15231C; }

        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        /* Ledger rule texture for section dividers */
        .ledger-rule {
            background-image: repeating-linear-gradient(to right, #D3DAD0 0, #D3DAD0 6px, transparent 6px, transparent 14px);
            height: 1px;
        }

        /* Receipt perforated edge */
        .perf-edge {
            -webkit-mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            -webkit-mask-repeat: repeat-x;
            mask-repeat: repeat-x;
            -webkit-mask-position: -5px -5px;
            mask-position: -5px -5px;
            -webkit-mask-size: 20px 10px;
            mask-size: 20px 10px;
        }

        @keyframes rowIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .row-in { animation: rowIn 0.35s ease-out both; }

        @keyframes pulseTotal {
            0% { transform: scale(1); }
            30% { transform: scale(1.06); color: #1F6F54; }
            100% { transform: scale(1); }
        }
        .pulse-total { animation: pulseTotal 0.5s ease-out; }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(-1.2deg); }
            50% { transform: translateY(-10px) rotate(-0.2deg); }
        }
        .float-slow { animation: floatSlow 6s ease-in-out infinite; }

        .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s cubic-bezier(.22,.61,.36,1), transform 0.7s cubic-bezier(.22,.61,.36,1); }
        .reveal.in { opacity: 1; transform: translateY(0); }

        .faq-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease; }
        .faq-panel.open { grid-template-rows: 1fr; }
        .faq-panel > div { overflow: hidden; }

        @media (prefers-reduced-motion: reduce) {
            .row-in, .pulse-total, .float-slow, .reveal { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; }
        }

        .bar-fill { transition: width 1.1s cubic-bezier(.22,.61,.36,1); }
    </style>
</head>
<body class="bg-paper text-ink antialiased font-body">

    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useState, useRef, useCallback } = React;

        /* ---------- Utility hooks ---------- */

        // Reveals a section when it scrolls into view
        function Reveal({ children, className = "", delay = 0 }) {
            const ref = useRef(null);
            const [inView, setInView] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setInView(true);
                        obs.disconnect();
                    }
                }, { threshold: 0.15 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            return (
                <div ref={ref} className={`reveal ${inView ? "in" : ""} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        }

        // Animated count-up, triggers once visible
        function CountUp({ to, prefix = "", suffix = "", duration = 1200 }) {
            const ref = useRef(null);
            const [val, setVal] = useState(0);
            const started = useRef(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting && !started.current) {
                        started.current = true;
                        const start = performance.now();
                        const step = (now) => {
                            const p = Math.min(1, (now - start) / duration);
                            const eased = 1 - Math.pow(1 - p, 3);
                            setVal(Math.round(eased * to));
                            if (p < 1) requestAnimationFrame(step);
                        };
                        requestAnimationFrame(step);
                        obs.disconnect();
                    }
                }, { threshold: 0.4 });
                obs.observe(el);
                return () => obs.disconnect();
            }, [to, duration]);
            return <span ref={ref}>{prefix}{val}{suffix}</span>;
        }

        function peso(n) {
            return n.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        /* ---------- Icon set (lucide-style, inline — no external fetch) ---------- */

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        const Icons = {
            Menu: (p) => <Icon {...p} path={<><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></>} />,
            Close: (p) => <Icon {...p} path={<><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></>} />,
            Download: (p) => <Icon {...p} path={<><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></>} />,
            ArrowRight: (p) => <Icon {...p} path={<><line x1="5" y1="12" x2="19" y2="12"/><path d="m13 6 6 6-6 6"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Trash: (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Chevron: (p) => <Icon {...p} path={<path d="m6 9 6 6 6-6"/>} />,
            Clock: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></>} />,
            WifiOff: (p) => <Icon {...p} path={<><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5.05A15 15 0 0 1 22 8.82"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.4"/><path d="M5 12.55a10 10 0 0 1 5.17-2.8"/><path d="M8.53 16.11a5 5 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/><line x1="2" y1="2" x2="22" y2="22"/></>} />,
            Folders: (p) => <Icon {...p} path={<><path d="M4 20h13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2Z"/></>} />,
            Lock: (p) => <Icon {...p} path={<><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></>} />,
            BarChart: (p) => <Icon {...p} path={<><line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/></>} />,
            Bell: (p) => <Icon {...p} path={<><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></>} />,
        };

        /* ---------- Logo (swap in your own file — falls back to the mark below if missing) ---------- */

        // Drop your logo at /assets/logo.svg (or .png) — update LOGO_SRC and it'll be used automatically.
        const LOGO_SRC = "/assets/logo.svg";

        function Logo({ light = false, size = 32 }) {
            const [broken, setBroken] = useState(false);
            if (!broken) {
                return (
                    <img
                        src={LOGO_SRC}
                        alt="Tipid logo"
                        width={size}
                        height={size}
                        onError={() => setBroken(true)}
                        style={{ width: size, height: size, objectFit: "contain" }}
                        className="rounded-md"
                    />
                );
            }
            // Fallback mark, used only until LOGO_SRC resolves
            return (
                <span
                    style={{ width: size, height: size }}
                    className={`rounded-md flex items-center justify-center font-display font-semibold ${light ? "bg-white/10 text-paper" : "bg-ink text-paper"}`}
                >
                    ₱
                </span>
            );
        }

        /* ---------- Swappable image slot (falls back to a labeled placeholder, never a broken-image icon) ---------- */

        function AppImage({ src, alt, className = "", ratio = "aspect-[9/16]" }) {
            const [broken, setBroken] = useState(false);
            if (broken) {
                return (
                    <div className={`${ratio} ${className} rounded-2xl border-2 border-dashed border-line bg-paperDim/60 flex flex-col items-center justify-center gap-2 text-ink2/50 p-6 text-center`}>
                        <Icons.Plus size={22} />
                        <p className="text-xs font-mono leading-relaxed">Drop your screenshot at<br/><span className="text-ink2/70">{src}</span></p>
                    </div>
                );
            }
            return (
                <img src={src} alt={alt} onError={() => setBroken(true)} className={`${ratio} ${className} object-cover rounded-2xl`} />
            );
        }

        /* ---------- Shared Button ---------- */

        function Button({ as = "button", href, onClick, type = "button", variant = "primary", icon: IconCmp, children, className = "" }) {
            const base = "inline-flex items-center justify-center gap-2 font-semibold rounded-full transition-colors py-3.5 px-8";
            const variants = {
                primary: "bg-ink hover:bg-pesoDeep text-paper",
                peso: "bg-peso hover:bg-pesoLight text-paper",
                outline: "border border-line hover:border-peso text-ink",
                outlineDark: "border border-white/25 hover:border-white/50 text-paper",
                paper: "bg-paper text-ink hover:bg-white",
            };
            const cls = `${base} ${variants[variant] || variants.primary} ${className}`;
            const content = <>{IconCmp && <IconCmp size={18} />}{children}</>;
            if (as === "a") return <a href={href} onClick={onClick} className={cls}>{content}</a>;
            return <button type={type} onClick={onClick} className={cls}>{content}</button>;
        }

        /* ---------- Navbar ---------- */

        function Navbar() {
            const [scrolled, setScrolled] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => {
                const onScroll = () => setScrolled(window.scrollY > 12);
                window.addEventListener("scroll", onScroll);
                return () => window.removeEventListener("scroll", onScroll);
            }, []);

            const links = [
                { href: "#features", label: "Features" },
                { href: "#how-it-works", label: "How it Works" },
                { href: "#insights", label: "Insights" },
                { href: "#faq", label: "FAQ" },
            ];

            return (
                <nav className={`sticky top-0 z-50 border-b transition-all duration-300 ${scrolled ? "bg-paper/90 backdrop-blur-md border-line py-2.5 shadow-[0_1px_0_0_rgba(0,0,0,0.02)]" : "bg-paper/60 backdrop-blur-sm border-transparent py-4"}`}>
                    <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                        <a href="#" className="flex items-center gap-2.5 group">
                            <span className="transition-transform group-hover:-rotate-6"><Logo size={32} /></span>
                            <span className="text-xl font-display font-semibold tracking-tight text-ink">Tipid</span>
                        </a>

                        <div className="hidden md:flex items-center gap-9">
                            {links.map(l => (
                                <a key={l.href} href={l.href} className="text-sm font-medium text-ink2 hover:text-peso transition-colors">{l.label}</a>
                            ))}
                        </div>

                        <div className="hidden md:flex items-center gap-3">
                            <button onClick={() => window.installPWA && window.installPWA()} className="text-sm font-semibold text-ink2 hover:text-peso transition-colors px-2 flex items-center gap-1.5">
                                <Icons.Download size={15} /> Install PWA
                            </button>
                            <Button as="a" href="#hero" variant="peso" className="!py-2.5 !px-5 text-sm">Open Web App</Button>
                        </div>

                        <button aria-label="Toggle menu" onClick={() => setMenuOpen(v => !v)} className="md:hidden w-9 h-9 flex items-center justify-center text-ink">
                            {menuOpen ? <Icons.Close size={24} /> : <Icons.Menu size={24} />}
                        </button>
                    </div>

                    <div className={`md:hidden overflow-hidden transition-all duration-300 ${menuOpen ? "max-h-80 border-t border-line mt-2.5" : "max-h-0"}`}>
                        <div className="max-w-6xl mx-auto px-6 py-4 flex flex-col gap-4">
                            {links.map(l => (
                                <a key={l.href} href={l.href} onClick={() => setMenuOpen(false)} className="text-sm font-medium text-ink2">{l.label}</a>
                            ))}
                            <Button as="a" href="#hero" variant="peso" className="!py-2.5 text-sm mt-1" onClick={() => setMenuOpen(false)}>Open Web App</Button>
                        </div>
                    </div>
                </nav>
            );
        }

        /* ---------- Hero + live receipt widget ---------- */

        const DEMO_ITEMS = [
            { desc: "Barya sa jeep", cat: "Pamasahe", amount: 15 },
            { desc: "Kape sa umaga", cat: "Pagkain", amount: 65 },
            { desc: "Load — 1GB", cat: "Load", amount: 20 },
        ];

        function ReceiptWidget() {
            const [items, setItems] = useState(() => DEMO_ITEMS.map((it, i) => ({ ...it, id: i })));
            const [desc, setDesc] = useState("");
            const [amount, setAmount] = useState("");
            const [pulse, setPulse] = useState(false);
            const nextId = useRef(DEMO_ITEMS.length);

            const total = items.reduce((s, it) => s + it.amount, 0);

            const addItem = (e) => {
                e.preventDefault();
                const amt = parseFloat(amount);
                if (!desc.trim() || !amt || amt <= 0) return;
                setItems(prev => [{ id: nextId.current++, desc: desc.trim(), cat: "Iba pa", amount: amt }, ...prev]);
                setDesc("");
                setAmount("");
                setPulse(true);
                setTimeout(() => setPulse(false), 500);
            };

            const removeItem = (id) => setItems(prev => prev.filter(it => it.id !== id));

            return (
                <div className="relative">
                    <div className="absolute -inset-3 bg-gradient-to-br from-peso/25 to-gold/20 rounded-[28px] blur-2xl"></div>
                    <div className="relative bg-white rounded-2xl shadow-2xl border border-line float-slow">
                        <div className="px-7 pt-6 pb-4">
                            <div className="flex items-center justify-between mb-1">
                                <p className="font-mono text-[11px] tracking-[0.2em] text-ink2 uppercase">Tipid Receipt</p>
                                <span className="w-2 h-2 rounded-full bg-peso"></span>
                            </div>
                            <p className="font-mono text-[11px] text-ink2/70">Ngayong Linggo · This Week</p>
                        </div>

                        <div className="ledger-rule mx-7"></div>

                        <ul className="px-7 py-4 space-y-2.5 max-h-52 overflow-y-auto">
                            {items.map(it => (
                                <li key={it.id} className="row-in flex items-center justify-between gap-3 text-sm group">
                                    <div className="min-w-0">
                                        <p className="font-medium text-ink truncate">{it.desc}</p>
                                        <p className="font-mono text-[11px] text-ink2/70">{it.cat}</p>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0">
                                        <span className="font-mono text-expense">-₱{peso(it.amount)}</span>
                                        <button onClick={() => removeItem(it.id)} aria-label="Remove" className="opacity-0 group-hover:opacity-100 transition-opacity text-ink2/50 hover:text-expense">
                                            <Icons.Close size={14} strokeWidth={2.5} />
                                        </button>
                                    </div>
                                </li>
                            ))}
                            {items.length === 0 && (
                                <li className="text-sm text-ink2/60 italic py-2">Wala pang laman — add your first entry below.</li>
                            )}
                        </ul>

                        <div className="ledger-rule mx-7"></div>

                        <div className="px-7 py-4 flex items-center justify-between">
                            <span className="font-display italic text-ink2 text-sm">Total</span>
                            <span className={`font-mono font-semibold text-lg text-ink ${pulse ? "pulse-total" : ""}`}>₱{peso(total)}</span>
                        </div>

                        <form onSubmit={addItem} className="perf-edge bg-paperDim/70 px-7 pt-4 pb-5 flex gap-2 border-t border-dashed border-line">
                            <input
                                type="text"
                                value={desc}
                                onChange={e => setDesc(e.target.value)}
                                placeholder="e.g., Tricycle"
                                className="flex-1 min-w-0 bg-white border border-line rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-peso/40"
                            />
                            <input
                                type="number"
                                inputMode="decimal"
                                value={amount}
                                onChange={e => setAmount(e.target.value)}
                                placeholder="₱0"
                                className="w-20 bg-white border border-line rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-peso/40"
                            />
                            <button type="submit" aria-label="Add entry" className="bg-ink hover:bg-pesoDeep text-paper rounded-lg w-10 h-10 flex items-center justify-center shrink-0 transition-colors">
                                <Icons.Plus size={18} strokeWidth={2.5} />
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function Hero() {
            return (
                <section id="hero" className="relative overflow-hidden py-16 lg:py-24">
                    <div className="absolute top-[-120px] right-[-160px] w-[480px] h-[480px] bg-peso/10 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-100px] left-[-140px] w-[420px] h-[420px] bg-gold/10 rounded-full blur-3xl"></div>

                    <div className="max-w-6xl mx-auto px-6 relative grid lg:grid-cols-2 gap-16 items-center">
                        <div>
                            <span className="inline-flex items-center gap-2 text-[11px] font-mono tracking-[0.2em] uppercase text-peso bg-peso/10 border border-peso/20 rounded-full px-3.5 py-1.5 mb-7">
                                Para sa may tipid na isip
                            </span>
                            <h1 className="font-display text-[2.75rem] leading-[1.08] sm:text-6xl sm:leading-[1.05] font-semibold text-ink tracking-tight mb-6">
                                Alam mo ba<br/>
                                saan napunta<br/>
                                <span className="italic text-peso">ang sahod mo?</span>
                            </h1>
                            <p className="text-ink2 text-lg leading-relaxed max-w-md mb-9">
                                Tipid is an expense tracker built for how Filipinos actually spend — jeep fare, load, ulam money, and all. Log it in seconds. See exactly where it went.
                            </p>
                            <div className="flex flex-col sm:flex-row gap-3.5">
                                <Button as="a" href="#features" variant="primary" icon={Icons.ArrowRight}>See how it works</Button>
                                <Button onClick={() => window.installPWA && window.installPWA()} variant="outline" icon={Icons.Download}>Install PWA</Button>
                            </div>
                            <p className="text-xs text-ink2/60 mt-5 font-mono">No card needed · Works offline · ₱0 to start</p>
                        </div>

                        <div data-aos="fade-left">
                            <ReceiptWidget />
                            <p className="text-center text-xs text-ink2/50 mt-5 font-mono">↑ try it — add your own entry above</p>
                        </div>
                    </div>
                </section>
            );
        }

        /* ---------- Stat strip ---------- */

        function StatStrip() {
            const stats = [
                { to: 3, suffix: "s", label: "Average time to log one expense" },
                { to: 100, suffix: "%", label: "Functional with zero signal" },
                { to: 0, prefix: "₱", label: "Cost to start tracking today" },
            ];
            return (
                <section className="border-y border-line bg-paperDim/50">
                    <div className="max-w-6xl mx-auto px-6 py-12 grid grid-cols-1 sm:grid-cols-3">
                        {stats.map((s, i) => (
                            <Reveal key={i} delay={i * 100}>
                                <div className={`text-center sm:text-left px-4 ${i !== 0 ? "sm:border-l sm:border-line" : ""}`}>
                                    <p className="font-mono text-4xl font-semibold text-peso">
                                        <CountUp to={s.to} prefix={s.prefix || ""} suffix={s.suffix || ""} />
                                    </p>
                                    <p className="text-sm text-ink2 mt-1.5">{s.label}</p>
                                </div>
                            </Reveal>
                        ))}
                    </div>
                </section>
            );
        }

        /* ---------- Features ---------- */

        function Features() {
            const items = [
                { icon: Icons.Clock, title: "Log it in seconds", desc: "Three taps: what, how much, done. No categories to hunt for, no forms to fill in mid-commute." },
                { icon: Icons.WifiOff, title: "Works with no signal", desc: "Installed as a PWA, Tipid logs everything on your device first and syncs the moment you're back online." },
                { icon: Icons.Folders, title: "Sorts itself out", desc: "Recurring spots like your suki tindahan or regular jeep route get remembered and categorized automatically." },
                { icon: Icons.Lock, title: "Private by default", desc: "Your entries are yours. Synced securely through Firebase, never sold, never shown to anyone but you." },

                const obs = new IntersectionObserver(([entry]) => {

                obs.observe(el);
                return () => obs.disconnect();
            }, []);

            const categories = [

                            </ul>
                        </Reveal>

                        <Reveal delay={100}>
                            <div ref={ref} className="bg-white rounded-2xl border border-line shadow-xl p-8">

                            </div>
                        </Reveal>
                    </div>
                </section>
            );
        }

    <!-- Service Worker / PWA install handling -->
    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        window.installPWA = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert("App is already installed or your browser does not support installation.");
            }
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
