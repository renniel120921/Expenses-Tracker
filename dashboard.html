        function WalletsOverview({ uid, entries, baseBalances, setBaseBalances }) {
            const { useState, useRef, useCallback } = React;
            const [showAddModal, setShowAddModal] = useState(false);

            const scrollRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [isMouseDown, setIsMouseDown] = useState(false);
            const [startX, setStartX] = useState(0);
            const [scrollLeft, setScrollLeft] = useState(0);

            const handleMouseDown = useCallback((e) => {
                if (!scrollRef.current) return;
                setIsMouseDown(true);
                setIsDragging(false);
                setStartX(e.pageX - scrollRef.current.offsetLeft);
                setScrollLeft(scrollRef.current.scrollLeft);
            }, []);
            const handleMouseLeave = useCallback(() => { setIsMouseDown(false); setIsDragging(false); }, []);
            const handleMouseUp = useCallback(() => { setIsMouseDown(false); setTimeout(() => setIsDragging(false), 50); }, []);
            const handleMouseMove = useCallback((e) => {
                if (!isMouseDown || !scrollRef.current) return;
                e.preventDefault();
                const x = e.pageX - scrollRef.current.offsetLeft;
                const walk = (x - startX) * 2.5;
                if (Math.abs(walk) > 10) setIsDragging(true);
                scrollRef.current.scrollLeft = scrollLeft - walk;
            }, [isMouseDown, startX, scrollLeft]);

            const methods = Object.keys(baseBalances);
            if (!methods.includes("Cash")) methods.unshift("Cash");

            const handleSaveBase = async (method, newBase) => {
                const updatedWallets = { ...baseBalances, [method]: newBase };
                setBaseBalances(updatedWallets);

                try {
                    if (window.FirestoreAPI && window.db) {
                        await window.FirestoreAPI.setDoc(window.FirestoreAPI.doc(window.db, "users", uid), { wallets: updatedWallets }, { merge: true });
                    }
                    const Toast = Swal.mixin({ toast: true, position: "top-end", showConfirmButton: false, timer: 2000, timerProgressBar: true, customClass: { popup: 'tipid-swal text-sm font-body' } });
                    Toast.fire({ icon: "success", title: "Na-update ang wallet" });
                } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Hindi ma-save ang balance.', customClass: { popup: 'tipid-swal' }}); }
            };

            const handleRemoveWallet = async (method) => {
                const updatedWallets = { ...baseBalances };
                delete updatedWallets[method];
                setBaseBalances(updatedWallets);

                try {
                    if (window.FirestoreAPI && window.db) {
                        await window.FirestoreAPI.setDoc(window.FirestoreAPI.doc(window.db, "users", uid), { wallets: updatedWallets }, { merge: true });
                    }
                } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Hindi maalis ang wallet.', customClass: { popup: 'tipid-swal' }}); }
            };

            const handleAddWallet = async (methodId) => {
                setShowAddModal(false);
                const { value: initialBalance, isConfirmed } = await Swal.fire({
                    title: "Magkano ang laman?",
                    input: "number",
                    inputPlaceholder: "Hal: 5000",
                    showCancelButton: true,
                    confirmButtonColor: "#1F6F54",
                    confirmButtonText: "I-save",
                    customClass: { popup: 'tipid-swal' }
                });

                if (!isConfirmed) return;

                const balance = parseFloat(initialBalance) || 0;
                await handleSaveBase(methodId, balance);
            };

            return (
                <div>
                    <SectionHeader title="Storage" subtitle="Aking mga Wallet" />
                    <div ref={scrollRef} className={`flex overflow-x-auto gap-5 sm:gap-6 pb-8 pt-2 hide-scroll snap-x snap-mandatory ${isDragging ? 'is-dragging' : 'scroll-grab'}`} style={{ paddingLeft: '4px', paddingRight: '20px' }} onMouseDown={handleMouseDown} onMouseLeave={handleMouseLeave} onMouseUp={handleMouseUp} onMouseMove={handleMouseMove}>
                        {methods.map((method) => (
                            <div key={method} className="snap-start pointer-events-auto shrink-0">
                                <WalletCard uid={uid} method={method} entries={entries} baseBalance={baseBalances[method] || 0} onSaveBase={handleSaveBase} onRemove={handleRemoveWallet} />
                            </div>
                        ))}
                        <div className="snap-start pointer-events-auto shrink-0 w-[6rem] flex items-center justify-center">
                            <button onClick={() => setShowAddModal(true)} className="w-16 h-16 rounded-[18px] bg-white/60 dark:bg-black/30 hover:bg-peso dark:hover:bg-pesoLight text-ink2/40 dark:text-paper/40 hover:text-white flex items-center justify-center transition-all tap-scale shadow-sm border border-white dark:border-white/5 focus:outline-none focus:ring-2 focus:ring-peso/50 backdrop-blur-md">
                                <Icons.Plus size={28} strokeWidth={2.5} />
                            </button>
                        </div>
                    </div>
                    <AddWalletModal open={showAddModal} onClose={() => setShowAddModal(false)} onAdd={handleAddWallet} currentMethods={methods} />
                </div>
            );
        }

        /* --- MASCOT INTRO SEQUENCE ---
           Plays for logged-in users right after auth resolves, before the
           main dashboard content is shown. Stages: sleeping -> waking ->
           greeting -> working, each with its own mascot image, background,
           and animation, then fades out into the real dashboard. */
        function MascotIntroSequence({ firstName, onComplete }) {
            const { useState, useEffect, useRef } = React;
            const [stage, setStage] = useState("sleeping");
            const [progress, setProgress] = useState(0);
            const [exiting, setExiting] = useState(false);
            const timers = useRef([]);
            const progressInterval = useRef(null);

            useEffect(() => {
                const schedule = (fn, delay) => { timers.current.push(setTimeout(fn, delay)); };

                schedule(() => setStage("waking"), 1500);
                schedule(() => setStage("greeting"), 2500);
                schedule(() => {
                    setStage("working");
                    const start = Date.now();
                    const duration = 1300;
                    progressInterval.current = setInterval(() => {
                        const pct = Math.min(100, Math.round(((Date.now() - start) / duration) * 100));
                        setProgress(pct);
                        if (pct >= 100 && progressInterval.current) {
                            clearInterval(progressInterval.current);
                            progressInterval.current = null;
                        }
                    }, 40);
                }, 4100);
                schedule(() => setExiting(true), 5600);
                schedule(() => { if (onComplete) onComplete(); }, 6150);

                return () => {
                    timers.current.forEach(clearTimeout);
                    if (progressInterval.current) clearInterval(progressInterval.current);
                };
            }, [onComplete]);

            const STAGE_META = {
                sleeping: {
                    img: "/assets/sleeping_mascot.png",
                    bg: "radial-gradient(circle at 30% 20%, #1A2B21 0%, #0B130E 60%), linear-gradient(180deg, #0B130E, #060A08)",
                    animClass: "mascot-anim-sleep",
                    caption: null,
                    sub: "Tulog pa si Tipid Buddy...",
                },
                waking: {
                    img: "/assets/wakeup_mascot.png",
                    bg: "radial-gradient(circle at 30% 20%, #1F6F54 0%, #123D2E 55%, #0B1F17 100%)",
                    animClass: "mascot-anim-wake",
                    caption: "Gising na!",
                    sub: "Sandali lang, gigising muna si Tipid Buddy...",
                },
                greeting: {
                    img: "/assets/greetings_mascot.png",
                    bg: "radial-gradient(circle at 30% 15%, #2F8E6C 0%, #164C38 50%, #0E2E22 100%)",
                    animClass: "mascot-anim-celebrate",
                    caption: `Kumusta, ${firstName}!`,
                    sub: "Handa ka na bang mag-ipon ngayon?",
                },
                working: {
                    img: "/assets/working_mascot.png",
                    bg: "radial-gradient(circle at 30% 15%, #1F6F54 0%, #123D2E 60%, #0B130E 100%)",
                    animClass: "mascot-anim-float",
                    caption: "Inaayos na...",
                    sub: "Ini-lo-load ang iyong Tipid Dashboard",
                },
            };

            const meta = STAGE_META[stage];

            return (
                <div
                    className={`fixed inset-0 z-[200] flex items-center justify-center overflow-hidden intro-stage-bg ${exiting ? "intro-fade-out" : ""}`}
                    style={{ background: meta.bg }}
                >
                    {/* ambient stars — visible mostly during sleeping/waking */}
                    <div className={`absolute inset-0 pointer-events-none transition-opacity duration-700 ${stage === "sleeping" || stage === "waking" ? "opacity-100" : "opacity-0"}`}>
                        {Array.from({ length: 18 }).map((_, i) => (
                            <span
                                key={i}
                                className="intro-star absolute rounded-full bg-white"
                                style={{
                                    width: `${2 + (i % 3)}px`, height: `${2 + (i % 3)}px`,
                                    top: `${(i * 37) % 90}%`, left: `${(i * 53) % 95}%`,
                                    animationDelay: `${(i % 6) * 0.4}s`,
                                }}
                            />
                        ))}
                    </div>

                    {/* sparkle particles for greeting/working */}
                    {(stage === "greeting" || stage === "working") && (
                        <div className="absolute inset-0 pointer-events-none">
                            {Array.from({ length: 10 }).map((_, i) => (
                                <span
                                    key={i}
                                    className="intro-sparkle absolute text-gold text-lg"
                                    style={{ top: `${20 + (i * 13) % 60}%`, left: `${10 + (i * 27) % 80}%`, animationDelay: `${i * 0.22}s` }}
                                >✦</span>
                            ))}
                        </div>
                    )}

                    <div className="relative z-10 flex flex-col items-center px-6 text-center">
                        <div className="relative w-40 h-40 sm:w-48 sm:h-48 mb-6 flex items-center justify-center">
                            <div className="absolute inset-0 rounded-full bg-white/10 blur-2xl" />
                            {stage === "sleeping" && (
                                <>
                                    <span className="zzz-float absolute -top-2 right-6 text-white/80 font-display text-2xl font-bold" style={{ animationDelay: "0s" }}>z</span>
                                    <span className="zzz-float absolute top-4 right-0 text-white/70 font-display text-3xl font-bold" style={{ animationDelay: "0.5s" }}>Z</span>
                                    <span className="zzz-float absolute top-10 right-8 text-white/60 font-display text-xl font-bold" style={{ animationDelay: "1s" }}>z</span>
                                </>
                            )}
                            <img
                                key={stage}
                                src={meta.img}
                                alt="Tipid Buddy"
                                className={`relative w-full h-full object-contain drop-shadow-2xl ${meta.animClass}`}
                                draggable="false"
                                onError={(e) => { e.currentTarget.style.display = "none"; }}
                            />
                        </div>

                        {meta.caption && (
                            <h2 key={`cap-${stage}`} className="font-display text-2xl sm:text-3xl font-bold text-white tracking-tight mb-2 drop-shadow-md">
                                {meta.caption}
                            </h2>
                        )}
                        <p key={`sub-${stage}`} className="text-[13px] sm:text-[14px] font-medium text-white/70 max-w-xs">
                            {meta.sub}
                        </p>

                        {stage === "working" && (
                            <div className="w-56 sm:w-64 h-2 bg-white/15 rounded-full overflow-hidden mt-6 shadow-inner">
                                <div className="h-full bg-gradient-to-r from-goldLight to-gold rounded-full transition-all duration-150" style={{ width: `${progress}%` }} />
                            </div>
                        )}

                        {(stage === "sleeping" || stage === "waking") && (
                            <div className="mt-6 flex gap-1.5">
                                <span className="w-1.5 h-1.5 rounded-full bg-white/40 animate-pulse" style={{ animationDelay: "0s" }} />
                                <span className="w-1.5 h-1.5 rounded-full bg-white/40 animate-pulse" style={{ animationDelay: "0.2s" }} />
                                <span className="w-1.5 h-1.5 rounded-full bg-white/40 animate-pulse" style={{ animationDelay: "0.4s" }} />
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* --- MAIN DASHBOARD APP --- */
        function Dashboard() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();
            const [user, setUser] = React.useState(undefined);
            const [entries, setEntries] = React.useState([]);
            const [budget, setBudgetState] = React.useState(null);
            const [baseBalances, setBaseBalances] = React.useState({});
            const [loadingEntries, setLoadingEntries] = React.useState(true);
            const [dataError, setDataError] = React.useState("");
            const [showOnboarding, setShowOnboarding] = React.useState(false);

            // Whether the mascot intro sequence has already played this tab
            // session. Gated by sessionStorage (not localStorage) so it
            // greets the user again on a fresh session/login, but doesn't
            // replay on every in-app refresh within the same visit.
            const [introDone, setIntroDone] = React.useState(() => {
                try { return sessionStorage.getItem("tipid_intro_shown") === "1"; } catch (e) { return false; }
            });

            const monthStats = useMonthlyStats(entries);

            const walletBalances = React.useMemo(() => {
                const balances = {};
                if (baseBalances) {
                    Object.keys(baseBalances).forEach(k => balances[k] = parseFloat(baseBalances[k]) || 0);
                }
                const safeEntries = Array.isArray(entries) ? entries : [];
                safeEntries.forEach(e => {
                    const m = e.method || "Cash";
                    const amt = parseFloat(e.amount) || 0;
                    if (balances[m] === undefined) balances[m] = 0;
                    if (e.type === "income") balances[m] += amt;
                    else balances[m] -= amt;
                });
                return balances;
            }, [entries, baseBalances]);

            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => setUser(u || null));
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
                if (user && user.uid && !localStorage.getItem(`tipid_onboarded_${user.uid}`)) {
                    setShowOnboarding(true);
                }
            }, [user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                const loadUserWallets = async () => {
                    try {
                        if (window.FirestoreAPI && window.db) {
                            const { doc, getDoc } = window.FirestoreAPI;
                            const snap = await getDoc(doc(window.db, "users", user.uid));
                            if (snap.exists() && snap.data().wallets) {
                                const loadedWallets = snap.data().wallets;
                                if (!Object.keys(loadedWallets).includes("Cash")) loadedWallets["Cash"] = 0;
                                setBaseBalances(loadedWallets);
                            } else {
                                setBaseBalances({ "Cash": 0 });
                            }
                        } else {
                            setBaseBalances({ "Cash": 0 });
                        }
                    } catch (err) {
                        console.error("Error loading wallets:", err);
                        setBaseBalances({ "Cash": 0 });
                    }
                };
                loadUserWallets();
            }, [dataReady, user]);

            React.useEffect(() => {
                const keys = Object.keys(baseBalances);
                if (keys.length > 0) {
                    window.METHODS = keys.includes("Cash") ? keys : ["Cash", ...keys];
                }
            }, [baseBalances]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                setLoadingEntries(true);
                return window.TipidData.subscribeEntries(
                    user.uid,
                    (list) => { setEntries(list); setLoadingEntries(false); },
                    () => { setDataError("Failed to load data."); setLoadingEntries(false); }
                );
            }, [dataReady, user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                return window.TipidData.subscribeBudget(user.uid, setBudgetState, () => {});
            }, [dataReady, user]);

            // 🌟 SMART SMS EXTRACTOR WITH TIPID BUDDY MASCOT 🌟
            const handleSmartPaste = async () => {
                const { value: text } = await Swal.fire({
                    html: `
                        <div class="flex flex-col items-center text-center pt-2">
                            <div class="relative w-20 h-20 mb-3 flex items-center justify-center">
                                <div class="absolute inset-0 rounded-full bg-peso/15 blur-lg"></div>
                                <img src="/assets/tipid_mascot.png" alt="Tipid Buddy" class="w-16 h-16 object-contain mascot-anim-float drop-shadow-md" />
                                <span class="absolute -top-1 -right-1 text-2xl">🪄</span>
                            </div>
                            <h3 class="font-display text-2xl font-bold text-ink dark:text-paper mb-1">Smart SMS Paste</h3>
                            <p class="text-[13px] text-ink2/70 dark:text-paper/70 font-medium mb-3">I-paste ang buong text mula sa GCash, Maya, o Bank alert.</p>
                        </div>
                    `,
                    input: 'textarea',
                    inputPlaceholder: 'Hal: You have paid PHP 150.00 to 7-Eleven ref no...',
                    showCancelButton: true,
                    confirmButtonColor: '#1F6F54',
                    cancelButtonColor: '#4A5568',
                    confirmButtonText: 'I-extract',
                    cancelButtonText: 'Kanselahin',
                    customClass: { popup: 'tipid-swal' }
                });

                if (text) {
                    let extractedAmount = "";
                    let extractedDesc = "";
                    let extractedMethod = "Cash";
                    let extractedType = "expense";

                    const amtMatch = text.match(/(?:PHP|Php|P)\s*([\d,]+(?:\.\d{2})?)/i) || text.match(/amount.*?(?:PHP|Php|P)\s*([\d,]+(?:\.\d{2})?)/i) || text.match(/([\d,]+\.\d{2})/);
                    if (amtMatch) extractedAmount = (amtMatch[1] || amtMatch[0]).replace(/,/g, '');

                    const lowerText = text.toLowerCase();
                    for (let m of window.METHODS) {
                        if (lowerText.includes(m.toLowerCase())) {
                            extractedMethod = m;
                            break;
                        }
                    }
                    if (lowerText.includes("gcash") && window.METHODS.includes("GCash")) extractedMethod = "GCash";
                    if ((lowerText.includes("maya") || lowerText.includes("paymaya")) && window.METHODS.includes("Maya")) extractedMethod = "Maya";

                    if (lowerText.includes("received") || lowerText.includes("sent you") || lowerText.includes("cash in")) {
                        extractedType = "income";
                        const senderMatch = text.match(/from\s+([A-Za-z0-9*.\-\s]+?)(?:\s+on|\s+ref|\s+via|\.|$)/i);
                        if (senderMatch) extractedDesc = senderMatch[1].trim();
                    } else if (lowerText.includes("paid") || lowerText.includes("sent") || lowerText.includes("payment")) {
                        extractedType = "expense";
                        const receiverMatch = text.match(/(?:to|at)\s+([A-Za-z0-9*.\-\s]+?)(?:\s+on|\s+ref|\s+via|\.|$)/i);
                        if (receiverMatch) extractedDesc = receiverMatch[1].trim();
                    }

                    if (!extractedDesc) {
                        extractedDesc = extractedType === 'income' ? 'Income via SMS' : 'Expense via SMS';
                    }

                    window.dispatchEvent(new CustomEvent('tipid-smart-paste', {
                        detail: {
                            amount: extractedAmount,
                            desc: extractedDesc.substring(0, 30),
                            method: extractedMethod,
                            type: extractedType
                        }
                    }));

                    window.showTipidBuddyModal({
                        title: 'Na-extract na! 🪄',
                        message: `Nailagay na sa form: <b>₱${window.peso(extractedAmount || 0)}</b>. Paki-check kung tama bago i-save.`,
                        mode: 'celebrate',
                        confirmColor: '#1F6F54'
                    });
                }
            };

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="bento-card flex flex-col items-center gap-6 rounded-[2.5rem] px-12 py-12">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-20 w-20 rounded-[18px] bg-peso/20 halo-pulse blur-md" />
                                <div className="relative logo-breathe"><window.Logo size={52} className="shadow-lg" /></div>
                            </div>
                            <p className="text-[11px] font-mono font-bold tracking-[0.2em] uppercase text-ink2 dark:text-paper/60 text-center">Initializing</p>
                        </div>
                    </div>
                );
            }

            const logout = async () => { await window.TipidAuth.logOut(); window.location.href = "login.html"; };
            const firstName = user.displayName ? user.displayName.split(" ")[0] : user.email.split("@")[0];

            // Mascot intro sequence plays once auth has resolved to a real
            // user, before any dashboard content mounts. Every other effect
            // above (auth redirect, onboarding check, data subscriptions)
            // keeps running normally in the background while this shows —
            // so by the time it fades out, entries/wallets are usually
            // already loaded and the onboarding modal (if needed) is ready
            // to appear right after.
            if (!introDone) {
                return (
                    <MascotIntroSequence
                        firstName={firstName}
                        onComplete={() => {
                            try { sessionStorage.setItem("tipid_intro_shown", "1"); } catch (e) {}
                            setIntroDone(true);
                        }}
                    />
                );
            }

            const totalBase = Object.values(baseBalances).reduce((s, val) => s + (parseFloat(val) || 0), 0);
            const totalIncome = entries.filter(e => e.type === "income").reduce((s, e) => s + (e.amount || 0), 0);
            const totalExpense = entries.filter(e => e.type !== "income").reduce((s, e) => s + (e.amount || 0), 0);
            const overallBalance = totalBase + totalIncome - totalExpense;

            return (
                <div className="min-h-dvh relative">
                    <AmbientBackground />
                    <window.Navbar user={user} onLogout={logout} activeTab="home" />
                    {showOnboarding && <window.OnboardingModal uid={user.uid} onComplete={() => setShowOnboarding(false)} />}

                    <main className="max-w-[1200px] mx-auto w-full px-4 sm:px-6 lg:px-8 pt-24 md:pt-32 pb-36 md:pb-24 space-y-10 sm:space-y-14" style={{ paddingLeft: 'max(1rem, calc(var(--sal) + 1rem))', paddingRight: 'max(1rem, calc(var(--sar) + 1rem))', paddingBottom: 'calc(8rem + var(--sab))' }}>

                        <CommandCenter
                            user={user}
                            firstName={firstName}
                            balance={overallBalance}
                            entries={entries}
                            budget={budget}
                            monthStats={monthStats}
                            loading={loadingEntries && entries.length === 0}
                            walletBalances={walletBalances}
                        />

                        {dataError && (
                            <div className="banner-in bento-card flex items-center gap-4 text-expense dark:text-[#F38C80] text-[13px] font-bold border border-expense/20 rounded-2xl px-5 py-4 bg-[#FAEDE9]/80 dark:bg-[#B5483B]/20">
                                <Icons.AlertCircle size={20} className="shrink-0" /><span className="uppercase tracking-widest">{dataError}</span>
                            </div>
                        )}

                        <div className="fade-up" style={{ animationDelay: "60ms" }}>
                            <QuickActions />
                        </div>

                        <div className="fade-up" style={{ animationDelay: "100ms" }}>
                            <WalletsOverview uid={user.uid} entries={entries} baseBalances={baseBalances} setBaseBalances={setBaseBalances} />
                        </div>

                        <div id="summary" className="fade-up scroll-mt-28" style={{ animationDelay: "120ms" }}>
                            <SectionHeader title="Metrics" subtitle="Buod ng Buwan" />
                            <window.SmartSummary uid={user.uid} entries={entries} budget={budget} />
                        </div>

                        <div id="analytics" className="fade-up scroll-mt-28" style={{ animationDelay: "180ms" }}>
                            <SectionHeader title="Insights" subtitle="Uso ng Paggastos" />
                            <window.ExpenseChart entries={entries} />
                        </div>

                        <div id="add-entry" className="fade-up scroll-mt-28" style={{ animationDelay: "240ms" }}>
                            <SectionHeader
                                title="Interface"
                                subtitle="Magdagdag ng Gastos"
                                action={
                                    <button onClick={handleSmartPaste} className="flex items-center gap-2 bg-black/5 dark:bg-white/10 hover:bg-peso hover:text-white dark:hover:bg-pesoLight text-ink dark:text-paper font-bold text-[11px] px-3.5 py-2 rounded-xl transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-peso/50">
                                        <Icons.Wand size={16} strokeWidth={2.5}/> Auto-Fill via SMS
                                    </button>
                                }
                            />
                            <window.AddEntryForm key={window.METHODS.join(",")} uid={user.uid} entries={entries} baseBalances={baseBalances} />
                        </div>

                        <div id="history" className="fade-up scroll-mt-28" style={{ animationDelay: "300ms" }}>
                            <SectionHeader title="Database" subtitle="Kasaysayan" action={<span className="text-[10px] font-mono font-bold tracking-widest uppercase bg-white/50 dark:bg-black/20 border border-black/5 dark:border-white/5 px-3 py-1.5 rounded-lg text-ink2/70 dark:text-paper/70 shrink-0">{entries.length} LOGS</span>} />
                            <window.EntryList uid={user.uid} entries={entries} loading={loadingEntries} />
                        </div>
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");
            if (typeof window.SmartSummary !== "function") missingNames.push("SmartSummary");
            if (typeof window.ExpenseChart !== "function") missingNames.push("ExpenseChart");
            if (typeof window.AddEntryForm !== "function") missingNames.push("AddEntryForm");
            if (typeof window.EntryList !== "function") missingNames.push("EntryList");
            if (typeof window.ExpenseItem !== "function") missingNames.push("ExpenseItem");
            if (typeof window.OnboardingModal !== "function") missingNames.push("OnboardingModal");

            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
                return;
            }
            if (attempt > 100) {
                document.getElementById("root").innerHTML = `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Inter,sans-serif;text-align:center;color:#15231C;"><div><p style="font-weight:600;margin-bottom:0.5rem;">Failed to load modules: ${missingNames.join(", ")}</p></div></div>`;
                return;
            }
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>
</body>
</html>
