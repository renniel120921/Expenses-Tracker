<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mag-log In — Tipid</title>
    <meta name="theme-color" content="#123D2E">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                        sun: '#FCD116', bayani: '#0038A8',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>

    <style>
        html { background: #F1F4EF; }
        body { font-feature-settings: "tnum" 1, "lnum" 1; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        .ledger-rule {
            background-image: repeating-linear-gradient(to right, #D3DAD0 0, #D3DAD0 6px, transparent 6px, transparent 14px);
            height: 1px;
        }

        .perf-edge {
            -webkit-mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            -webkit-mask-repeat: repeat-x;
            mask-repeat: repeat-x;
            -webkit-mask-position: -5px -5px;
            mask-position: -5px -5px;
            -webkit-mask-size: 20px 10px;
            mask-size: 20px 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.5s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }

        .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
        .panel.open { grid-template-rows: 1fr; }
        .panel > div { overflow: hidden; }

        @keyframes sunRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .sun-rotate { animation: sunRotate 140s linear infinite; }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.35; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .star-twinkle { animation: starTwinkle 2.6s ease-in-out infinite; }

        @keyframes mascotFloat {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(-1deg); }
            50% { transform: translate3d(0, -7px, 0) rotate(1deg); }
        }
        @keyframes mascotGlow {
            0%, 100% { transform: scale(0.94); opacity: 0.18; }
            50% { transform: scale(1.06); opacity: 0.30; }
        }

        .login-shell {
            width: min(1120px, calc(100vw - 32px));
            min-height: min(720px, calc(100dvh - 48px));
            margin: 24px auto;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            overflow: hidden;
            border-radius: 32px;
            background: rgba(255,255,255,.82);
            border: 1px solid rgba(255,255,255,.72);
            box-shadow: 0 36px 90px -38px rgba(18,61,46,.38);
            backdrop-filter: blur(20px) saturate(145%);
            -webkit-backdrop-filter: blur(20px) saturate(145%);
        }

        .login-visual {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background:
                radial-gradient(circle at 78% 20%, rgba(47,142,108,.30), transparent 30%),
                radial-gradient(circle at 10% 88%, rgba(201,147,46,.18), transparent 30%),
                linear-gradient(150deg, #0F3F2F 0%, #134735 48%, #1F6F54 100%);
            color: #F7FAF7;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .login-visual::before {
            content: "";
            position: absolute;
            width: 340px;
            height: 340px;
            top: -150px;
            right: -120px;
            border-radius: 999px;
            background: rgba(255,255,255,.06);
            filter: blur(8px);
        }

        .login-visual::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            bottom: -150px;
            left: -120px;
            border-radius: 999px;
            background: rgba(201,147,46,.08);
            filter: blur(8px);
        }

        .visual-top,
        .visual-content,
        .visual-bottom {
            position: relative;
            z-index: 2;
        }

        .visual-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .visual-pill {
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 7px;
            margin-top: 18px;
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            color: rgba(247,250,247,.82);
            font: 700 10px/1 'Inter',sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .visual-content {
            max-width: 390px;
            margin-top: 36px;
        }

        .visual-eyebrow {
            color: rgba(241,244,239,.56);
            font: 700 10px/1.2 'IBM Plex Mono',monospace;
            letter-spacing: .2em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .visual-title {
            font: 700 clamp(2.2rem, 4vw, 3.4rem)/1.02 'Fraunces',serif;
            letter-spacing: -.035em;
            margin: 0;
        }

        .visual-copy {
            margin-top: 14px;
            max-width: 340px;
            color: rgba(247,250,247,.68);
            font: 500 13px/1.65 'Inter',sans-serif;
        }

        .visual-mascot {
            position: absolute;
            z-index: 2;
            right: 24px;
            bottom: 10px;
            width: 300px;
            height: 330px;
            object-fit: contain;
            object-position: center bottom;
            animation: mascotFloat 4.8s ease-in-out infinite;
            filter: drop-shadow(0 22px 24px rgba(0,0,0,.22));
            pointer-events: none;
            user-select: none;
        }

        .visual-mascot-glow {
            position: absolute;
            z-index: 1;
            width: 190px;
            height: 190px;
            right: 70px;
            bottom: 72px;
            border-radius: 999px;
            background: rgba(255,255,255,.09);
            filter: blur(34px);
            animation: mascotGlow 3.8s ease-in-out infinite;
        }

        .visual-note {
            width: fit-content;
            max-width: 260px;
            padding: 11px 13px;
            border-radius: 16px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            color: rgba(247,250,247,.76);
            font: 600 11px/1.45 'Inter',sans-serif;
        }

        .visual-stat {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            color: rgba(247,250,247,.54);
            font: 500 11px/1.4 'Inter',sans-serif;
        }

        .visual-stat-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #FCD116;
            box-shadow: 0 0 0 5px rgba(252,209,22,.08);
            flex: 0 0 auto;
        }

        .login-form-side {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 46px;
            background: rgba(250,252,249,.74);
        }

        .login-form-wrap {
            width: min(100%, 430px);
        }

        .login-mobile-brand {
            display: none;
        }

        .login-form-head {
            margin-bottom: 26px;
        }

        .login-form-eyebrow {
            margin-bottom: 8px;
            color: #1F6F54;
            font: 700 10px/1.2 'IBM Plex Mono',monospace;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .login-form-title {
            margin: 0;
            color: #15231C;
            font: 700 2.35rem/1.04 'Fraunces',serif;
            letter-spacing: -.03em;
        }

        .login-form-subtitle {
            margin-top: 9px;
            color: rgba(51,68,58,.66);
            font: 500 13px/1.55 'Inter',sans-serif;
        }

        .login-form-card {
            padding: 0;
        }

        .social-button {
            width: 100%;
            border: 1px solid #D3DAD0;
            border-radius: 14px;
            padding: 12px 16px;
            font-weight: 700;
            background: #FFFFFF;
            transition: background-color .2s ease, border-color .2s ease, transform .18s ease, box-shadow .2s ease;
        }

        .social-button:hover {
            background: #FAFCFA;
            border-color: rgba(21,35,28,.18);
            box-shadow: 0 10px 28px -20px rgba(18,61,46,.40);
        }

        .social-button:active { transform: scale(.985); }

        .field-shell {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #FFFFFF;
            border: 1px solid #D3DAD0;
            border-radius: 14px;
            padding: 0 13px;
            transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
        }

        .field-shell:focus-within {
            border-color: rgba(31,111,84,.45);
            box-shadow: 0 0 0 4px rgba(31,111,84,.10);
            transform: translateY(-1px);
        }

        .field-shell.error { border-color: rgba(181,72,59,.55); }

        .field-shell input {
            width: 100%;
            background: transparent;
            padding: 13px 0;
            font-size: 14px;
            outline: none;
        }

        .auth-button {
            width: 100%;
            border-radius: 14px;
            padding: 14px 16px;
            font-weight: 700;
            transition: transform .18s ease, background-color .2s ease, box-shadow .2s ease;
        }

        .auth-button:hover {
            box-shadow: 0 18px 34px -20px rgba(31,111,84,.65);
        }

        .auth-button:active { transform: scale(.985); }

        .login-helper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
        }

        .login-helper-note {
            color: rgba(51,68,58,.48);
            font: 500 10px/1.4 'Inter',sans-serif;
        }

        .mascot-float-key {
            animation: mascotFloat 4.8s ease-in-out infinite;
        }

        @media (max-width: 1023px) {
            body { background: #F1F4EF; }

            .login-shell {
                width: min(720px, calc(100vw - 28px));
                min-height: auto;
                margin: 18px auto 28px;
                grid-template-columns: 1fr;
                border-radius: 28px;
            }

            .login-visual {
                min-height: 240px;
                padding: 26px 26px 22px;
            }

            .visual-content {
                max-width: 56%;
                margin-top: 28px;
            }

            .visual-title {
                font-size: 2.4rem;
            }

            .visual-copy { font-size: 12px; }

            .visual-mascot {
                width: 220px;
                height: 240px;
                right: 20px;
                bottom: -4px;
            }

            .visual-mascot-glow {
                width: 150px;
                height: 150px;
                right: 44px;
                bottom: 34px;
            }

            .visual-note,
            .visual-stat {
                display: none;
            }

            .login-form-side {
                padding: 34px 24px 32px;
            }

            .login-mobile-brand { display: none; }
        }

        @media (max-width: 640px) {
            .login-shell {
                width: calc(100vw - 20px);
                margin: 10px auto 18px;
                border-radius: 24px;
            }

            .login-visual {
                min-height: 188px;
                padding: 20px 20px 18px;
            }

            .visual-brand span {
                font-size: 17px;
            }

            .visual-pill {
                margin-top: 10px;
                padding: 6px 9px;
                font-size: 9px;
            }

            .visual-content {
                max-width: 62%;
                margin-top: 18px;
            }

            .visual-eyebrow {
                font-size: 9px;
                margin-bottom: 8px;
            }

            .visual-title {
                font-size: 2rem;
            }

            .visual-copy { display: none; }

            .visual-mascot {
                width: 164px;
                height: 180px;
                right: -2px;
                bottom: -8px;
            }

            .visual-mascot-glow {
                width: 124px;
                height: 124px;
                right: 18px;
                bottom: 18px;
            }

            .login-form-side {
                padding: 28px 18px 24px;
            }

            .login-form-head {
                margin-bottom: 20px;
            }

            .login-form-title {
                font-size: 2.05rem;
            }

            .login-form-subtitle {
                font-size: 12px;
            }

            .login-helper {
                margin-top: 14px;
            }

            .login-helper-note {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spin, .shake, .fade-up, .sun-rotate, .star-twinkle,
            .login-visual, .visual-mascot, .visual-mascot-glow {
                animation: none !important;
            }
        }

        .swal2-popup.tipid-swal {
            border-radius: 20px !important;
            font-family: 'Inter', sans-serif;
        }
        .tipid-swal .swal2-title {
            font-family: 'Fraunces', serif;
            color: #15231C;
        }
        .tipid-swal .swal2-html-container { color: #33443A; }
        .tipid-swal .swal2-confirm {
            border-radius: 999px !important;
            padding: .65em 1.6em !important;
            font-weight: 600 !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body class="bg-paper text-ink antialiased font-body min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        const Icons = {
            Mail: (p) => <Icon {...p} path={<><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></>} />,
            Lock: (p) => <Icon {...p} path={<><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></>} />,
            Eye: (p) => <Icon {...p} path={<><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>} />,
            EyeOff: (p) => <Icon {...p} path={<><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a17.4 17.4 0 0 1-2.24 3.32M6.16 6.16C3.4 7.9 2 11 2 11s3.5 7 10 7a9.4 9.4 0 0 0 4.24-.94"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="2" y1="2" x2="22" y2="22"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            CheckCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />,
            Check: (p) => <Icon {...p} path={<path d="M20 6 9 17l-5-5"/>} />,
            BarChart: (p) => <Icon {...p} path={<><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></>} />,
            Target: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></>} />,
        };

        function GoogleIcon({ size = 18 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                    <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5c-8.2 0-15.2 4.7-18.7 11.2Z"/>
                    <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.4C29.6 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.7 16.2 44.5 24 44.5Z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.5 5.4C41.8 35.4 44.5 30.2 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                </svg>
            );
        }

        function Logo({ size = 32, light = false }) {
            const [broken, setBroken] = useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return (
                <span style={{ width: size, height: size }}
                      className={`rounded-md flex items-center justify-center font-display font-semibold ${light ? "bg-paper text-pesoDeep" : "bg-ink text-paper"}`}>₱</span>
            );
        }

        function useAuthReady() {
            const [ready, setReady] = useState(!!window.TipidAuth);
            const [timedOut, setTimedOut] = useState(false);
            useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                const t = setTimeout(() => setTimedOut(true), 6000);
                return () => {
                    window.removeEventListener("tipid-auth-ready", h);
                    clearTimeout(t);
                };
            }, []);
            return { ready, timedOut };
        }

        function swalSuccess({ title, text, confirmButtonText }) {
            return Swal.fire({
                icon: "success",
                title, text, confirmButtonText,
                confirmButtonColor: "#1F6F54",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }

        function swalError(text) {
            return Swal.fire({
                icon: "error",
                title: "Hindi Matagumpay",
                text,
                confirmButtonText: "Sige",
                confirmButtonColor: "#B5483B",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }

        function Field({ icon: IconCmp, error, children }) {
            return (
                <div className={`field-shell ${error ? "error" : ""}`}>
                    <IconCmp size={17} className="text-ink2/50 shrink-0" />
                    {children}
                </div>
            );
        }

        function SunRays({ size = 420, className = "" }) {
            const rayCount = 8;
            return (
                <svg width={size} height={size} viewBox="0 0 100 100" className={`sun-rotate ${className}`}>
                    <g stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
                        {Array.from({ length: rayCount }).map((_, i) => (
                            <line key={i} x1="50" y1="2" x2="50" y2="20"
                                  transform={`rotate(${(360 / rayCount) * i} 50 50)`} />
                        ))}
                    </g>
                    <circle cx="50" cy="50" r="13" fill="none" stroke="currentColor" strokeWidth="1.3" />
                </svg>
            );
        }

        function TinyStar({ style, size = 11, delay = 0 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"
                     className="star-twinkle" style={{ ...style, animationDelay: `${delay}s` }}>
                    <path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.4 5.7 20.8 8 13.6 2 9.2h7.6z"/>
                </svg>
            );
        }

        function WeavePattern() {
            return (
                <svg className="absolute inset-0 w-full h-full opacity-[0.05] pointer-events-none">
                    <defs>
                        <pattern id="banig-weave-login" width="14" height="14" patternUnits="userSpaceOnUse"
                                 patternTransform="rotate(45)">
                            <line x1="0" y1="0" x2="0" y2="14" stroke="currentColor" strokeWidth="1" />
                            <line x1="7" y1="0" x2="7" y2="14" stroke="currentColor" strokeWidth="1" opacity="0.5" />
                        </pattern>
                    </defs>

        // --- FULLY FIXED ForgotPassword Component with Clear Feedback ---
        function ForgotPassword({ open, onClose }) {
            const [email, setEmail] = useState("");
            const [status, setStatus] = useState("idle"); // idle, sending, sent, error
            const [msg, setMsg] = useState("");

            const send = async (e) => {
                e.preventDefault();
                if (!/^\S+@\S+\.\S+$/.test(email)) {
                    setStatus("error");
                    setMsg("Hindi valid ang email address.");
                    return;
                }
                setStatus("sending");
                setMsg("");
                try {
                    await window.TipidAuth.resetPassword(email.trim());
                    setStatus("sent");
                } catch (err) {
                    setStatus("error");
                    setMsg(window.TipidAuth.friendlyError(err.code || err));
                }
            };

            return (
                <div className={`panel ${open ? "open" : ""}`}>
                    <div>
                        <div className="mt-4 pt-4 border-t border-dashed border-line">
                            {status === "sent" ? (
                                <div className="space-y-3">
                                    <div className="flex items-start gap-2 bg-peso/10 text-peso text-sm rounded-xl px-3.5 py-3">
                                        <Icons.CheckCircle size={16} className="shrink-0 mt-0.5" />
                                        <span>Kung rehistrado ang <strong>{email}</strong>, naipadala na ang password reset link. Pakitingnan ang iyong <strong>Inbox</strong> o <strong>Spam / Junk folder</strong>.</span>
                                    </div>
                                    <button type="button" onClick={() => { setStatus("idle"); setEmail(""); onClose(); }} className="text-xs font-semibold text-peso hover:underline">
                                        Isara ang form
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={send} className="space-y-3">
                                    <p className="text-sm text-ink2">Ilagay ang email mo, papadalhan ka namin ng reset link.</p>

                                    {status === "error" && (
                                        <div className="flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-2.5">
                                            <Icons.AlertCircle size={15} className="shrink-0 mt-0.5" />
                                            <span>{msg}</span>
                                        </div>
                                    )}

                                    <Field icon={Icons.Mail}>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                                               placeholder="Email address" className="w-full bg-transparent py-2.5 text-sm focus:outline-none" />
                                    </Field>

                                    <div className="flex gap-2.5">
                                        <button type="submit" disabled={status === "sending"}
                                                className="flex-1 bg-ink hover:bg-pesoDeep disabled:opacity-60 text-paper text-sm font-semibold py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2">
                                            {status === "sending" && <Icons.Loader size={14} className="spin" />}
                                            {status === "sending" ? "Pinapadala..." : "Ipadala ang link"}
                                        </button>
                                        <button type="button" onClick={onClose} className="text-sm font-semibold text-ink2 px-3">Kansela</button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function LogIn() {
            const { ready: authReady, timedOut } = useAuthReady();
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [showPw, setShowPw] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [shake, setShake] = useState(false);
            const [fieldErr, setFieldErr] = useState({});
            const [forgotOpen, setForgotOpen] = useState(false);

            const fail = (msg, field) => {
                setError(msg);
                setFieldErr(field ? { [field]: true } : {});
                setShake(true);
                setTimeout(() => setShake(false), 500);
                return false;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setFieldErr({});

                if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Hindi valid ang email address.", "email");
                if (!password) return fail("Ilagay ang password.", "password");

                setLoading(true);
                try {
                    await window.TipidAuth.logIn(email.trim(), password);
                    setLoading(false);

                    await swalSuccess({
                        title: "Balik ka na!",
                        text: "Matagumpay kang naka-log in. Papasok ka na sa dashboard mo.",
                        confirmButtonText: "Sige",
                    });

                    window.location.href = "dashboard.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            const handleGoogle = async () => {
                setError("");
                setLoading(true);

                try {
                    await window.TipidAuth.loginWithGoogle();
                    setLoading(false);

                    await swalSuccess({
                        title: "Balik ka na!",
                        text: "Naka-log in ka gamit ang Google. Papasok ka na sa dashboard mo.",
                        confirmButtonText: "Sige",
                    });

                    window.location.href = "dashboard.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            return (
                <div className="min-h-screen flex items-center bg-paper text-ink px-2 sm:px-3 lg:px-4">
                    <div className={shake ? "login-shell shake" : "login-shell"}>

                        <section className="login-visual">
                            <WeavePattern />

                            <div className="visual-top">
                                <a href="index.html" className="visual-brand">
                                    <Logo size={30} light />
                                    <span className="text-xl font-display font-semibold tracking-tight">Tipid</span>
                                </a>

                                <div className="visual-pill">
                                    <span aria-hidden="true">🇵🇭</span>
                                    Gawang Pilipino
                                </div>
                            </div>

                            <div className="visual-content">
                                <p className="visual-eyebrow">Balik-tanaw sa gastos</p>
                                <h2 className="visual-title">Mas madaling mag-tipid kapag alam mo kung saan napupunta.</h2>
                                <p className="visual-copy">
                                    Isang simple at friendly na space para ma-manage ang iyong gastos, budget, at mga goal.
                                </p>
                            </div>

                            <div className="visual-mascot-glow"></div>
                            <img
                                src="/assets/login_mascot.png"
                                alt="Tipid Buddy"
                                className="visual-mascot"
                                draggable="false"
                            />

                            <div className="visual-bottom">
                                <div className="visual-note">
                                    “Konti-konti lang. Ang mahalaga, tuloy-tuloy.”
                                </div>

                                <div className="visual-stat">
                                    <span className="visual-stat-dot"></span>
                                    Simple · Filipino · Built for everyday spending
                                </div>
                            </div>

                            <div className="absolute -bottom-24 -right-24 text-sun/50 pointer-events-none">
                                <SunRays size={300} />
                            </div>

                            <TinyStar style={{ position: "absolute", top: "18%", right: "26%" }} delay={0} size={9} />
                            <TinyStar style={{ position: "absolute", top: "27%", right: "18%" }} delay={0.8} size={7} />
                            <TinyStar style={{ position: "absolute", top: "11%", right: "11%" }} delay={1.5} size={8} />
                        </section>

                        <section className="login-form-side">
                            <div className="login-form-wrap fade-up">
                                <div className="login-mobile-brand mb-6 flex items-center justify-center gap-2.5">
                                    <Logo size={28} />
                                    <span className="text-lg font-display font-semibold">Tipid</span>
                                </div>

                                <div className="login-form-head">
                                    <p className="login-form-eyebrow">Welcome back</p>
                                    <h1 className="login-form-title">Mag-log in</h1>
                                    <p className="login-form-subtitle">Masaya kaming makita kang muli. Balik na tayo sa tipid.</p>
                                </div>

                                {timedOut && !authReady && (
                                    <div className="mb-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                        <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                        <span>Hindi ma-connect sa auth system. Paki-refresh ang page o subukan ulit mamaya.</span>
                                    </div>
                                )}

                                <div className="login-form-card">
                                    <button
                                        onClick={handleGoogle}
                                        disabled={loading || !authReady}
                                        type="button"
                                        className="social-button flex items-center justify-center gap-2.5 disabled:opacity-50"
                                    >
                                        <GoogleIcon size={18} />
                                        Mag-log in gamit ang Google
                                    </button>

                                    <div className="flex items-center gap-3 my-5">
                                        <div className="ledger-rule flex-1"></div>
                                        <span className="text-[11px] font-mono text-ink2/45 uppercase">o</span>
                                        <div className="ledger-rule flex-1"></div>
                                    </div>

                                    {error && (
                                        <div className="mb-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                            <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                            <span>{error}</span>
                                        </div>
                                    )}

                                    <form onSubmit={handleSubmit} className="space-y-3.5">
                                        <Field icon={Icons.Mail} error={fieldErr.email}>
                                            <input
                                                type="email"
                                                value={email}
                                                onChange={e => setEmail(e.target.value)}
                                                placeholder="Email address"
                                                autoComplete="email"
                                            />
                                        </Field>

                                        <Field icon={Icons.Lock} error={fieldErr.password}>
                                            <input
                                                type={showPw ? "text" : "password"}
                                                value={password}
                                                onChange={e => setPassword(e.target.value)}
                                                placeholder="Password"
                                                autoComplete="current-password"
                                            />

                                            <button
                                                type="button"
                                                onClick={() => setShowPw(v => !v)}
                                                className="text-ink2/50 hover:text-ink2 shrink-0 transition-colors"
                                                aria-label="Toggle password visibility"
                                            >
                                                {showPw ? <Icons.EyeOff size={17} /> : <Icons.Eye size={17} />}
                                            </button>
                                        </Field>

                                        <div className="flex justify-end">
                                            <button
                                                type="button"
                                                onClick={() => setForgotOpen(v => !v)}
                                                className="text-xs font-semibold text-peso hover:underline"
                                            >
                                                Nakalimutan ang password?
                                            </button>
                                        </div>

                                        <ForgotPassword open={forgotOpen} onClose={() => setForgotOpen(false)} />

                                        <button
                                            type="submit"
                                            disabled={loading || !authReady}
                                            className="auth-button bg-peso hover:bg-pesoLight disabled:opacity-60 text-paper flex items-center justify-center gap-2 mt-2"
                                        >
                                            {loading && <Icons.Loader size={16} className="spin" />}
                                            {loading ? "Nag-lo-log in..." : "Mag-log In"}
                                        </button>
                                    </form>

                                    <div className="login-helper">
                                        <span className="login-helper-note">Secure login · Gawang Pilipino · Tipid</span>
                                        <p className="text-sm text-ink2">
                                            Wala pang account?
                                            <a href="signup.html" className="text-peso font-semibold hover:underline ml-1">
                                                Gumawa ng account
                                            </a>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            )
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<LogIn />);
    </script>

    <!-- PWA Service Worker Registration & Auto-Update Alert -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                Swal.fire({
                                    title: "May Bagong Update! 🎉",
                                    text: "May in-add kaming bagong features sa Tipid App. I-refresh ang app para magamit ito.",
                                    icon: "info",
                                    confirmButtonText: "I-update Ngayon",
                                    confirmButtonColor: "#1F6F54",
                                    allowOutsideClick: false,
                                    customClass: { popup: "tipid-swal" }
                                }).then(() => {
                                    window.location.reload();
                                });
                            }
                        });
                    });
                }).catch(err => console.error("Service Worker registration failed:", err));
            });
        }
    </script>
</body>
