<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profile — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global Dark Mode Script Initializer -->
    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enables dark mode toggling
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)',
                        'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <style>
        :root {
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --page-bg: #F1F4EF;
        }

        /* Base Dark Mode overrides */
        html { background: #F1F4EF; transition: background-color 0.3s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; --page-bg: #111A15; }

        body { font-feature-settings: "tnum" 1, "lnum" 1; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.85s linear infinite; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.7s var(--ease-ios) both; }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.08); opacity: 0.85; }
        }
        .logo-breathe { animation: logoBreathe 1.7s ease-in-out infinite; }

        @keyframes haloPulse {
            0%   { transform: scale(0.9); opacity: 0.35; }
            70%  { opacity: 0; }
            100% { transform: scale(1.7); opacity: 0; }
        }
        .halo-pulse { animation: haloPulse 2s var(--ease-ios) infinite; }

        @keyframes heroFloat {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(0, -10px); }
        }
        .hero-float { animation: heroFloat 6s ease-in-out infinite; }

        /* --- Resibo perforation: torn-receipt seam under the hero card, on-brand with Tipid's perf-edge motif --- */
        .receipt-edge { position: relative; }
        .receipt-edge::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -9px;
            height: 18px;
            background-image: radial-gradient(circle at 9px 9px, var(--page-bg) 9px, transparent 9.5px);
            background-size: 18px 18px;
            background-repeat: repeat-x;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes mascotHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .profile-mascot-img {
            animation: mascotHover 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(18,61,46,0.35));
        }
        .speech-bubble {
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
            box-shadow: 0 10px 25px -5px rgba(18, 61, 46, 0.25);
        }

        /* iOS-style spring for the dark mode toggle knob */
        .ios-toggle-knob { transition: transform 0.35s var(--ease-spring); }

        .glass-panel {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.55);
        }
        html.dark .glass-panel { background: rgba(24,38,31,0.55); border: 1px solid rgba(255,255,255,0.08); }

        .tap-scale { transition: transform 0.18s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.94); }

        @media (prefers-reduced-motion: reduce) {
            .spin, .fade-up, .logo-breathe, .halo-pulse, .hero-float, .ios-toggle-knob, .tap-scale, .profile-mascot-img, .speech-bubble {
                animation: none !important;
                transition: none !important;
            }
        }

        .swal2-popup.tipid-swal { border-radius: 20px !important; font-family: 'Inter', sans-serif; }
        .tipid-swal .swal2-title { font-family: 'Fraunces', serif; color: #15231C; }
        .tipid-swal .swal2-html-container { color: #33443A; }
        .tipid-swal .swal2-confirm { border-radius: 999px !important; padding: 0.65em 1.6em !important; font-weight: 600 !important; box-shadow: none !important; }
        .tipid-swal .swal2-cancel { border-radius: 999px !important; padding: 0.65em 1.6em !important; font-weight: 600 !important; }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper antialiased font-body min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>;
        }

        window.Icons = {
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Trash: (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Inbox: (p) => <Icon {...p} path={<><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></>} />,
            Pencil: (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />,
            TrendUp: (p) => <Icon {...p} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />,
            TrendDown: (p) => <Icon {...p} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            Home: (p) => <Icon {...p} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
            Chart: (p) => <Icon {...p} path={<><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></>} />,
            List: (p) => <Icon {...p} path={<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>} />,
            Category: (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            User: (p) => <Icon {...p} path={<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            Target: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
            LogOut: (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />
        };

        window.Logo = function Logo({ size = 30 }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>;
        }

        window.useAuthReady = function() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        window.useDataReady = function() {
            const [ready, setReady] = React.useState(!!window.TipidData);
            React.useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }

        function swalSuccess(title, text) { return Swal.fire({ icon: "success", title, text, confirmButtonText: "Sige", confirmButtonColor: "#1F6F54", customClass: { popup: "tipid-swal" }}); }
        function swalError(text) { return Swal.fire({ icon: "error", title: "Error", text, confirmButtonText: "Sige", confirmButtonColor: "#B5483B", customClass: { popup: "tipid-swal" }}); }
    </script>

    <script type="text/babel" src="./components/navbar.js"></script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[360px] h-[360px] bg-peso/[0.07] dark:bg-pesoLight/[0.07] rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[380px] h-[380px] bg-gold/[0.07] dark:bg-gold/[0.04] rounded-full blur-[100px]" />
                </div>
            );
        }

        // Same reusable header shape used on dashboard.html, bills.html,
        // chart.html, and history.html — bold Fraunces title + short
        // subtitle. No leading icon here since each card below already has
        // its own icon; keeps this page's rhythm the same as the rest of
        // the app without repeating the icon twice.
        function SectionHeader({ title, subtitle }) {
            return (
                <div className="mb-3 ml-1">
                    <h2 className="font-display text-lg font-semibold text-ink dark:text-paper tracking-tight leading-tight">
                        {title}
                    </h2>
                    {subtitle && (
                        <p className="text-xs text-ink2/50 dark:text-paper/40 mt-0.5">{subtitle}</p>
                    )}
                </div>
            );
        }

        /* --- MODERN PROFILE HERO CARD (matched to Bills Center / Analytics / Kasaysayan) ---
           No dark-mode icon toggle here on purpose — the Appearance card
           below already owns that control, so this stays the identity
           moment: avatar, greeting, email, and Buddy saying hi. The mascot
           image is optional and hides itself gracefully if the asset
           hasn't been added yet, same pattern as window.Logo's fallback. */
        function ProfileHeroCard({ displayName, email, initial }) {
            const [mascotOk, setMascotOk] = React.useState(true);
            const firstName = displayName ? displayName.trim().split(/\s+/)[0] : "";

            return (
                <div className="relative receipt-edge mb-6 sm:mb-8">
                <div className="relative overflow-hidden rounded-[1.75rem] sm:rounded-[2rem] bg-gradient-to-br from-[#247E61] via-[#1A614A] to-[#0F382A] text-paper p-5 sm:p-7 shadow-iosLg ring-1 ring-white/15 min-h-[190px] sm:min-h-[210px] flex flex-col justify-between">

                    {/* Ambient Glows Inside Card */}
                    <div className="absolute -top-16 -right-10 w-56 h-56 bg-white/[0.08] rounded-full blur-[50px] hero-float" />
                    <div className="absolute -bottom-24 -left-10 w-60 h-60 bg-gold/[0.12] rounded-full blur-[60px]" />

                    {/* Mascot Container (self-hides if /assets/profile_mascot.png isn't there yet) */}
                    {mascotOk && (
                        <div className="absolute right-0 bottom-0 w-[120px] sm:w-[160px] h-full pointer-events-none z-0 overflow-visible">
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-20 h-20 bg-white/15 blur-2xl rounded-full"></div>
                            <img
                                src="/assets/profile_mascot.png"
                                alt="Tipid Buddy waving hello"
                                onError={() => setMascotOk(false)}
                                className="absolute bottom-[-8px] right-0 w-full object-contain profile-mascot-img"
                                draggable="false"
                            />
                            <div className="speech-bubble absolute top-[12%] right-[55%] sm:right-[65%] bg-paper text-ink rounded-2xl px-3 py-2 text-[10px] sm:text-xs font-medium leading-tight w-max max-w-[110px] sm:max-w-[130px] border border-white/50">
                                <strong className="block font-bold text-[#1F6F54] mb-0.5">Kumusta!</strong>
                                Ito ang lugar mo. 💚
                                <div className="absolute -bottom-1.5 right-6 w-3 h-3 bg-paper rotate-45 border-r border-b border-white/50"></div>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    <div className="relative z-10 flex flex-col h-full gap-4 max-w-[75%] sm:max-w-[62%]">
                        <div className="mt-2 sm:mt-3">
                            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/15 border border-white/10 text-white mb-3 backdrop-blur-sm">
                                <span className="w-1.5 h-1.5 rounded-full bg-gold animate-pulse" />
                                <span className="text-[9px] font-mono font-bold uppercase tracking-widest text-paper/90">Tipid Buddy</span>
                            </div>

                            <div className="flex items-center gap-3 mb-2 sm:mb-3">
                                <div className="w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-white/15 border-2 border-white/40 flex items-center justify-center text-paper font-display font-semibold text-lg backdrop-blur-sm shrink-0">
                                    {initial}
                                </div>
                                <h1 className="font-display text-[1.35rem] sm:text-[2rem] font-bold tracking-tight leading-[1.1]">
                                    {firstName ? `Kumusta, ${firstName}!` : "Kumusta!"}
                                </h1>
                            </div>

                            <p className="text-[11px] sm:text-[13px] font-medium text-white/80 leading-relaxed break-all pr-2">
                                {email}
                            </p>
                        </div>
                    </div>
                </div>
                </div>
            );
        }

        function ProfileApp() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();

            const [user, setUser] = React.useState(undefined);
            const [displayName, setDisplayName] = React.useState("");
            const [budgetInput, setBudgetInput] = React.useState("");
            const [goalInput, setGoalInput] = React.useState("");

            const [isDark, setIsDark] = React.useState(() => document.documentElement.classList.contains('dark'));

            // Toggle Dark Mode Function
            const toggleDarkMode = () => {
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('tipid_theme', 'light');
                    setIsDark(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('tipid_theme', 'dark');
                    setIsDark(true);
                }
            };

            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => {
                    setUser(u || null);
                    if (u) setDisplayName(u.displayName || "");
                });
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                return window.TipidData.subscribeBudget(
                    user.uid,
                    (b) => setBudgetInput(b ? b.toString() : ""),
                    (err) => console.error(err)
                );
            }, [dataReady, user]);

            React.useEffect(() => {
                const savedGoal = localStorage.getItem('tipid_goal');
                if (savedGoal) setGoalInput(savedGoal);
            }, []);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-4 rounded-[28px] px-10 py-9 shadow-sm">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/20 halo-pulse" />
                                <div className="relative logo-breathe">
                                    <window.Logo size={40} />
                                </div>
                            </div>
                            <p className="text-xs font-mono tracking-[0.2em] uppercase text-ink2 dark:text-paper/50 text-center">
                                Loading your profile
                            </p>
                        </div>
                    </div>
                );
            }

            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                if (!displayName.trim()) return swalError("Paki-lagay ang iyong pangalan.");
                try {
                    const { updateProfile } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");
                    await updateProfile(user, { displayName: displayName.trim() });
                    setUser({ ...user, displayName: displayName.trim() });
                    swalSuccess("Tagumpay", "Na-update na ang iyong pangalan.");
                } catch (err) { swalError("Hindi ma-update ang profile. Subukan ulit."); }
            };

            const handleUpdatePreferences = async (e) => {
                e.preventDefault();
                const amt = parseFloat(budgetInput);
                const target = parseFloat(goalInput);

                if (isNaN(amt) || amt <= 0) return swalError("Maglagay ng tamang halaga para sa budget.");

                try {
                    await window.TipidData.setBudget(user.uid, amt);
                    if (!isNaN(target) && target > 0) {
                        localStorage.setItem('tipid_goal', target.toString());
                    }
                    swalSuccess("Tagumpay", "Na-update na ang iyong Preferences at Goal.");
                } catch (err) { swalError("Hindi ma-save. Subukan ulit."); }
            };

            const handleLogout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            const initial = displayName ? displayName.charAt(0).toUpperCase() : (user.email.charAt(0).toUpperCase());

            return (
                <div className="min-h-dvh relative">
                    <AmbientBackground />
                    <Navbar user={user} onLogout={handleLogout} activeTab="profile" />

                    {/* Generous, safe-area aware padding so content never sits under the notch or bottom nav */}
                    <main
                        className="max-w-2xl mx-auto px-5 sm:px-8 pt-32 md:pt-14 pb-40 md:pb-20 space-y-10 md:space-y-14"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(env(safe-area-inset-left) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(env(safe-area-inset-right) + 1.25rem))',
                            paddingBottom: 'calc(10rem + env(safe-area-inset-bottom))',
                        }}
                    >

                        {/* Identity hero — replaces the old plain centered avatar block */}
                        <div className="fade-up" style={{ animationDelay: '0ms' }}>
                            <ProfileHeroCard displayName={displayName} email={user.email} initial={initial} />
                        </div>

                        {/* Appearance Card */}
                        <div className="fade-up" style={{ animationDelay: '90ms' }}>
                            <SectionHeader title="Appearance" subtitle="I-adjust ang itsura ng app." />
                            <div className="bg-white/85 dark:bg-ink2/30 backdrop-blur-xl rounded-[1.75rem] border border-line/50 dark:border-white/10 shadow-[0_1px_2px_rgba(21,35,28,0.04),0_14px_28px_-16px_rgba(21,35,28,0.18)] overflow-hidden p-5 sm:p-6 flex items-center justify-between transition-all">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 rounded-full bg-ink dark:bg-paper flex items-center justify-center text-paper dark:text-ink shadow-sm">
                                        <Icons.Moon size={18} />
                                    </div>
                                    <span className="text-base font-medium">Dark Mode</span>
                                </div>

                                {/* iOS Toggle Switch */}
                                <button
                                    onClick={toggleDarkMode}
                                    className={`tap-scale w-14 h-7 rounded-full transition-colors duration-300 relative flex items-center shadow-inner ${isDark ? 'bg-peso' : 'bg-line/80'}`}
                                >
                                    <div className={`ios-toggle-knob w-6 h-6 bg-white rounded-full absolute shadow-md ${isDark ? 'translate-x-7' : 'translate-x-0.5'}`}></div>
                                </button>
                            </div>
                        </div>

                        {/* Financial Goals & Settings Card */}
                        <div className="fade-up" style={{ animationDelay: '180ms' }}>
                            <SectionHeader title="Financial Settings" subtitle="Para sa mas magandang pagpaplano ng pera mo." />
                            <div className="bg-white/85 dark:bg-ink2/30 backdrop-blur-xl rounded-[1.75rem] border border-line/50 dark:border-white/10 shadow-[0_1px_2px_rgba(21,35,28,0.04),0_14px_28px_-16px_rgba(21,35,28,0.18)] overflow-hidden">
                                <form onSubmit={handleUpdatePreferences} className="p-6 sm:p-7 flex flex-col gap-6">

                                    {/* Monthly Budget Input */}
                                    <div className="flex flex-col gap-2">
                                        <label className="text-xs font-semibold uppercase tracking-wider text-ink2/60 dark:text-paper/60">Buwanang Budget (₱)</label>
                                        <div className="flex-1 flex items-center gap-3 bg-paper/50 dark:bg-ink2/40 border border-line dark:border-ink2/50 rounded-2xl px-4 py-3.5 focus-within:ring-2 focus-within:ring-peso/40 focus-within:border-peso/40 shadow-inner transition-all duration-200">
                                            <Icons.Wallet size={18} className="text-ink2/50 dark:text-paper/50" />
                                            <input type="number" step="0.01" value={budgetInput} onChange={e => setBudgetInput(e.target.value)} placeholder="e.g. 10000" className="w-full bg-transparent text-base focus:outline-none font-medium text-ink dark:text-paper" />
                                        </div>
                                    </div>

                                    {/* Savings Goal Input */}
                                    <div className="flex flex-col gap-2">
                                        <label className="text-xs font-semibold uppercase tracking-wider text-ink2/60 dark:text-paper/60">Ipon Target (₱)</label>
                                        <div className="flex-1 flex items-center gap-3 bg-paper/50 dark:bg-ink2/40 border border-line dark:border-ink2/50 rounded-2xl px-4 py-3.5 focus-within:ring-2 focus-within:ring-peso/40 focus-within:border-peso/40 shadow-inner transition-all duration-200">
                                            <Icons.Target size={18} className="text-ink2/50 dark:text-paper/50" />
                                            <input type="number" step="0.01" value={goalInput} onChange={e => setGoalInput(e.target.value)} placeholder="e.g. 5000" className="w-full bg-transparent text-base focus:outline-none font-medium text-ink dark:text-paper" />
                                        </div>
                                        <p className="text-[11px] text-ink2/50 dark:text-paper/50 mt-1 ml-1 leading-relaxed">Set a target to track your "Ipon" category progress.</p>
                                    </div>

                                    <button type="submit" className="tap-scale w-full bg-peso hover:bg-pesoLight text-paper py-3.5 rounded-2xl text-base font-semibold transition-colors mt-4 shadow-[0_10px_24px_-10px_rgba(18,61,46,0.5)]">
                                        I-save ang mga Setting
                                    </button>
                                </form>
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<ProfileApp />);
    </script>
    <!-- PWA Service Worker Registration & Auto-Update Alert -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {

                    // Makikinig ang app kung may dina-download na bagong update (bagong CACHE_VERSION)
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            // Kapag tapos na i-download ang bagong update
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // Premium UX: Magpapakita ng magandang prompt imbes na biglang i-refresh ang screen
                                Swal.fire({
                                    title: "May Bagong Update! 🎉",
                                    text: "May in-add kaming bagong features sa Tipid App. I-refresh ang app para magamit ito.",
                                    icon: "info",
                                    confirmButtonText: "I-update Ngayon",
                                    confirmButtonColor: "#1F6F54",
                                    allowOutsideClick: false,
                                    customClass: { popup: "tipid-swal" }
                                }).then(() => {
                                    // Ire-reload ang app at makikita na ang bagong features
                                    window.location.reload();
                                });
                            }
                        });
                    });

                }).catch(err => console.error("Service Worker registration failed:", err));
            });
        }
    </script>
</body>
</html>
