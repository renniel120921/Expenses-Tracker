<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tipid logo">
  <defs>
    <!-- Background Gradient: Rich Deep Emerald to Obsidian Forest -->
    <linearGradient id="tipidBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#084E37"/>
      <stop offset="45%" stop-color="#063D2B"/>
      <stop offset="100%" stop-color="#021E15"/>
    </linearGradient>

    <!-- Top Ambient Glow -->
    <radialGradient id="topGlow" cx="50%" cy="12%" r="68%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Rim Highlight (Apple HIG Chamfer Glint) -->
    <linearGradient id="rimGlint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Inner Ambient Ring for Maskable Safe Zone Balance -->
    <linearGradient id="tokenBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Porcelain White to Soft Mint Glyph Gradient -->
    <linearGradient id="glyphSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4FAF6"/>
      <stop offset="100%" stop-color="#E2F4EB"/>
    </linearGradient>

    <!-- Card Top Facet Sheen -->
    <linearGradient id="cardFacet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Radiant Gold Prosperity Spark Gradient -->
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadows for 3D Tactile Depth -->
    <filter id="emblemDepth" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00140B" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#00140B" flood-opacity="0.35"/>
    </filter>
    <filter id="sparkleDepth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00140B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Apple-style Squircle Badge -->
  <rect width="512" height="512" rx="116" fill="url(#tipidBg)"/>
  <rect width="512" height="512" rx="116" fill="url(#topGlow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rimGlint)" stroke-width="2.5"/>

  <!-- Centered Inner Subtle Ambient Ring (Within Maskable Safe Zone) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#tokenBorder)" stroke-width="1.5"/>

  <!-- Hero Sculpted Modern "Tipid T" Monogram -->
  <g filter="url(#emblemDepth)">
    <!-- Seamless Sculpted T-Form with Smooth Filleted Corners -->
    <path
      d="
        M 166 142
        H 346
        A 30 30 0 0 1 376 172
        A 30 30 0 0 1 346 202
        H 298
        A 14 14 0 0 0 284 216
        V 336
        A 28 28 0 0 1 256 364
        A 28 28 0 0 1 228 336
        V 216
        A 14 14 0 0 0 214 202
        H 166
        A 30 30 0 0 1 136 172
        A 30 30 0 0 1 166 142
        Z
      "
      fill="url(#glyphSheen)"
    />

    <!-- Subtle Smart Card Facet Overlay on the Crossbar -->
    <path
      d="
        M 256 142
        H 346
        A 30 30 0 0 1 376 172
        A 30 30 0 0 1 346 202
        H 256
        Z
      "
      fill="url(#cardFacet)"
    />

    <!-- Subtle Centered Currency / Notch Accent (Modern Tactile Detail) -->
    <rect x="240" y="238" width="32" height="6" rx="3" fill="#063D2B" opacity="0.32"/>
  </g>

  <!-- Prosperity Sparkle Star in Radiant Philippine Gold -->
  <path
    d="M 374 116 Q 374 134 392 134 Q 374 134 374 152 Q 374 134 356 134 Q 374 134 374 116 Z"
    fill="url(#goldSheen)"
    filter="url(#sparkleDepth)"
  />
</svg>
