<!DOCTYPE html>
<html lang="fil" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/app.css">
    <link rel="manifest" href="/manifest.json">
    <script src="/app-utils.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mag-log In — Tipid</title>
    <meta name="theme-color" content="#123D2E">
    <link rel="icon" href="/assets/login_mascot.png" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>

    <style>
        html { background: #FFFFFF; }
        body { font-feature-settings: "tnum" 1, "lnum" 1; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.5s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }

        @keyframes floatSm {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .float-sm { animation: floatSm 3.4s ease-in-out infinite; }

        .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
        .panel.open { grid-template-rows: 1fr; }
        .panel > div { overflow: hidden; }

        .page-shell {
            min-height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            background: #FFFFFF;
        }

        .auth-card {
            width: 100%;
            max-width: 428px;
            background: #FFFFFF;
            border: 1px solid #EDF1EB;
            border-radius: 28px;
            padding: 30px 30px 28px;
            box-shadow: 0 30px 70px -40px rgba(18,61,46,.18);
        }

        .back-btn {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #33443A;
            background: #FFFFFF;
            border: 1.5px solid #E9EDE6;
            transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
        }
        .back-btn:hover { background: #F7FAF7; border-color: #D3DAD0; }
        .back-btn:active { transform: scale(.94); }

        .welcome-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        .mascot-wrap {
            position: relative;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .mascot-glow {
            position: absolute;
            inset: -6px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(31,111,84,.16), transparent 70%);
        }

        .mascot-avatar {
            position: relative;
            width: 60px;
            height: 60px;
            object-fit: contain;
            object-position: center bottom;
        }

        .mascot-bubble {
            position: relative;
            background: #FFFFFF;
            border: 1.5px solid #E9EDE6;
            border-radius: 14px;
            padding: 9px 12px;
            font: 600 12.5px/1.4 'Inter', sans-serif;
            color: #33443A;
        }

        .mascot-bubble::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 16px;
            width: 10px;
            height: 10px;
            background: #FFFFFF;
            border-left: 1.5px solid #E9EDE6;
            border-bottom: 1.5px solid #E9EDE6;
            transform: rotate(45deg);
            border-radius: 2px;
        }

        .auth-title {
            font: 700 1.6rem/1.18 'Fraunces', serif;
            letter-spacing: -.02em;
            color: #15231C;
        }

        .auth-subtitle {
            margin-top: 6px;
            color: rgba(51,68,58,.62);
            font: 500 13.5px/1.5 'Inter', sans-serif;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            font: 600 13px/1 'Inter', sans-serif;
            color: #33443A;
        }

        .field-shell {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            background: #FFFFFF;
            border: 1.5px solid #E2E8DF;
            border-radius: 14px;
            padding: 0 15px;
            transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
        }

        .field-shell:focus-within {
            border-color: rgba(31,111,84,.5);
            box-shadow: 0 0 0 4px rgba(31,111,84,.08);
        }

        .field-shell.error { border-color: rgba(181,72,59,.55); background: rgba(181,72,59,.04); }

        .field-shell input {
            width: 100%;
            min-width: 0;
            background: transparent;
            padding: 13px 0;
            font-size: 14.5px;
            color: #15231C;
            outline: none;
        }

        .field-shell input::placeholder { color: rgba(51,68,58,.38); }

        .field-shell.compact input { padding: 11px 0; font-size: 13.5px; }

        .submit-btn {
            width: 100%;
            border-radius: 999px;
            padding: 15px 16px;
            font: 700 14.5px 'Inter', sans-serif;
            color: #F8FAF8;
            background: #1F6F54;
            box-shadow: 0 18px 32px -18px rgba(31,111,84,.65);
            transition: background-color .2s ease, transform .16s ease, box-shadow .2s ease;
        }
        .submit-btn:hover:not(:disabled) { background: #226A50; box-shadow: 0 20px 36px -16px rgba(31,111,84,.7); }
        .submit-btn:active:not(:disabled) { transform: scale(.985); }
        .submit-btn:disabled { opacity: .55; }

        .oauth-circle {
            width: 52px;
            height: 52px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 1px solid #D3DAD0;
            transition: border-color .18s ease, transform .16s ease, box-shadow .2s ease;
        }
        .oauth-circle:hover:not(:disabled) { border-color: rgba(21,35,28,.22); box-shadow: 0 12px 26px -18px rgba(18,61,46,.4); }
        .oauth-circle:active:not(:disabled) { transform: scale(.95); }
        .oauth-circle:disabled { opacity: .5; }

        @media (prefers-reduced-motion: reduce) {
            .spin, .shake, .fade-up, .float-sm { animation: none !important; transition: none !important; }
        }

        .swal2-popup.tipid-swal {
            border-radius: 20px !important;
            font-family: 'Inter', sans-serif;
        }
        .tipid-swal .swal2-title { font-family: 'Fraunces', serif; color: #15231C; }
        .tipid-swal .swal2-html-container { color: #33443A; }
        .tipid-swal .swal2-confirm {
            border-radius: 999px !important;
            padding: 0.65em 1.6em !important;
            font-weight: 600 !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body class="bg-paper text-ink antialiased font-body min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        const Icons = {
            ArrowLeft: (p) => <Icon {...p} path={<><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></>} />,
            Mail: (p) => <Icon {...p} path={<><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></>} />,
            Eye: (p) => <Icon {...p} path={<><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>} />,
            EyeOff: (p) => <Icon {...p} path={<><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a17.4 17.4 0 0 1-2.24 3.32M6.16 6.16C3.4 7.9 2 11 2 11s3.5 7 10 7a9.4 9.4 0 0 0 4.24-.94"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="2" y1="2" x2="22" y2="22"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            CheckCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />,
        };

        function GoogleIcon({ size = 20 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                    <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5c-8.2 0-15.2 4.7-18.7 11.2Z"/>
                    <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.4C29.6 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.7 16.2 44.5 24 44.5Z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.5 5.4C41.8 35.4 44.5 30.2 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                </svg>
            );
        }

        function Logo({ size = 30 }) {
            const [broken, setBroken] = useState(false);

            if (!broken) {
                return (
                    <img
                        src="/assets/logo.svg"
                        alt="Tipid logo"
                        width={size}
                        height={size}
                        onError={() => setBroken(true)}
                        style={{ width: size, height: size }}
                        className="rounded-md"
                    />
                );
            }

            return (
                <span
                    style={{ width: size, height: size }}
                    className="rounded-md flex items-center justify-center font-display font-semibold bg-ink text-paper"
                >
                    ₱
                </span>
            );
        }

        function useAuthReady() {
            const [ready, setReady] = useState(!!window.TipidAuth);
            const [timedOut, setTimedOut] = useState(false);

            useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                const t = setTimeout(() => setTimedOut(true), 6000);
                return () => {
                    window.removeEventListener("tipid-auth-ready", h);
                    clearTimeout(t);
                };
            }, []);

            return { ready, timedOut };
        }

        function swalSuccess({ title, text, confirmButtonText }) {
            return Swal.fire({
                icon: "success",
                title, text, confirmButtonText,
                confirmButtonColor: "#1F6F54",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }

        function swalError(text) {
            return Swal.fire({
                icon: "error",
                title: "Hindi Matagumpay",
                text,
                confirmButtonText: "Sige",
                confirmButtonColor: "#B5483B",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }

        function Field({ label, error, compact, children }) {
            return (
                <div>
                    {label && <label className="field-label">{label}</label>}
                    <div className={`field-shell ${compact ? "compact" : ""} ${error ? "error" : ""}`}>{children}</div>
                </div>
            );
        }

        function ForgotPassword({ open, onClose }) {
            const [email, setEmail] = useState("");
            const [status, setStatus] = useState("idle"); // idle, sending, sent, error
            const [msg, setMsg] = useState("");

            const send = async (e) => {
                e.preventDefault();
                if (!/^\S+@\S+\.\S+$/.test(email)) {
                    setStatus("error");
                    setMsg("Hindi valid ang email address.");
                    return;
                }
                setStatus("sending");
                setMsg("");
                try {
                    await window.TipidAuth.resetPassword(email.trim());
                    setStatus("sent");
                } catch (err) {
                    setStatus("error");
                    setMsg(window.TipidAuth.friendlyError(err.code || err));
                }
            };

            return (
                <div className={`panel ${open ? "open" : ""}`}>
                    <div>
                        <div className="mt-1 pt-4 border-t border-dashed border-line">
                            {status === "sent" ? (
                                <div className="space-y-3">
                                    <div className="flex items-start gap-2 bg-peso/10 text-peso text-sm rounded-xl px-3.5 py-3">
                                        <Icons.CheckCircle size={16} className="shrink-0 mt-0.5" />
                                        <span>Kung rehistrado ang <strong>{email}</strong>, naipadala na ang password reset link. Pakitingnan ang iyong <strong>Inbox</strong> o <strong>Spam / Junk folder</strong>.</span>
                                    </div>
                                    <button type="button" onClick={() => { setStatus("idle"); setEmail(""); onClose(); }} className="text-xs font-semibold text-peso hover:underline">
                                        Isara ang form
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={send} className="space-y-3">
                                    <p className="text-sm text-ink2">Ilagay ang email mo, papadalhan ka namin ng reset link.</p>

                                    {status === "error" && (
                                        <div className="flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-2.5">
                                            <Icons.AlertCircle size={15} className="shrink-0 mt-0.5" />
                                            <span>{msg}</span>
                                        </div>
                                    )}

                                    <Field compact>
                                        <input
                                            type="email"
                                            value={email}
                                            onChange={e => setEmail(e.target.value)}
                                            placeholder="Email address"
                                        />
                                    </Field>

                                    <div className="flex gap-2.5">
                                        <button type="submit" disabled={status === "sending"}
                                                className="flex-1 bg-ink hover:bg-pesoDeep disabled:opacity-60 text-paper text-sm font-semibold py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2">
                                            {status === "sending" && <Icons.Loader size={14} className="spin" />}
                                            {status === "sending" ? "Pinapadala..." : "Ipadala ang link"}
                                        </button>
                                        <button type="button" onClick={onClose} className="text-sm font-semibold text-ink2 px-3">Kansela</button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function LogIn() {
            const { ready: authReady, timedOut } = useAuthReady();
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [showPw, setShowPw] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [shake, setShake] = useState(false);
            const [fieldErr, setFieldErr] = useState({});
            const [forgotOpen, setForgotOpen] = useState(false);
            const [mascotBroken, setMascotBroken] = useState(false);

            const fail = (msg, field) => {
                setError(msg);
                setFieldErr(field ? { [field]: true } : {});
                setShake(true);
                setTimeout(() => setShake(false), 500);
                return false;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setFieldErr({});

                if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Hindi valid ang email address.", "email");
                if (!password) return fail("Ilagay ang password.", "password");

                setLoading(true);
                try {
                    await window.TipidAuth.logIn(email.trim(), password);
                    setLoading(false);

                    await swalSuccess({
                        title: "Balik ka na!",
                        text: "Matagumpay kang naka-log in. Papasok ka na sa dashboard mo.",
                        confirmButtonText: "Sige",
                    });

                    window.location.href = "dashboard.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            const handleGoogle = async () => {
                setError("");
                setLoading(true);

                try {
                    await window.TipidAuth.loginWithGoogle();
                    setLoading(false);

                    await swalSuccess({
                        title: "Balik ka na!",
                        text: "Naka-log in ka gamit ang Google. Papasok ka na sa dashboard mo.",
                        confirmButtonText: "Sige",
                    });

                    window.location.href = "dashboard.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            return (
                <div className="page-shell">
                    <div className={`auth-card fade-up ${shake ? "shake" : ""}`}>

                        <div className="flex items-center justify-between">
                            <a href="index.html" className="back-btn" aria-label="Bumalik">
                                <Icons.ArrowLeft size={17} />
                            </a>
                            <div className="flex items-center gap-2">
                                <Logo size={34} />
                                <span className="text-lg font-display font-semibold tracking-tight text-ink">Tipid</span>
                            </div>
                            <span className="w-[34px]"></span>
                        </div>

                        <div className="welcome-row">
                            <div className="mascot-wrap float-sm">
                                <div className="mascot-glow"></div>
                                {!mascotBroken ? (
                                    <img
                                        src="/assets/login_mascot.png"
                                        alt="Tipid Buddy"
                                        className="mascot-avatar"
                                        draggable="false"
                                        onError={() => setMascotBroken(true)}
                                    />
                                ) : (
                                    <div className="mascot-avatar rounded-full bg-peso/10 flex items-center justify-center text-2xl">👋</div>
                                )}
                            </div>
                            <div className="mascot-bubble">Kamusta! Balik ka na ba para mag-tipid? </div>
                        </div>

                        <h1 className="auth-title">Mag-log in</h1>
                        <p className="auth-subtitle">Masaya kaming makita kang muli.</p>

                        {timedOut && !authReady && (
                            <div className="mt-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                <span>Hindi ma-connect sa auth system. Paki-refresh ang page o subukan ulit mamaya.</span>
                            </div>
                        )}

                        {error && (
                            <div className="mt-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                <span>{error}</span>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="mt-6 space-y-4">
                            <Field label="Email" error={fieldErr.email}>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                    placeholder="juandelacruz@gmail.com"
                                    autoComplete="email"
                                />
                            </Field>

                            <Field label="Password" error={fieldErr.password}>
                                <input
                                    type={showPw ? "text" : "password"}
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    placeholder="Password"
                                    autoComplete="current-password"
                                />
                                <button
                                    type="button"
                                    onClick={() => setShowPw(v => !v)}
                                    className="text-ink2/50 hover:text-ink2 shrink-0 transition-colors duration-200"
                                    aria-label="Ipakita ang password"
                                >
                                    {showPw ? <Icons.EyeOff size={17} /> : <Icons.Eye size={17} />}
                                </button>
                            </Field>

                            <div className="flex justify-end -mt-1">
                                <button
                                    type="button"
                                    onClick={() => setForgotOpen(v => !v)}
                                    className="text-xs font-semibold text-peso hover:underline"
                                >
                                    Nakalimutan ang password?
                                </button>
                            </div>

                            <ForgotPassword open={forgotOpen} onClose={() => setForgotOpen(false)} />

                            <button
                                type="submit"
                                disabled={loading || !authReady}
                                className="submit-btn flex items-center justify-center gap-2 mt-1"
                            >
                                {loading && <Icons.Loader size={16} className="spin" />}
                                {loading ? "Nag-lo-log in..." : "Mag-log In"}
                            </button>
                        </form>

                        <div className="flex items-center gap-3 my-6">
                            <div className="h-px flex-1 bg-line/70"></div>
                            <span className="text-[12px] text-ink2/50">o mag-log in gamit</span>
                            <div className="h-px flex-1 bg-line/70"></div>
                        </div>

                        <div className="flex items-center justify-center">
                            <button
                                onClick={handleGoogle}
                                disabled={loading || !authReady}
                                type="button"
                                className="oauth-circle"
                                aria-label="Mag-log in gamit ang Google"
                            >
                                <GoogleIcon size={20} />
                            </button>
                        </div>

                        <p className="text-center text-sm text-ink2 mt-7">
                            Wala pang account?
                            <a href="signup.html" className="text-peso font-semibold hover:underline ml-1">
                                Gumawa ng account
                            </a>
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<LogIn />);
    </script>

</body>
</html>
