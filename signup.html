<!DOCTYPE html>
<html lang="fil" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/app.css">
    <link rel="manifest" href="/manifest.json">
    <script src="/app-utils.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gumawa ng Account — Tipid</title>
    <meta name="theme-color" content="#123D2E">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>

    <style>
        html { background: #FFFFFF; }
        body { font-feature-settings: "tnum" 1, "lnum" 1; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.5s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }

        @keyframes growBar {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }
        .grow-bar { animation: growBar 0.3s cubic-bezier(0.34, 1.4, 0.64, 1) both; transform-origin: left; }

        .page-shell {
            min-height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            background: #FFFFFF;
        }

        .auth-card {
            width: 100%;
            max-width: 428px;
            background: #FFFFFF;
            border: 1px solid #EDF1EB;
            border-radius: 28px;
            padding: 34px 30px 28px;
            box-shadow: 0 30px 70px -40px rgba(18,61,46,.18);
        }

        .back-btn {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #33443A;
            background: #FFFFFF;
            border: 1.5px solid #E9EDE6;
            transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
        }
        .back-btn:hover { background: #F7FAF7; border-color: #D3DAD0; }
        .back-btn:active { transform: scale(.94); }

        .auth-title {
            font: 700 1.6rem/1.18 'Fraunces', serif;
            letter-spacing: -.02em;
            color: #15231C;
        }

        .auth-subtitle {
            margin-top: 6px;
            color: rgba(51,68,58,.62);
            font: 500 13.5px/1.5 'Inter', sans-serif;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            font: 600 13px/1 'Inter', sans-serif;
            color: #33443A;
        }

        .field-shell {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            background: #FFFFFF;
            border: 1.5px solid #E2E8DF;
            border-radius: 14px;
            padding: 0 15px;
            transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
        }

        .field-shell:focus-within {
            border-color: rgba(31,111,84,.5);
            box-shadow: 0 0 0 4px rgba(31,111,84,.08);
        }

        .field-shell.error { border-color: rgba(181,72,59,.55); background: rgba(181,72,59,.04); }

        .field-shell input {
            width: 100%;
            min-width: 0;
            background: transparent;
            padding: 13px 0;
            font-size: 14.5px;
            color: #15231C;
            outline: none;
        }

        .field-shell input::placeholder { color: rgba(51,68,58,.38); }

        .agree-box {
            width: 19px;
            height: 19px;
            border-radius: 6px;
            border: 1.7px solid #D3DAD0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color .16s ease, border-color .16s ease;
        }
        .agree-box.checked { background: #1F6F54; border-color: #1F6F54; }
        .agree-box.error { border-color: rgba(181,72,59,.65); }

        .submit-btn {
            width: 100%;
            border-radius: 999px;
            padding: 15px 16px;
            font: 700 14.5px 'Inter', sans-serif;
            color: #F8FAF8;
            background: #1F6F54;
            box-shadow: 0 18px 32px -18px rgba(31,111,84,.65);
            transition: background-color .2s ease, transform .16s ease, box-shadow .2s ease;
        }
        .submit-btn:hover:not(:disabled) { background: #226A50; box-shadow: 0 20px 36px -16px rgba(31,111,84,.7); }
        .submit-btn:active:not(:disabled) { transform: scale(.985); }
        .submit-btn:disabled { opacity: .55; }

        .oauth-circle {
            width: 52px;
            height: 52px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 1px solid #D3DAD0;
            transition: border-color .18s ease, transform .16s ease, box-shadow .2s ease;
        }
        .oauth-circle:hover:not(:disabled) { border-color: rgba(21,35,28,.22); box-shadow: 0 12px 26px -18px rgba(18,61,46,.4); }
        .oauth-circle:active:not(:disabled) { transform: scale(.95); }
        .oauth-circle:disabled { opacity: .5; }

        @media (prefers-reduced-motion: reduce) {
            .spin, .shake, .fade-up, .grow-bar { animation: none !important; transition: none !important; }
        }

        .swal2-popup.tipid-swal {
            border-radius: 20px !important;
            font-family: 'Inter', sans-serif;
        }
        .tipid-swal .swal2-title { font-family: 'Fraunces', serif; color: #15231C; }
        .tipid-swal .swal2-html-container { color: #33443A; }
        .tipid-swal .swal2-confirm {
            border-radius: 999px !important;
            padding: 0.65em 1.6em !important;
            font-weight: 600 !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body class="bg-paper text-ink antialiased font-body min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        const Icons = {
            ArrowLeft: (p) => <Icon {...p} path={<><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></>} />,
            Eye: (p) => <Icon {...p} path={<><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>} />,
            EyeOff: (p) => <Icon {...p} path={<><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a17.4 17.4 0 0 1-2.24 3.32M6.16 6.16C3.4 7.9 2 11 2 11s3.5 7 10 7a9.4 9.4 0 0 0 4.24-.94"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="2" y1="2" x2="22" y2="22"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Check: (p) => <Icon {...p} path={<path d="M20 6 9 17l-5-5"/>} />,
        };

        function GoogleIcon({ size = 20 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                    <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5c-8.2 0-15.2 4.7-18.7 11.2Z"/>
                    <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.4C29.6 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.7 16.2 44.5 24 44.5Z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.5 5.4C41.8 35.4 44.5 30.2 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                </svg>
            );
        }

        function Logo({ size = 30 }) {
            const [broken, setBroken] = useState(false);

            if (!broken) {
                return (
                    <img
                        src="/assets/logo.svg"
                        alt="Tipid logo"
                        width={size}
                        height={size}
                        onError={() => setBroken(true)}
                        style={{ width: size, height: size }}
                        className="rounded-md"
                    />
                );
            }

            return (
                <span
                    style={{ width: size, height: size }}
                    className="rounded-md flex items-center justify-center font-display font-semibold bg-ink text-paper"
                >
                    ₱
                </span>
            );
        }

        function useAuthReady() {
            const [ready, setReady] = useState(!!window.TipidAuth);
            const [timedOut, setTimedOut] = useState(false);

            useEffect(() => {
                if (window.TipidAuth) {
                    setReady(true);
                    return;
                }

                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });

                const t = setTimeout(() => setTimedOut(true), 6000);

                return () => {
                    window.removeEventListener("tipid-auth-ready", h);
                    clearTimeout(t);
                };
            }, []);

            return { ready, timedOut };
        }

        function swalSuccess({ title, text, confirmButtonText }) {
            return Swal.fire({
                icon: "success",
                title,
                text,
                confirmButtonText,
                confirmButtonColor: "#1F6F54",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }

        function swalError(text) {
            return Swal.fire({
                icon: "error",
                title: "Hindi Matagumpay",
                text,
                confirmButtonText: "Sige",
                confirmButtonColor: "#B5483B",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }

        function Field({ label, error, children }) {
            return (
                <div>
                    <label className="field-label">{label}</label>
                    <div className={`field-shell ${error ? "error" : ""}`}>{children}</div>
                </div>
            );
        }

        function scorePassword(pw) {
            if (!pw) return 0;

            let score = 0;
            if (pw.length >= 8) score++;
            if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
            if (/\d/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;

            return score;
        }

        const STRENGTH_META = [
            { label: "Mahina", color: "bg-expense", text: "text-expense" },
            { label: "Mahina", color: "bg-expense", text: "text-expense" },
            { label: "Katamtaman", color: "bg-gold", text: "text-gold" },
            { label: "Malakas", color: "bg-peso", text: "text-peso" },
            { label: "Napakalakas", color: "bg-pesoDeep", text: "text-pesoDeep" },
        ];

        function PasswordStrength({ password }) {
            const score = useMemo(() => scorePassword(password), [password]);
            const filled = password.length ? Math.max(score, 1) : 0;
            const meta = STRENGTH_META[score];

            if (!password) return null;

            return (
                <div className="pt-2">
                    <div className="flex gap-1.5">
                        {[0, 1, 2, 3].map(i => (
                            <div key={i} className="h-1.5 flex-1 rounded-full bg-line/60 overflow-hidden">
                                {i < filled && <div className={`h-full grow-bar rounded-full ${meta.color}`}></div>}
                            </div>
                        ))}
                    </div>
                    <div className="flex items-center justify-between mt-1.5">
                        <span className={`text-[11.5px] font-semibold ${meta.text}`}>{meta.label}</span>
                        <span className="text-[11px] text-ink2/45">{password.length} char</span>
                    </div>
                </div>
            );
        }

        function SignUp() {
            const { ready: authReady, timedOut } = useAuthReady();

            const [firstName, setFirstName] = useState("");
            const [lastName, setLastName] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [confirm, setConfirm] = useState("");
            const [agree, setAgree] = useState(false);
            const [showPw, setShowPw] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [shake, setShake] = useState(false);
            const [fieldErr, setFieldErr] = useState({});

            const fail = (msg, field) => {
                setError(msg);
                setFieldErr(field ? { [field]: true } : {});
                setShake(true);
                setTimeout(() => setShake(false), 500);
                return false;
            };

            const validate = () => {
                if (!firstName.trim()) return fail("Ilagay ang iyong unang pangalan.", "firstName");
                if (!lastName.trim()) return fail("Ilagay ang iyong apelyido.", "lastName");
                if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Hindi valid ang email address.", "email");
                if (password.length < 6) return fail("Dapat 6 characters pataas ang password.", "password");
                if (password !== confirm) return fail("Hindi magkatugma ang password.", "confirm");
                if (!agree) return fail("Kailangan mong sumang-ayon sa Mga Tuntunin ng Serbisyo.", "agree");
                return true;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setFieldErr({});

                if (!validate()) return;

                setLoading(true);

                try {
                    const fullName = `${firstName.trim()} ${lastName.trim()}`;
                    await window.TipidAuth.signUp(fullName, email.trim(), password);

                    setLoading(false);

                    await swalSuccess({
                        title: "Tagumpay!",
                        text: "Nagawa na ang account mo. Mag-log in ka na para magsimulang mag-tipid.",
                        confirmButtonText: "Mag-log In",
                    });

                    window.location.href = "login.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            const handleGoogle = async () => {
                setError("");
                setLoading(true);

                try {
                    await window.TipidAuth.loginWithGoogle();

                    setLoading(false);

                    await swalSuccess({
                        title: "Tagumpay!",
                        text: "Naka-sign up ka na gamit ang Google. Papasok ka na sa dashboard.",
                        confirmButtonText: "Sige",
                    });

                    window.location.href = "dashboard.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            return (
                <div className="page-shell">
                    <div className={`auth-card fade-up ${shake ? "shake" : ""}`}>

                        <div className="flex items-center justify-between mb-7">
                            <a href="index.html" className="back-btn" aria-label="Bumalik">
                                <Icons.ArrowLeft size={17} />
                            </a>
                            <div className="flex items-center gap-2">
                                <Logo size={34} />
                                <span className="text-lg font-display font-semibold tracking-tight text-ink">Tipid</span>
                            </div>
                            <span className="w-[34px]"></span>
                        </div>

                        <h1 className="auth-title">Gumawa ng account</h1>
                        <p className="auth-subtitle">Libre, mabilis, at ready para sa everyday budget mo.</p>

                        {timedOut && !authReady && (
                            <div className="mt-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                <span>Hindi ma-connect sa auth system. Paki-refresh ang page o subukan ulit mamaya.</span>
                            </div>
                        )}

                        {error && (
                            <div className="mt-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                <span>{error}</span>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="mt-6 space-y-4">
                            <div className="grid grid-cols-2 gap-3">
                                <Field label="Unang pangalan" error={fieldErr.firstName}>
                                    <input
                                        type="text"
                                        value={firstName}
                                        onChange={e => setFirstName(e.target.value)}
                                        placeholder="Juan"
                                        autoComplete="given-name"
                                    />
                                </Field>

                                <Field label="Apelyido" error={fieldErr.lastName}>
                                    <input
                                        type="text"
                                        value={lastName}
                                        onChange={e => setLastName(e.target.value)}
                                        placeholder="Dela Cruz"
                                        autoComplete="family-name"
                                    />
                                </Field>
                            </div>

                            <Field label="Email" error={fieldErr.email}>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                    placeholder="juandelacruz@gmail.com"
                                    autoComplete="email"
                                />
                            </Field>

                            <div>
                                <Field label="Password" error={fieldErr.password}>
                                    <input
                                        type={showPw ? "text" : "password"}
                                        value={password}
                                        onChange={e => setPassword(e.target.value)}
                                        placeholder="6+ characters"
                                        autoComplete="new-password"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowPw(v => !v)}
                                        className="text-ink2/50 hover:text-ink2 shrink-0 transition-colors duration-200"
                                        aria-label="Ipakita ang password"
                                    >
                                        {showPw ? <Icons.EyeOff size={17} /> : <Icons.Eye size={17} />}
                                    </button>
                                </Field>
                                <PasswordStrength password={password} />
                            </div>

                            <Field label="Ulitin ang password" error={fieldErr.confirm}>
                                <input
                                    type={showPw ? "text" : "password"}
                                    value={confirm}
                                    onChange={e => setConfirm(e.target.value)}
                                    placeholder="Ulitin ang password"
                                    autoComplete="new-password"
                                />
                            </Field>

                            <label className="flex items-start gap-2.5 cursor-pointer select-none pt-1">
                                <input
                                    type="checkbox"
                                    checked={agree}
                                    onChange={e => setAgree(e.target.checked)}
                                    className="sr-only"
                                />
                                <span className={`agree-box mt-0.5 ${agree ? "checked" : ""} ${fieldErr.agree ? "error" : ""}`}>
                                    {agree && <Icons.Check size={12} strokeWidth={3} className="text-white" />}
                                </span>
                                <span className="text-[13px] text-ink2 leading-snug">
                                    Sumasang-ayon ako sa <span className="text-peso font-semibold">Mga Tuntunin ng Serbisyo</span>
                                </span>
                            </label>

                            <button
                                type="submit"
                                disabled={loading || !authReady}
                                className="submit-btn flex items-center justify-center gap-2 mt-1"
                            >
                                {loading && <Icons.Loader size={16} className="spin" />}
                                {loading ? "Ginagawa..." : "Gumawa ng Account"}
                            </button>
                        </form>

                        <div className="flex items-center gap-3 my-6">
                            <div className="h-px flex-1 bg-line/70"></div>
                            <span className="text-[12px] text-ink2/50">o mag-sign up gamit</span>
                            <div className="h-px flex-1 bg-line/70"></div>
                        </div>

                        <div className="flex items-center justify-center">
                            <button
                                onClick={handleGoogle}
                                disabled={loading || !authReady}
                                type="button"
                                className="oauth-circle"
                                aria-label="Mag-sign up gamit ang Google"
                            >
                                <GoogleIcon size={20} />
                            </button>
                        </div>

                        <p className="text-center text-sm text-ink2 mt-7">
                            May account ka na?
                            <a href="login.html" className="text-peso font-semibold hover:underline ml-1">
                                Mag-log in
                            </a>
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<SignUp />);
    </script>

</body>
</html>
