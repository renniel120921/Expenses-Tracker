<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hulugan Tracker — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ink: '#15231C', ink2: '#2F4037', paper: '#F1F4EF', paperDim: '#E2E8DE',
                        peso: '#1F6F54', pesoDeep: '#134735', pesoLight: '#2F8E6C',
                        gold: '#C9932E', expense: '#B5483B', line: '#D2DDD4',
                    },
                    fontFamily: { display: ['Fraunces', 'serif'], body: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    boxShadow: { 'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)', 'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)' }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/InstallmentTracker.js"></script>

    <style>
        :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --ease-ios: cubic-bezier(0.22, 1, 0.36, 1); --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); }
        html { background: #F1F4EF; transition: background-color 0.3s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; }
        body { font-family: 'Inter', sans-serif; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.6s var(--ease-ios) both; }
        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes haloPulse { 0% { transform: scale(0.9); opacity: 0.35; } 70% { opacity: 0; } 100% { transform: scale(1.6); opacity: 0; } }
        .halo-pulse { animation: haloPulse 1.9s var(--ease-ios) infinite; }
        @keyframes heroFloat { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -10px); } }
        .hero-float { animation: heroFloat 6s ease-in-out infinite; }
        .glass-panel { background: rgba(255,255,255,0.65); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(255,255,255,0.55); }
        html.dark .glass-panel { background: rgba(24,38,31,0.55); border: 1px solid rgba(255,255,255,0.08); }
        .tap-scale { transition: transform 0.15s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.92); }
        .tipid-swal { border-radius: 1.5rem !important; font-family: 'Inter', sans-serif !important; }
        @keyframes mascotHover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .mascot-img { animation: mascotHover 4s ease-in-out infinite; filter: drop-shadow(0 15px 25px rgba(18,61,46,0.35)); }
        .speech-bubble { animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both; box-shadow: 0 10px 25px -5px rgba(18, 61, 46, 0.25); }
        @media (prefers-reduced-motion: reduce) { .fade-up, .spin, .halo-pulse, .hero-float, .tap-scale, .mascot-img, .speech-bubble { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper min-h-screen flex flex-col transition-colors duration-300">

    <div id="root"></div>

    <script type="text/babel">
        // GLOBAL SETUP
        window.useState = React.useState; window.useEffect = React.useEffect; window.useMemo = React.useMemo;

        function Icon({ path, size = 20, className = "", strokeWidth = 2.2 }) {
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>;
        }

        // Include the FULL list of window.Icons here to avoid crashes
        window.Icons = {
            Sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
            Trash: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Check: (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12"/></>} strokeWidth={3} />,
            Pencil: (p) => <Icon {...p} path={<><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            Calendar: (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
            Info: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Shield: (p) => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />,
            TrendingDown: (p) => <Icon {...p} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />
        };

        window.Logo = function Logo({ size = 30 }) { return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>; }
        window.peso = (num) => { if (isNaN(num)) return "0.00"; return Number(num).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }
    </script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[360px] h-[360px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[380px] h-[380px] bg-gold/10 dark:bg-gold/5 rounded-full blur-[100px]" />
                </div>
            );
        }

        function InstallmentsHeroCard({ darkMode, toggleDarkMode }) {
            return (
                <div className="relative overflow-hidden rounded-[1.75rem] sm:rounded-[2rem] bg-gradient-to-br from-[#247E61] via-[#1A614A] to-[#0F382A] text-paper p-5 sm:p-7 shadow-iosLg ring-1 ring-white/15 min-h-[200px] sm:min-h-[230px] flex flex-col justify-between mb-6 sm:mb-8">
                    <div className="absolute -top-16 -right-10 w-56 h-56 bg-white/[0.08] rounded-full blur-[50px] hero-float" />
                    <div className="absolute -bottom-24 -left-10 w-60 h-60 bg-gold/[0.12] rounded-full blur-[60px]" />

                    <div className="absolute top-5 right-5 sm:top-6 sm:right-6 z-30">
                        <button onClick={toggleDarkMode} className="tap-scale w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/10 hover:bg-white/20 ring-1 ring-white/20 flex items-center justify-center text-white backdrop-blur-md transition-colors">
                            {darkMode ? <window.Icons.Sun size={17} /> : <window.Icons.Moon size={17} />}
                        </button>
                    </div>

                    <div className="absolute right-0 bottom-0 w-[140px] sm:w-[180px] h-full pointer-events-none z-0 overflow-visible hidden sm:block">
                        <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-24 h-24 bg-white/15 blur-2xl rounded-full"></div>
                        <img src="/assets/bills_mascot.png" alt="Tipid Buddy" onError={(e) => { e.target.onerror = null; e.target.src = "/assets/history_mascot.png"; }} className="absolute bottom-[-10px] right-0 w-full object-contain mascot-img" />
                        <div className="speech-bubble absolute top-[15%] right-[60%] sm:right-[70%] bg-paper text-ink rounded-2xl px-3 py-2 text-[10px] sm:text-xs font-semibold leading-tight w-max max-w-[120px] sm:max-w-[140px] border border-white/50">
                            Lapit na matapos!<br/>Laban lang. 💪
                            <div className="absolute -bottom-1.5 right-6 w-3 h-3 bg-paper rotate-45 border-r border-b border-white/50"></div>
                        </div>
                    </div>

                    <div className="relative z-10 flex flex-col h-full gap-5 sm:gap-6 max-w-[70%] sm:max-w-[60%]">
                        <div className="mt-2 sm:mt-4">
                            <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/15 border border-white/10 text-white mb-3 backdrop-blur-sm">
                                <span className="w-1.5 h-1.5 rounded-full bg-gold animate-pulse" />
                                <span className="text-[9px] font-bold uppercase tracking-[0.1em] text-paper/90">Installment Manager</span>
                            </div>
                            <h1 className="font-display text-[1.6rem] sm:text-[2.25rem] font-bold tracking-tight leading-[1.1] mb-2 sm:mb-3">
                                Hulugan Tracker
                            </h1>
                            <p className="text-[11px] sm:text-[13px] font-medium text-white/80 leading-relaxed pr-2">
                                I-monitor ang iyong SPayLater, Home Credit, o motor para makita mong umuusad ang bayad mo.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function TipsSection() {
            return (
                <div className="mt-8 sm:mt-10 fade-up" style={{ animationDelay: "150ms" }}>
                    <div className="flex items-center gap-2.5 mb-4 px-1">
                        <window.Icons.Info size={20} className="text-peso dark:text-pesoLight" />
                        <h3 className="font-display text-[1.15rem] font-semibold text-ink dark:text-paper tracking-tight">Tipid Hacks: Hulugan Edition</h3>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="bg-white/60 dark:bg-ink2/30 backdrop-blur-xl p-5 rounded-[1.25rem] border border-white/60 dark:border-white/5 shadow-sm">
                            <div className="w-10 h-10 rounded-full bg-[#FAEDE9] dark:bg-[#B5483B]/20 text-[#B5483B] dark:text-[#F38C80] flex items-center justify-center mb-3">
                                <window.Icons.TrendingDown size={18} />
                            </div>
                            <h4 className="font-semibold text-[13px] text-ink dark:text-paper mb-1.5">Iwasan ang Late Penalty</h4>
                            <p className="text-[11.5px] text-ink2/70 dark:text-paper/60 leading-relaxed">Ang late fee ng SPayLater o Credit Card ay mabilis lumaki at may compounded interest. Bayaran nang maaga para makatipid!</p>
                        </div>

                        <div className="bg-white/60 dark:bg-ink2/30 backdrop-blur-xl p-5 rounded-[1.25rem] border border-white/60 dark:border-white/5 shadow-sm">
                            <div className="w-10 h-10 rounded-full bg-[#E6F3EF] dark:bg-[#1F6F54]/20 text-[#1F6F54] dark:text-[#52C8A1] flex items-center justify-center mb-3">
                                <window.Icons.Shield size={18} />
                            </div>
                            <h4 className="font-semibold text-[13px] text-ink dark:text-paper mb-1.5">Wag Pagsabay-sabayin</h4>
                            <p className="text-[11.5px] text-ink2/70 dark:text-paper/60 leading-relaxed">Limitahan lang ang iyong hulugan sa isa o dalawang items sa isang pagkakataon para hindi mabutas ang monthly budget mo.</p>
                        </div>
                    </div>
                </div>
            );
        }

        function InstallmentsPage() {
            const authReady = window.useAuthReady();
            const [user, setUser] = React.useState(null);
            const [authChecking, setAuthChecking] = React.useState(true);
            const [componentsReady, setComponentsReady] = React.useState(false);

            const [darkMode, setDarkMode] = React.useState(() => {
                return localStorage.getItem("tipid_theme") === "dark" ||
                    (!localStorage.getItem("tipid_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
            });

            React.useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem("tipid_theme", "dark");
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem("tipid_theme", "light");
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    if (window.InstallmentTracker && window.Navbar) {
                        setComponentsReady(true);
                        clearInterval(interval);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                let unsub = null;
                let isMounted = true;
                const checkAuth = () => {
                    if (window.TipidAuth) {
                        unsub = window.TipidAuth.onChange((currentUser) => {
                            if (!isMounted) return;
                            if (!currentUser) window.location.href = "./login.html";
                            else { setUser(currentUser); setAuthChecking(false); }
                        });
                    } else setTimeout(checkAuth, 50);
                };
                checkAuth();
                return () => { isMounted = false; if (typeof unsub === "function") unsub(); };
            }, []);

            const handleLogout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "./login.html";
            };

            if (authChecking || !componentsReady) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-5 rounded-[32px] px-10 py-10 shadow-ios">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/25 halo-pulse" />
                                <window.Logo size={44} />
                            </div>
                            <p className="text-[11px] font-mono font-semibold tracking-widest uppercase text-ink2 dark:text-paper/60 text-center">Loading Tracker</p>
                        </div>
                    </div>
                );
            }

            const AppInstallments = window.InstallmentTracker;
            const AppNavbar = window.Navbar;

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />
                    <AppNavbar user={user} onLogout={handleLogout} activeTab="installments" />

                    <main className="max-w-[700px] mx-auto w-full px-5 sm:px-8 pt-[6.5rem] md:pt-10 pb-36 md:pb-20 flex-1"
                        style={{ paddingLeft: 'max(1.25rem, calc(var(--sal) + 1.25rem))', paddingRight: 'max(1.25rem, calc(var(--sar) + 1.25rem))', paddingBottom: 'calc(8rem + var(--sab))' }}>
                        <div className="fade-up">
                            <InstallmentsHeroCard darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
                        </div>
                        <AppInstallments uid={user.uid} />
                        <TipsSection />
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            if (typeof window.Navbar === "function" && typeof window.InstallmentTracker === "function") {
                ReactDOM.createRoot(document.getElementById("root")).render(<InstallmentsPage />);
                return;
            }
            if (attempt > 100) return;
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>
</body>
</html>
