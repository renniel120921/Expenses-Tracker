<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profile — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)',
                        'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html { background: #F1F4EF; transition: background-color 0.3s var(--ease-ios); }
        html.dark { background: #111A15; color: #F1F4EF; }

        body { font-feature-settings: "tnum" 1, "lnum" 1; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.85s linear infinite; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.7s var(--ease-ios) both; }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.08); opacity: 0.85; }
        }
        .logo-breathe { animation: logoBreathe 1.7s ease-in-out infinite; }

        @keyframes haloPulse {
            0%   { transform: scale(0.9); opacity: 0.35; }
            70%  { opacity: 0; }
            100% { transform: scale(1.7); opacity: 0; }
        }
        .halo-pulse { animation: haloPulse 2s var(--ease-ios) infinite; }

        @keyframes heroFloat {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(0, -10px); }
        }
        .hero-float { animation: heroFloat 6s ease-in-out infinite; }

        .tap-scale { transition: transform 0.15s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.94); }

        .ios-toggle-knob { transition: transform 0.35s var(--ease-spring); }

        .swal2-popup.tipid-swal { border-radius: 24px !important; font-family: 'Inter', sans-serif !important; }

        @media (prefers-reduced-motion: reduce) {
            .spin, .fade-up, .logo-breathe, .halo-pulse, .hero-float, .tap-scale {
                animation: none !important; transition: none !important;
            }
        }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper antialiased font-body min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;

        function Icon({ path, size = 20, className = "", strokeWidth = 2.2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }

        window.Icons = {
            Sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
            User: (p) => <Icon {...p} path={<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />,
            Target: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            Star: (p) => <Icon {...p} path={<><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></>} />,
            Check: (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12"/></>} />,
            Home: (p) => <Icon {...p} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />,
            Chart: (p) => <Icon {...p} path={<><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></>} />,
            List: (p) => <Icon {...p} path={<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>} />,
            LogOut: (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />,
            Camera: (p) => <Icon {...p} path={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>} />,
            X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            Info: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>} />
        };

        window.Logo = function Logo({ size = 30 }) {
            const [broken, setBroken] = React.useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return <span style={{ width: size, height: size }} className="rounded-md bg-ink text-paper flex items-center justify-center font-display font-semibold">₱</span>;
        }

        window.useAuthReady = function() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }

        window.useDataReady = function() {
            const [ready, setReady] = React.useState(!!window.TipidData);
            React.useEffect(() => {
                if (window.TipidData) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-data-ready", h, { once: true });
                return () => window.removeEventListener("tipid-data-ready", h);
            }, []);
            return ready;
        }

        function swalSuccess(title, text) { return Swal.fire({ icon: "success", title, text, confirmButtonText: "Sige", confirmButtonColor: "#1F6F54", customClass: { popup: "tipid-swal" }}); }
        function swalError(text) { return Swal.fire({ icon: "error", title: "Error", text, confirmButtonText: "Sige", confirmButtonColor: "#B5483B", customClass: { popup: "tipid-swal" }}); }
    </script>

    <script type="text/babel" src="./components/navbar.js"></script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10">
                    <div className="absolute -top-24 -right-16 w-[360px] h-[360px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[90px]" />
                    <div className="absolute bottom-0 -left-24 w-[380px] h-[380px] bg-gold/10 dark:bg-gold/5 rounded-full blur-[100px]" />
                </div>
            );
        }

        function SectionHeader({ title, subtitle }) {
            return (
                <div className="mb-4 ml-1">
                    <h2 className="font-display text-[1.35rem] sm:text-[1.5rem] font-semibold text-ink dark:text-paper tracking-tight leading-tight">
                        {title}
                    </h2>
                    {subtitle && (
                        <p className="text-[12.5px] text-ink2/60 dark:text-paper/50 mt-1.5 leading-relaxed pr-4">{subtitle}</p>
                    )}
                </div>
            );
        }

        // A single row inside a SettingsGroup — label above, bare (unboxed) input below.
        // This is the core "feels like an app, not a webpage" change: instead of every
        // field living in its own bordered box (a web-form pattern), rows sit flush
        // inside one continuous grouped card with hairline dividers between them —
        // the same pattern iOS/Android Settings screens use.
        function SettingsRow({ label, children }) {
            return (
                <div className="px-5 sm:px-6 py-4">
                    <label className="block text-[10.5px] font-mono font-semibold uppercase tracking-widest text-ink2/50 dark:text-paper/40 mb-1.5">{label}</label>
                    {children}
                </div>
            );
        }

        // A grouped card: quiet header outside, hairline-divided rows inside.
        // No gradient accent bar on top — that read as a decorative "landing page
        // card" rather than part of an app chrome.
        function SettingsGroup({ title, subtitle, children }) {
            return (
                <div>
                    <SectionHeader title={title} subtitle={subtitle} />
                    <div className="bg-white/60 dark:bg-ink2/30 backdrop-blur-2xl rounded-[1.5rem] border border-black/5 dark:border-white/10 shadow-ios overflow-hidden divide-y divide-black/5 dark:divide-white/10">
                        {children}
                    </div>
                </div>
            );
        }

        // Slim, right-aligned save affordance instead of a full-width shouty CTA —
        // disabled until something actually changed, with an inline spinner while saving.
        function GroupSaveRow({ label, savingLabel, saving, disabled, tone = "peso" }) {
            const toneClasses = tone === "gold"
                ? "bg-gold text-[#111A15] hover:shadow-md hover:shadow-gold/25"
                : "bg-peso text-white hover:shadow-md hover:shadow-peso/25";
            return (
                <div className="px-5 sm:px-6 py-3.5 flex justify-end bg-black/[0.015] dark:bg-white/[0.02]">
                    <button
                        type="submit"
                        disabled={disabled || saving}
                        className={`tap-scale inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-[13.5px] font-semibold transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-peso/40 disabled:opacity-35 disabled:cursor-not-allowed disabled:shadow-none ${toneClasses}`}
                    >
                        {saving && <span className="w-3.5 h-3.5 border-2 border-white/40 border-t-white rounded-full spin" />}
                        {saving ? savingLabel : label}
                    </button>
                </div>
            );
        }

        function ProfileHeroCard({ user, displayName, email, initial, onPhotoSelected, onRemovePhoto, uploadingPhoto }) {
            const firstName = displayName ? displayName.trim().split(/\s+/)[0] : "";
            const fileInputRef = React.useRef(null);

            return (
                <div className="relative overflow-hidden rounded-[1.75rem] sm:rounded-[2rem] bg-gradient-to-br from-[#247E61] via-[#1A614A] to-[#0F382A] text-paper p-6 sm:p-8 shadow-iosLg ring-1 ring-white/15 mb-8 flex flex-col sm:flex-row items-center sm:items-start gap-5 sm:gap-6">
                    <div className="absolute -top-16 -right-10 w-56 h-56 bg-white/10 rounded-full blur-[50px] pointer-events-none" />
                    <div className="absolute -bottom-24 -left-10 w-60 h-60 bg-gold/15 rounded-full blur-[60px] pointer-events-none" />

                    <div className="relative z-10 shrink-0">
                        <input
                            ref={fileInputRef}
                            type="file"
                            accept="image/*"
                            className="hidden"
                            onChange={(e) => {
                                const file = e.target.files && e.target.files[0];
                                if (file) onPhotoSelected(file);
                                e.target.value = "";
                            }}
                        />

                        <div className="relative w-24 h-24 sm:w-28 sm:h-28">
                            <div className="w-full h-full rounded-full bg-white/10 border-4 border-white/20 flex items-center justify-center overflow-hidden shadow-inner backdrop-blur-md">
                                {user.photoURL
                                    ? <img src={user.photoURL} alt={displayName || "Profile photo"} className="w-full h-full object-cover" />
                                    : <span className="text-4xl sm:text-5xl font-display font-bold">{initial}</span>}
                            </div>

                            {uploadingPhoto && (
                                <div className="absolute inset-0 rounded-full bg-black/50 flex items-center justify-center">
                                    <span className="w-6 h-6 border-2 border-white/40 border-t-white rounded-full spin" />
                                </div>
                            )}

                            <button
                                type="button"
                                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                disabled={uploadingPhoto}
                                aria-label="Palitan ang profile photo"
                                className="tap-scale absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-gold text-[#111A15] flex items-center justify-center shadow-md ring-2 ring-[#1A614A] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white disabled:opacity-50"
                            >
                                <window.Icons.Camera size={14} strokeWidth={2.4} />
                            </button>

                            {user.photoURL && !uploadingPhoto && (
                                <button
                                    type="button"
                                    onClick={onRemovePhoto}
                                    aria-label="Alisin ang profile photo"
                                    className="tap-scale absolute -top-1 -right-1 w-6 h-6 rounded-full bg-expense text-white flex items-center justify-center shadow-md ring-2 ring-[#1A614A] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
                                >
                                    <window.Icons.X size={12} strokeWidth={2.6} />
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="relative z-10 text-center sm:text-left flex-1 mt-2 sm:mt-4">
                        <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/15 border border-white/10 text-white mb-3 backdrop-blur-sm">
                            <span className="w-1.5 h-1.5 rounded-full bg-[#52C8A1] animate-pulse" />
                            <span className="text-[9px] font-bold uppercase tracking-widest text-paper/90">Tipid Buddy User</span>
                        </div>
                        <h1 className="font-display text-[1.75rem] sm:text-4xl font-bold text-white tracking-tight leading-tight mb-1">
                            {firstName ? `Kumusta, ${firstName}!` : "Kumusta!"}
                        </h1>
                        <p className="text-[13px] sm:text-sm font-medium text-white/70">{email}</p>
                    </div>
                </div>
            );
        }

        // Loads the Firebase modules needed for auth + storage writes on demand
        // (dynamic import, so it works fine from this non-module script and reuses
        // the browser's module cache — no re-initialization of the app).
        // Also hands back auth.currentUser, the *live* Firebase user object. This
        // matters because after any updateProfile() call, this page's own `user`
        // React state gets replaced with a plain spread copy for rendering — which
        // is NOT a real Firebase User and can't be passed to updateProfile() again.
        // Reading auth.currentUser instead sidesteps that entirely.
        async function getFirebaseHandles() {
            const [{ app }, authMod, storageMod] = await Promise.all([
                import("./firebase.js"),
                import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js"),
                import("https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js"),
            ]);
            const auth = authMod.getAuth(app);
            return { app, auth, authMod, storageMod };
        }

        const MAX_PHOTO_BYTES = 5 * 1024 * 1024;

        function ProfileApp() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();

            const [user, setUser] = React.useState(undefined);
            const [displayName, setDisplayName] = React.useState("");
            const [savedDisplayName, setSavedDisplayName] = React.useState("");
            const [savingProfile, setSavingProfile] = React.useState(false);
            const [uploadingPhoto, setUploadingPhoto] = React.useState(false);

            const [budgetInput, setBudgetInput] = React.useState("");
            const [goalName, setGoalName] = React.useState("");
            const [goalAmount, setGoalAmount] = React.useState("");
            const [savedBudget, setSavedBudget] = React.useState("");
            const [savedGoalName, setSavedGoalName] = React.useState("");
            const [savedGoalAmount, setSavedGoalAmount] = React.useState("");
            const [savingGoals, setSavingGoals] = React.useState(false);

            const [isDark, setIsDark] = React.useState(() => document.documentElement.classList.contains('dark'));

            const toggleDarkMode = () => {
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('tipid_theme', 'light');
                    setIsDark(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('tipid_theme', 'dark');
                    setIsDark(true);
                }
            };

            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => {
                    setUser(u || null);
                    if (u) {
                        setDisplayName(u.displayName || "");
                        setSavedDisplayName(u.displayName || "");
                    }
                });
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
            }, [user]);

            React.useEffect(() => {
                if (!dataReady || !user) return;
                return window.TipidData.subscribeBudget(
                    user.uid,
                    (b) => {
                        const val = b ? b.toString() : "";
                        setBudgetInput(val);
                        setSavedBudget(val);
                    },
                    (err) => console.error(err)
                );
            }, [dataReady, user]);

            React.useEffect(() => {
                const savedGoalName = localStorage.getItem('tipid_goal_name');
                const savedGoalAmount = localStorage.getItem('tipid_goal_amount') || localStorage.getItem('tipid_goal');

                if (savedGoalName) { setGoalName(savedGoalName); setSavedGoalName(savedGoalName); }
                if (savedGoalAmount) { setGoalAmount(savedGoalAmount); setSavedGoalAmount(savedGoalAmount); }
            }, []);

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="glass-panel flex flex-col items-center gap-5 rounded-[32px] px-10 py-10 shadow-ios">
                            <div className="relative flex items-center justify-center">
                                <span className="absolute inline-flex h-16 w-16 rounded-full bg-peso/25 halo-pulse" />
                                <div className="relative logo-breathe">
                                    <window.Logo size={44} />
                                </div>
                            </div>
                            <p className="text-[11px] font-mono font-semibold tracking-widest uppercase text-ink2 dark:text-paper/60 text-center">
                                Loading Profile
                            </p>
                        </div>
                    </div>
                );
            }

            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                if (!displayName.trim()) return swalError("Paki-lagay ang iyong pangalan.");
                setSavingProfile(true);
                try {
                    const { auth, authMod } = await getFirebaseHandles();
                    const liveUser = auth.currentUser || user;
                    await authMod.updateProfile(liveUser, { displayName: displayName.trim() });
                    setUser({ ...user, displayName: displayName.trim() });
                    setSavedDisplayName(displayName.trim());
                    swalSuccess("Tagumpay", "Na-update na ang iyong pangalan.");
                } catch (err) {
                    console.error(err);
                    swalError("Hindi ma-update ang profile. Subukan ulit.");
                } finally {
                    setSavingProfile(false);
                }
            };

            const handleUpdatePreferences = async (e) => {
                e.preventDefault();
                const amt = parseFloat(budgetInput);
                const targetAmt = parseFloat(goalAmount);

                if (isNaN(amt) || amt <= 0) return swalError("Maglagay ng tamang halaga para sa budget.");

                setSavingGoals(true);
                try {
                    await window.TipidData.setBudget(user.uid, amt);
                    setSavedBudget(budgetInput);

                    if (goalName.trim()) {
                        localStorage.setItem('tipid_goal_name', goalName.trim());
                        setSavedGoalName(goalName.trim());
                    }
                    if (!isNaN(targetAmt) && targetAmt > 0) {
                        localStorage.setItem('tipid_goal_amount', targetAmt.toString());
                        localStorage.setItem('tipid_goal', targetAmt.toString());
                        setSavedGoalAmount(targetAmt.toString());
                    }

                    swalSuccess("Tagumpay", "Na-update na ang iyong Financial Goals at Budget.");
                } catch (err) {
                    console.error(err);
                    swalError("Hindi ma-save. Subukan ulit.");
                } finally {
                    setSavingGoals(false);
                }
            };

            // Validates the file, shows an instant local preview, then uploads to
            // Firebase Storage at avatars/{uid} and points the auth profile's
            // photoURL at the result. Requires Firebase Storage to be enabled on
            // the project, with rules that let a user write to their own
            // avatars/{uid} path.
            const handlePhotoSelected = async (file) => {
                if (!file.type || !file.type.startsWith("image/")) {
                    return swalError("Pumili ng image file lang (JPG, PNG, atbp.).");
                }
                if (file.size > MAX_PHOTO_BYTES) {
                    return swalError("Masyadong malaki ang file. 5MB pababa lang ang pwede.");
                }

                const previousPhotoURL = user.photoURL || null;
                const previewUrl = URL.createObjectURL(file);
                setUser((u) => ({ ...u, photoURL: previewUrl }));
                setUploadingPhoto(true);

                try {
                    const { app, auth, authMod, storageMod } = await getFirebaseHandles();
                    const liveUser = auth.currentUser || user;
                    const storage = storageMod.getStorage(app);
                    const fileRef = storageMod.ref(storage, `avatars/${liveUser.uid}`);

                    await storageMod.uploadBytes(fileRef, file, { contentType: file.type });
                    const url = await storageMod.getDownloadURL(fileRef);
                    await authMod.updateProfile(liveUser, { photoURL: url });

                    setUser((u) => ({ ...u, photoURL: url }));
                    swalSuccess("Tagumpay", "Na-update na ang iyong profile photo.");
                } catch (err) {
                    console.error(err);
                    setUser((u) => ({ ...u, photoURL: previousPhotoURL }));
                    swalError("Hindi ma-upload ang larawan. Siguraduhing naka-enable ang Firebase Storage sa iyong project, at subukan ulit.");
                } finally {
                    URL.revokeObjectURL(previewUrl);
                    setUploadingPhoto(false);
                }
            };

            const handleRemovePhoto = async () => {
                const result = await Swal.fire({
                    icon: "warning",
                    title: "Alisin ang photo?",
                    text: "Babalik sa unang letra ng iyong pangalan ang icon mo.",
                    showCancelButton: true,
                    confirmButtonText: "Oo, alisin",
                    cancelButtonText: "Kanselahin",
                    confirmButtonColor: "#B5483B",
                    customClass: { popup: "tipid-swal" },
                });
                if (!result.isConfirmed) return;

                const previousPhotoURL = user.photoURL || null;
                setUser((u) => ({ ...u, photoURL: null }));

                try {
                    const { app, auth, authMod, storageMod } = await getFirebaseHandles();
                    const liveUser = auth.currentUser || user;
                    const storage = storageMod.getStorage(app);
                    const fileRef = storageMod.ref(storage, `avatars/${liveUser.uid}`);

                    await storageMod.deleteObject(fileRef).catch(() => {
                        // Fine if there was never a stored file (e.g. the URL came
                        // from Google sign-in rather than our own upload) — the
                        // photoURL update below is what actually matters.
                    });
                    await authMod.updateProfile(liveUser, { photoURL: null });
                    swalSuccess("Tagumpay", "Naalis na ang profile photo.");
                } catch (err) {
                    console.error(err);
                    setUser((u) => ({ ...u, photoURL: previousPhotoURL }));
                    swalError("Hindi maalis ang larawan. Subukan ulit.");
                }
            };

            const handleLogout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "login.html";
            };

            const initial = displayName ? displayName.charAt(0).toUpperCase() : (user.email.charAt(0).toUpperCase());

            return (
                <div className="min-h-dvh relative flex flex-col">
                    <AmbientBackground />
                    <window.Navbar user={user} onLogout={handleLogout} activeTab="account" />

                    <main
                        className="max-w-[700px] w-full mx-auto px-5 sm:px-8 pt-[6.5rem] md:pt-10 pb-[12rem] space-y-8 flex-1"
                        style={{
                            paddingLeft: 'max(1.25rem, calc(var(--sal) + 1.25rem))',
                            paddingRight: 'max(1.25rem, calc(var(--sar) + 1.25rem))',
                            paddingBottom: 'calc(12rem + var(--sab))',
                        }}
                    >
                        <div className="fade-up" style={{ animationDelay: '0ms' }}>
                            <ProfileHeroCard
                                user={user}
                                displayName={displayName}
                                email={user.email}
                                initial={initial}
                                onPhotoSelected={handlePhotoSelected}
                                onRemovePhoto={handleRemovePhoto}
                                uploadingPhoto={uploadingPhoto}
                            />
                        </div>

                        <div className="fade-up" style={{ animationDelay: '60ms' }}>
                            <form onSubmit={handleUpdateProfile}>
                                <SettingsGroup title="Personal Information">
                                    <SettingsRow label="Display Name">
                                        <div className="flex items-center gap-2.5">
                                            <window.Icons.User size={16} className="text-ink2/35 dark:text-paper/35 shrink-0" />
                                            <input
                                                type="text"
                                                value={displayName}
                                                onChange={e => setDisplayName(e.target.value)}
                                                placeholder="Ang iyong pangalan"
                                                className="w-full bg-transparent py-1 text-[15px] focus:outline-none font-medium text-ink dark:text-paper placeholder-ink2/30 dark:placeholder-paper/30"
                                            />
                                        </div>
                                    </SettingsRow>
                                    <GroupSaveRow
                                        label="I-save"
                                        savingLabel="Sinesave…"
                                        saving={savingProfile}
                                        disabled={!displayName.trim() || displayName.trim() === (savedDisplayName || "").trim()}
                                    />
                                </SettingsGroup>
                            </form>
                        </div>

                        <div className="fade-up" style={{ animationDelay: '120ms' }}>
                            <form onSubmit={handleUpdatePreferences}>
                                <SettingsGroup
                                    title="Financial Goals"
                                    subtitle="Bigyan ng pangalan ang pinag-iipunan mo para mas ganahan kang magtipid araw-araw."
                                >
                                    <SettingsRow label="Buwanang Budget Limit (₱)">
                                        <div className="flex items-center gap-2.5">
                                            <window.Icons.Wallet size={16} className="text-ink2/35 dark:text-paper/35 shrink-0" />
                                            <input
                                                type="number"
                                                step="0.01"
                                                value={budgetInput}
                                                onChange={e => setBudgetInput(e.target.value)}
                                                placeholder="e.g. 10000"
                                                className="w-full bg-transparent py-1 text-[15px] font-mono focus:outline-none font-bold text-ink dark:text-paper placeholder-ink2/30 dark:placeholder-paper/30"
                                            />
                                        </div>
                                    </SettingsRow>
                                    <SettingsRow label="Ano ang pinag-iipunan mo?">
                                        <div className="flex items-center gap-2.5">
                                            <window.Icons.Star size={16} className="text-ink2/35 dark:text-paper/35 shrink-0" />
                                            <input
                                                type="text"
                                                value={goalName}
                                                onChange={e => setGoalName(e.target.value)}
                                                placeholder="Hal: Emergency Fund, Pambili ng Motor"
                                                className="w-full bg-transparent py-1 text-[15px] focus:outline-none font-medium text-ink dark:text-paper placeholder-ink2/30 dark:placeholder-paper/30"
                                            />
                                        </div>
                                    </SettingsRow>
                                    <SettingsRow label="Target Amount (₱)">
                                        <div className="flex items-center gap-2.5">
                                            <window.Icons.Target size={16} className="text-ink2/35 dark:text-paper/35 shrink-0" />
                                            <input
                                                type="number"
                                                step="0.01"
                                                value={goalAmount}
                                                onChange={e => setGoalAmount(e.target.value)}
                                                placeholder="e.g. 50000"
                                                className="w-full bg-transparent py-1 text-[15px] font-mono focus:outline-none font-bold text-ink dark:text-paper placeholder-ink2/30 dark:placeholder-paper/30"
                                            />
                                        </div>
                                    </SettingsRow>
                                    <GroupSaveRow
                                        label="I-save"
                                        savingLabel="Sinesave…"
                                        saving={savingGoals}
                                        tone="gold"
                                        disabled={
                                            budgetInput === savedBudget &&
                                            goalName === savedGoalName &&
                                            goalAmount === savedGoalAmount
                                        }
                                    />
                                </SettingsGroup>
                            </form>

                            <div className="flex items-start gap-2.5 mt-3 px-2 text-[12px] text-ink2/55 dark:text-paper/45 leading-relaxed">
                                <window.Icons.Info size={14} className="shrink-0 mt-[2px] opacity-70" />
                                <span>Mas madaling iwasan ang tuksong gumastos kapag malinaw kung para saan ka nagtitipid — makikita mo agad kung gaano na kalapit ang target mo.</span>
                            </div>
                        </div>

                        <div className="fade-up mb-10" style={{ animationDelay: '180ms' }}>
                            <SettingsGroup title="Appearance">
                                <div className="px-5 sm:px-6 py-4 flex items-center justify-between">
                                    <div className="flex items-center gap-3.5">
                                        <div className="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-ink dark:text-paper shrink-0">
                                            {isDark ? <window.Icons.Moon size={18} /> : <window.Icons.Sun size={18} />}
                                        </div>
                                        <span className="text-[15px] font-semibold text-ink dark:text-paper">Dark Mode</span>
                                    </div>

                                    <button
                                        onClick={toggleDarkMode}
                                        aria-label="Toggle Dark Mode"
                                        className={`tap-scale w-[52px] h-[30px] rounded-full transition-colors duration-300 relative flex items-center shadow-inner border focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-peso/50 ${
                                            isDark ? 'bg-[#1F6F54] border-[#1F6F54]' : 'bg-black/10 border-black/5'
                                        }`}
                                    >
                                        <div className={`w-[24px] h-[24px] bg-white rounded-full absolute shadow-sm transition-transform duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)] ${
                                            isDark ? 'translate-x-[25px]' : 'translate-x-[2px]'
                                        }`}></div>
                                    </button>
                                </div>
                            </SettingsGroup>
                        </div>

                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");

            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<ProfileApp />);
                return;
            }
            if (attempt > 100) {
                document.getElementById("root").innerHTML =
                    `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Inter,sans-serif;text-align:center;color:#15231C;">
                        <div>
                            <p style="font-weight:600;margin-bottom:0.5rem;">Failed to load: ${missingNames.join(", ")}</p>
                            <p style="font-size:0.875rem;opacity:0.7;">Check the file path (Network tab) and ensure component exports match.</p>
                        </div>
                    </div>`;
                return;
            }
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>

    <!-- PWA Service Worker Registration & Auto-Update Alert -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                Swal.fire({
                                    title: "May Bagong Update! 🎉",
                                    text: "May in-add kaming bagong features sa Tipid App. I-refresh ang app para magamit ito.",
                                    icon: "info",
                                    confirmButtonText: "I-update Ngayon",
                                    confirmButtonColor: "#1F6F54",
                                    allowOutsideClick: false,
                                    customClass: { popup: "tipid-swal" }
                                }).then(() => {
                                    window.location.reload();
                                });
                            }
                        });
                    });
                }).catch(err => console.error("Service Worker registration failed:", err));
            });
        }
    </script>
</body>
</html>
