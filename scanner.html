<!DOCTYPE html>
<html lang="fil" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/app.css">
    <link rel="manifest" href="/manifest.json">
    <script src="/app-utils.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Receipt Scanner — Tipid</title>
    <meta name="theme-color" content="#1F6F54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">

    <script>
        if (localStorage.getItem('tipid_theme') === 'dark' || (!('tipid_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E2E8DE', ink: '#0B130E', ink2: '#1D2B23',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#134735',
                        gold: '#C9932E', expense: '#B5483B', line: '#D2DDD4',
                    },
                    fontFamily: { display: ['Fraunces', 'serif'], body: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    boxShadow: {
                        'ios': '0 2px 10px rgba(18,61,46,0.06), 0 16px 32px -12px rgba(18,61,46,0.15)',
                        'iosLg': '0 24px 48px -12px rgba(18,61,46,0.25)',
                        'bento': '0 4px 24px -4px rgba(18, 61, 46, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6)',
                        'bentoDark': '0 8px 32px -8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>
    <script type="module" src="./firebase-data.js"></script>

    <script type="text/babel" src="./components/navbar.js"></script>
    <script type="text/babel" src="./components/ReceiptScanner.js"></script>

    <style>
        :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --ease-ios: cubic-bezier(0.22, 1, 0.36, 1); --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); }
        html { background: #F1F4EF; transition: background-color 0.4s var(--ease-ios); }
        html.dark { background: #0B130E; color: #F1F4EF; }
        body { font-family: 'Inter', sans-serif; min-height: 100dvh; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeIn 0.7s var(--ease-spring) both; }

        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes haloPulse { 0% { transform: scale(0.8); opacity: 0.3; } 70% { opacity: 0; } 100% { transform: scale(1.6); opacity: 0; } }
        .halo-pulse { animation: haloPulse 2s var(--ease-ios) infinite; }

        .bento-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(32px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: var(--tw-shadow-bento); transition: all 0.4s var(--ease-ios); }
        html.dark .bento-card { background: rgba(20, 30, 24, 0.55); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: var(--tw-shadow-bentoDark); }

        .hero-panel { position: relative; isolation: isolate; overflow: hidden; }
        .hero-panel::before { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 0 0 0 1px rgba(255,255,255,0.1); pointer-events: none; }

        .tap-scale { transition: transform 0.15s var(--ease-spring); }
        .tap-scale:active { transform: scale(0.94); }

        .tipid-swal { border-radius: 1.5rem !important; font-family: 'Inter', sans-serif !important; }

        @media (prefers-reduced-motion: reduce) { .fade-up, .spin, .halo-pulse, .tap-scale { animation: none !important; transition: none !important; } }
    </style>
</head>
<body class="bg-paper dark:bg-ink text-ink dark:text-paper min-h-screen flex flex-col transition-colors duration-400">

    <div id="root"></div>

    <script type="text/babel">
        window.useState = React.useState; window.useEffect = React.useEffect; window.useMemo = React.useMemo;

        function Icon({ path, size = 20, className = "", strokeWidth = 2.2 }) {
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>;
        }

        window.Icons = {
            Sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />,
            Moon: (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            Check: (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12"/></>} strokeWidth={3} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2a10 10 0 0 1 10 10"/></>} />,
            Scan: (p) => <Icon {...p} path={<><path d="M3 7V5a2 2 0 0 1 2-2h2" stroke="currentColor" strokeWidth="2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" stroke="currentColor" strokeWidth="2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" stroke="currentColor" strokeWidth="2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" stroke="currentColor" strokeWidth="2" /><rect x="7" y="7" width="10" height="10" rx="1" fill="currentColor" opacity="0.3" /><line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" strokeWidth="1.5" /></>} />,
            X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            Category: (p) => <Icon {...p} path={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
            Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
            Camera: (p) => <Icon {...p} path={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>} />,
            Image: (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>} />
        };

        window.Logo = function Logo({ size = 30 }) { return <span style={{ width: size, height: size }} className="rounded-[10px] bg-peso text-paper flex items-center justify-center font-display font-semibold shadow-sm">₱</span>; }
        window.peso = (num) => { if (isNaN(num)) return "0.00"; return Number(num).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

        window.CATEGORIES = ["Pagkain", "Pamasahe", "Bills", "Load", "Ipon", "Project Components", "Iba pa"];

        window.useAuthReady = function useAuthReady() {
            const [ready, setReady] = React.useState(!!window.TipidAuth);
            React.useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                return () => window.removeEventListener("tipid-auth-ready", h);
            }, []);
            return ready;
        }
    </script>

    <script type="text/babel">
        function AmbientBackground() {
            return (
                <div className="pointer-events-none fixed inset-0 overflow-hidden -z-10" aria-hidden="true">
                    <div className="absolute inset-0 opacity-[0.25] dark:opacity-[0.12]" style={{ backgroundImage: "radial-gradient(rgba(31,111,84,0.15) 1px, transparent 1px)", backgroundSize: "28px 28px", maskImage: "radial-gradient(ellipse at 50% 0%, black, transparent 80%)" }} />
                    <div className="absolute -top-32 -left-20 w-[450px] h-[450px] bg-peso/10 dark:bg-pesoLight/10 rounded-full blur-[100px]" />
                </div>
            );
        }

        function ScannerHeroCard({ darkMode, toggleDarkMode }) {
            return (
                <section className="hero-panel relative overflow-hidden rounded-[1.75rem] sm:rounded-[2rem] bg-gradient-to-br from-[#1A543F] to-[#0E2E22] text-paper shadow-iosLg ring-1 ring-black/5 dark:ring-white/10 mb-6">
                    <div className="absolute top-4 right-4 z-30">
                        <button onClick={toggleDarkMode} aria-label="Toggle dark mode" className="tap-scale w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-white/10 flex items-center justify-center text-white backdrop-blur-md transition-colors">
                            {darkMode ? <window.Icons.Sun size={18} /> : <window.Icons.Moon size={18} />}
                        </button>
                    </div>

                    <div className="relative z-10 px-6 sm:px-8 py-8 sm:py-10 flex items-center gap-4">
                        <div className="w-14 h-14 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-[#52C8A1] shadow-inner backdrop-blur-md shrink-0">
                            <window.Icons.Scan size={26} strokeWidth={2} />
                        </div>
                        <div>
                            <h1 className="font-display text-2xl sm:text-3xl font-bold tracking-tight text-white mb-1.5 drop-shadow-sm">
                                AI Receipt Scanner
                            </h1>
                            <p className="text-[13px] font-medium text-white/70 leading-relaxed max-w-sm">
                                Hayaang si AI ang mag-type ng gastos mo mula sa picture ng resibo.
                            </p>
                        </div>
                    </div>
                </section>
            );
        }

        function ScannerPage() {
            const authReady = window.useAuthReady();
            const [user, setUser] = React.useState(null);
            const [wallets, setWallets] = React.useState(["Cash"]); // Default
            const [authChecking, setAuthChecking] = React.useState(true);
            const [componentsReady, setComponentsReady] = React.useState(false);

            const [darkMode, setDarkMode] = React.useState(() => {
                return localStorage.getItem("tipid_theme") === "dark" || (!localStorage.getItem("tipid_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
            });

            React.useEffect(() => {
                if (darkMode) { document.documentElement.classList.add('dark'); localStorage.setItem("tipid_theme", "dark"); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem("tipid_theme", "light"); }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    if (window.ReceiptScanner && window.Navbar) {
                        setComponentsReady(true);
                        clearInterval(interval);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                let unsub = null; let isMounted = true;
                const checkAuth = () => {
                    if (window.TipidAuth) {
                        window.TipidAuth.ready.then(() => {
                            if (!isMounted) return;
                            unsub = window.TipidAuth.onChange((currentUser) => {
                                if (!isMounted) return;
                                if (!currentUser) window.location.href = "./login.html";
                                else {
                                    setUser(currentUser);
                                    setAuthChecking(false);
                                }
                            });
                        });
                    } else setTimeout(checkAuth, 50);
                };
                checkAuth();
                return () => { isMounted = false; if (typeof unsub === "function") unsub(); };
            }, []);

            // 🌟 FETCH WALLETS FROM FIREBASE FOR THE DROPDOWN
            React.useEffect(() => {
                if (!user || !window.FirestoreAPI || !window.db) return;
                const loadUserWallets = async () => {
                    try {
                        const snap = await window.FirestoreAPI.getDoc(window.FirestoreAPI.doc(window.db, "users", user.uid));
                        if (snap.exists() && snap.data().wallets) {
                            const loadedWallets = Object.keys(snap.data().wallets);
                            if (!loadedWallets.includes("Cash")) loadedWallets.unshift("Cash");
                            setWallets(loadedWallets);
                        }
                    } catch(e) {
                        console.error("Failed to fetch wallets:", e);
                    }
                };
                loadUserWallets();
            }, [user]);

            const handleLogout = async () => {
                await window.TipidAuth.logOut();
                window.location.href = "./login.html";
            };

            if (authChecking || !componentsReady) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-paper dark:bg-ink px-6">
                        <div className="flex flex-col items-center gap-5 glass-panel px-10 py-10 rounded-[2rem] shadow-ios">
                            <div className="relative flex items-center justify-center w-16 h-16">
                                <span className="absolute inset-0 rounded-full bg-peso/20 dark:bg-pesoLight/20 halo-pulse" />
                                <window.Logo size={42} />
                            </div>
                            <p className="text-[11px] font-mono font-bold text-ink2/60 dark:text-paper/50 tracking-widest uppercase">Warming up AI...</p>
                        </div>
                    </div>
                );
            }

            const AppScanner = window.ReceiptScanner;
            const AppNavbar = window.Navbar;

            return (
                <div className="min-h-dvh flex flex-col relative">
                    <AmbientBackground />
                    <AppNavbar user={user} onLogout={handleLogout} activeTab="more" />

                    <main className="max-w-[768px] mx-auto w-full px-4 sm:px-8 pt-[6.5rem] md:pt-10 pb-36 md:pb-20 flex-1 z-10"
                        style={{ paddingLeft: 'max(1rem, calc(var(--sal) + 1rem))', paddingRight: 'max(1rem, calc(var(--sar) + 1rem))', paddingBottom: 'calc(8rem + var(--sab))' }}>

                        <div className="fade-up"><ScannerHeroCard darkMode={darkMode} toggleDarkMode={toggleDarkMode} /></div>

                        {/* Pasa ang mga wallets as prop pababa sa Scanner */}
                        <div className="fade-up" style={{ animationDelay: "100ms" }}>
                            <AppScanner uid={user.uid} wallets={wallets} />
                        </div>
                    </main>
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            if (typeof window.Navbar === "function" && typeof window.ReceiptScanner === "function") {
                ReactDOM.createRoot(document.getElementById("root")).render(<ScannerPage />);
                return;
            }
            if (attempt > 100) return;
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }
        mountWhenComponentsReady();
    </script>
</body>
</html>
