<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumawa ng Account — Tipid</title>
    <meta name="theme-color" content="#123D2E">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F1F4EF', paperDim: '#E9EDE6', ink: '#15231C', ink2: '#33443A',
                        peso: '#1F6F54', pesoLight: '#2F8E6C', pesoDeep: '#123D2E',
                        gold: '#C9932E', expense: '#B5483B', line: '#D3DAD0',
                        /* Flag-referenced accents, used sparingly for the sun/star motif */
                        sun: '#FCD116', bayani: '#0038A8',
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Inter"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase (Updated to correct file names and relative paths) -->
    <script type="module" src="./firebase.js"></script>
    <script type="module" src="./firebase-auth.js"></script>

    <style>
        html { background: #F1F4EF; }
        body { font-feature-settings: "tnum" 1, "lnum" 1; }
        ::selection { background: #C9932E33; color: #15231C; }
        :focus-visible { outline: 2px solid #1F6F54; outline-offset: 3px; border-radius: 4px; }
        .ledger-rule { background-image: repeating-linear-gradient(to right, #D3DAD0 0, #D3DAD0 6px, transparent 6px, transparent 14px); height: 1px; }
        .ledger-rule-dark { background-image: repeating-linear-gradient(to right, #2F8E6C55 0, #2F8E6C55 6px, transparent 6px, transparent 14px); height: 1px; }
        .perf-edge {
            -webkit-mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
            -webkit-mask-position: -5px -5px; mask-position: -5px -5px;
            -webkit-mask-size: 20px 10px; mask-size: 20px 10px;
        }
        /* vertical perforation used on the seam between the two panels */
        .perf-edge-v {
            -webkit-mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            mask-image: radial-gradient(circle 5px at 5px 5px, transparent 5px, black 5.5px);
            -webkit-mask-repeat: repeat-y; mask-repeat: repeat-y;
            -webkit-mask-position: -5px -5px; mask-position: -5px -5px;
            -webkit-mask-size: 10px 20px; mask-size: 10px 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.5s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        .grow-bar { animation: growBar 0.3s cubic-bezier(0.34, 1.4, 0.64, 1) both; transform-origin: left; }

        /* --- Filipino-referenced ambient motifs (brand panel only) --- */
        @keyframes sunRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .sun-rotate { animation: sunRotate 140s linear infinite; }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.35; transform: scale(0.9); }
            50%      { opacity: 1; transform: scale(1.05); }
        }
        .star-twinkle { animation: starTwinkle 2.6s ease-in-out infinite; }

        @keyframes stampPop {
            0%   { opacity: 0; transform: rotate(-28deg) scale(0.6); }
            70%  { opacity: 1; transform: rotate(-10deg) scale(1.08); }
            100% { opacity: 1; transform: rotate(-12deg) scale(1); }
        }
        .stamp-pop { animation: stampPop 0.6s cubic-bezier(0.22, 1.4, 0.36, 1) 0.5s both; }

        @keyframes checkPop {
            0%   { transform: scale(0.6); }
            60%  { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        .check-pop { animation: checkPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        @media (prefers-reduced-motion: reduce) {
            .spin, .shake, .fade-up, .grow-bar, .sun-rotate, .star-twinkle, .stamp-pop, .check-pop {
                animation: none !important;
            }
        }

        /* SweetAlert2 brand skin */
        .swal2-popup.tipid-swal { border-radius: 20px !important; font-family: 'Inter', sans-serif; }
        .tipid-swal .swal2-title { font-family: 'Fraunces', serif; color: #15231C; }
        .tipid-swal .swal2-html-container { color: #33443A; }
        .tipid-swal .swal2-confirm { border-radius: 999px !important; padding: 0.65em 1.6em !important; font-weight: 600 !important; box-shadow: none !important; }
    </style>
</head>
<body class="bg-paper text-ink antialiased font-body min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Icon({ path, size = 20, className = "", strokeWidth = 2 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {path}
                </svg>
            );
        }
        const Icons = {
            Mail: (p) => <Icon {...p} path={<><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></>} />,
            Lock: (p) => <Icon {...p} path={<><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></>} />,
            User: (p) => <Icon {...p} path={<><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></>} />,
            Eye: (p) => <Icon {...p} path={<><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>} />,
            EyeOff: (p) => <Icon {...p} path={<><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a17.4 17.4 0 0 1-2.24 3.32M6.16 6.16C3.4 7.9 2 11 2 11s3.5 7 10 7a9.4 9.4 0 0 0 4.24-.94"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="2" y1="2" x2="22" y2="22"/></>} />,
            Loader: (p) => <Icon {...p} path={<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Check: (p) => <Icon {...p} path={<path d="M20 6 9 17l-5-5"/>} />,
            BarChart: (p) => <Icon {...p} path={<><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></>} />,
            Target: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></>} />,
        };

        function GoogleIcon({ size = 18 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                    <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5c-8.2 0-15.2 4.7-18.7 11.2Z"/>
                    <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.4C29.6 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.7 16.2 44.5 24 44.5Z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.5 5.4C41.8 35.4 44.5 30.2 44.5 24c0-1.2-.1-2.4-.3-3.5Z"/>
                </svg>
            );
        }

        function Logo({ size = 32, light = false }) {
            const [broken, setBroken] = useState(false);
            if (!broken) {
                return <img src="/assets/logo.svg" alt="Tipid logo" width={size} height={size}
                            onError={() => setBroken(true)} style={{ width: size, height: size }} className="rounded-md" />;
            }
            return (
                <span style={{ width: size, height: size }}
                      className={`rounded-md flex items-center justify-center font-display font-semibold ${light ? "bg-paper text-pesoDeep" : "bg-ink text-paper"}`}>₱</span>
            );
        }

        function useAuthReady() {
            const [ready, setReady] = useState(!!window.TipidAuth);
            const [timedOut, setTimedOut] = useState(false);
            useEffect(() => {
                if (window.TipidAuth) { setReady(true); return; }
                const h = () => setReady(true);
                window.addEventListener("tipid-auth-ready", h, { once: true });
                // If auth still hasn't announced itself after a few seconds
                // (bad import path, blocked script, offline, etc.) surface
                // that instead of leaving the button silently disabled.
                const t = setTimeout(() => setTimedOut(true), 6000);
                return () => {
                    window.removeEventListener("tipid-auth-ready", h);
                    clearTimeout(t);
                };
            }, []);
            return { ready, timedOut };
        }

        // Brand-styled SweetAlert helpers
        function swalSuccess({ title, text, confirmButtonText }) {
            return Swal.fire({
                icon: "success",
                title, text, confirmButtonText,
                confirmButtonColor: "#1F6F54",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }
        function swalError(text) {
            return Swal.fire({
                icon: "error",
                title: "Hindi Matagumpay",
                text,
                confirmButtonText: "Sige",
                confirmButtonColor: "#B5483B",
                background: "#F1F4EF",
                color: "#15231C",
                customClass: { popup: "tipid-swal" },
            });
        }

        function Field({ icon: IconCmp, error, children }) {
            return (
                <div className={`flex items-center gap-2.5 bg-white border rounded-xl px-3.5 focus-within:ring-2 focus-within:ring-peso/40 transition-shadow ${error ? "border-expense/60" : "border-line"}`}>
                    <IconCmp size={17} className="text-ink2/50 shrink-0" />
                    {children}
                </div>
            );
        }

        // --- password strength -------------------------------------------------
        function scorePassword(pw) {
            if (!pw) return 0;
            let score = 0;
            if (pw.length >= 8) score++;
            if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
            if (/\d/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            return score;
        }
        const STRENGTH_META = [
            { label: "Mahina", color: "bg-expense", text: "text-expense" },
            { label: "Mahina", color: "bg-expense", text: "text-expense" },
            { label: "Katamtaman", color: "bg-gold", text: "text-gold" },
            { label: "Malakas", color: "bg-peso", text: "text-peso" },
            { label: "Napakalakas", color: "bg-pesoDeep", text: "text-pesoDeep" },
        ];

        function PasswordStrength({ password }) {
            const score = useMemo(() => scorePassword(password), [password]);
            const filled = password.length ? Math.max(score, 1) : 0;
            const meta = STRENGTH_META[score];
            const checks = [
                { ok: password.length >= 6, label: "6+ na karakter" },
                { ok: /\d/.test(password), label: "May numero" },
                { ok: /[A-Z]/.test(password), label: "May malaking titik" },
            ];
            if (!password) return null;
            return (
                <div className="pt-1">
                    <div className="flex gap-1.5">
                        {[0, 1, 2, 3].map(i => (
                            <div key={i} className="h-1.5 flex-1 rounded-full bg-line/70 overflow-hidden">
                                {i < filled && <div className={`h-full grow-bar rounded-full ${meta.color}`}></div>}
                            </div>
                        ))}
                    </div>
                    <div className="flex items-center justify-between mt-1">
                        <span className={`text-xs font-semibold ${meta.text}`}>{meta.label}</span>
                        <span className="text-xs text-ink2/50 font-mono">{password.length} char</span>
                    </div>
                    <div className="flex flex-wrap gap-x-3 gap-y-1 mt-1.5">
                        {checks.map((c, i) => (
                            <span key={i} className={`inline-flex items-center gap-1 text-[11px] ${c.ok ? "text-peso" : "text-ink2/40"}`}>
                                <span key={c.ok ? "on" : "off"} className={c.ok ? "check-pop inline-flex" : "inline-flex"}>
                                    <Icons.Check size={11} strokeWidth={3} className={c.ok ? "opacity-100" : "opacity-30"} />
                                </span>
                                {c.label}
                            </span>
                        ))}
                    </div>
                </div>
            );
        }

        // --- Filipino-referenced decorative motifs ------------------------------
        // Eight rays, echoing the sun's eight rays on the flag (the eight provinces
        // that rose first in 1896). Purely ambient — low opacity, slow rotation.
        function SunRays({ size = 420, className = "" }) {
            const rayCount = 8;
            return (
                <svg width={size} height={size} viewBox="0 0 100 100" className={`sun-rotate ${className}`}>
                    <g stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
                        {Array.from({ length: rayCount }).map((_, i) => (
                            <line key={i} x1="50" y1="2" x2="50" y2="20" transform={`rotate(${(360 / rayCount) * i} 50 50)`} />
                        ))}
                    </g>
                    <circle cx="50" cy="50" r="13" fill="none" stroke="currentColor" strokeWidth="1.3" />
                </svg>
            );
        }

        // Three stars for Luzon, Visayas, and Mindanao.
        function TinyStar({ style, size = 11, delay = 0 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"
                     className="star-twinkle" style={{ ...style, animationDelay: `${delay}s` }}>
                    <path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.4 5.7 20.8 8 13.6 2 9.2h7.6z"/>
                </svg>
            );
        }

        // Faint diagonal weave, echoing hand-woven banig / abaca matting.
        function WeavePattern() {
            return (
                <svg className="absolute inset-0 w-full h-full opacity-[0.05] pointer-events-none">
                    <defs>
                        <pattern id="banig-weave" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                            <line x1="0" y1="0" x2="0" y2="14" stroke="currentColor" strokeWidth="1" />
                            <line x1="7" y1="0" x2="7" y2="14" stroke="currentColor" strokeWidth="1" opacity="0.5" />
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#banig-weave)" />
                </svg>
            );
        }

        // A little rubber-stamp mark, the kind you'd see on a sari-sari store receipt.
        function GenuineStamp() {
            return (
                <div className="stamp-pop absolute -top-3 -right-3 w-[4.5rem] h-[4.5rem] rounded-full border-2 border-dashed border-ink2/30 flex items-center justify-center bg-paper/70">
                    <span className="text-center text-[7.5px] font-mono font-bold tracking-wider text-ink2/50 leading-tight uppercase">
                        Tunay na<br/>Tipid
                    </span>
                </div>
            );
        }

        // --- left brand panel ---------------------------------------------------
        function ReceiptMock() {
            const rows = [
                { label: "Grocery", cat: "bg-gold", amount: "− ₱1,240.00", tone: "text-ink" },
                { label: "Pamasahe", cat: "bg-peso", amount: "− ₱180.00", tone: "text-ink" },
                { label: "Kuryente", cat: "bg-expense", amount: "− ₱2,050.00", tone: "text-ink" },
                { label: "Naipon", cat: "bg-pesoLight", amount: "+ ₱3,000.00", tone: "text-peso" },
            ];
            return (
                <div className="relative bg-paper rounded-2xl shadow-2xl p-5 pt-6 w-full max-w-xs -rotate-1">
                    <div className="perf-edge absolute -top-[1px] left-0 right-0 h-2 bg-pesoDeep"></div>
                    <GenuineStamp />
                    <div className="flex items-center justify-between mb-3">
                        <span className="font-mono text-[11px] tracking-[0.15em] uppercase text-ink2/60">Ledger — Buwan na Ito</span>
                        <span className="font-mono text-[11px] text-ink2/40">#0042</span>
                    </div>
                    <div className="space-y-2.5">
                        {rows.map((r, i) => (
                            <div key={i}>
                                <div className="flex items-center justify-between text-sm">
                                    <span className="flex items-center gap-2 text-ink2">
                                        <span className={`w-1.5 h-1.5 rounded-full ${r.cat}`}></span>
                                        {r.label}
                                    </span>
                                    <span className={`font-mono font-medium ${r.tone}`}>{r.amount}</span>
                                </div>
                                {i < rows.length - 1 && <div className="ledger-rule mt-2.5"></div>}
                            </div>
                        ))}
                    </div>
                    <div className="ledger-rule my-3"></div>
                    <div className="flex items-center justify-between">
                        <span className="text-xs font-semibold text-ink2 uppercase tracking-wide">Naipon ngayong buwan</span>
                        <span className="font-mono font-bold text-peso">₱3,000.00</span>
                    </div>
                </div>
            );
        }

        function BrandPanel() {
            const features = [
                { icon: Icons.Check, text: "Walang bayad, forever" },
                { icon: Icons.BarChart, text: "Malinaw na ulat, bawat sentimo" },
                { icon: Icons.Target, text: "Itakda ang layunin, subaybayan ang progreso" },
            ];
            return (
                <div className="relative h-full bg-pesoDeep text-paper overflow-hidden px-8 py-10 lg:px-12 lg:py-14 flex flex-col">
                    <WeavePattern />
                    <div className="absolute top-[-120px] right-[-100px] w-[320px] h-[320px] bg-pesoLight/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-160px] left-[-120px] w-[360px] h-[360px] bg-gold/10 rounded-full blur-3xl"></div>

                    {/* Ambient sun motif — eight rays, echoing the flag's eight provinces */}
                    <div className="absolute -bottom-20 -right-20 text-sun/70 pointer-events-none">
                        <SunRays size={380} />
                    </div>

                    {/* Three stars — Luzon, Visayas, Mindanao */}
                    <TinyStar style={{ position: "absolute", top: "14%", left: "62%" }} delay={0} size={10} />
                    <TinyStar style={{ position: "absolute", top: "22%", left: "78%" }} delay={0.6} size={8} />
                    <TinyStar style={{ position: "absolute", top: "9%", left: "85%" }} delay={1.2} size={9} />

                    <a href="index.html" className="relative flex items-center gap-2.5">
                        <Logo size={28} light />
                        <span className="text-lg font-display font-semibold tracking-tight">Tipid</span>
                    </a>

                    <div className="relative inline-flex items-center gap-1.5 mt-4 px-3 py-1 rounded-full bg-paper/10 border border-paper/15 text-[11px] font-semibold tracking-wide text-paper/80 w-fit">
                        <span aria-hidden="true">🇵🇭</span> Gawang Pilipino
                    </div>

                    <div className="relative mt-8 lg:mt-12 max-w-sm">
                        <p className="font-mono text-xs tracking-[0.2em] uppercase text-pesoLight mb-3">Ang iyong personal na ledger</p>
                        <h2 className="font-display text-3xl lg:text-[2.6rem] leading-[1.1] font-semibold tracking-tight">
                            Alamin kung saan talaga napupunta ang pera mo.
                        </h2>
                        <p className="text-paper/70 text-sm mt-4 leading-relaxed">
                            Ginawa para sa pang-araw-araw na budget ng bawat Pilipino simple, tapat, at laging malinaw.
                        </p>
                    </div>

                    <div className="relative mt-10 hidden lg:block">
                        <ReceiptMock />
                    </div>

                    <div className="relative mt-auto pt-10 lg:pt-14 space-y-3">
                        {features.map((f, i) => (
                            <div key={i} className="flex items-center gap-3 text-sm text-paper/85">
                                <span className="w-7 h-7 rounded-full bg-paper/10 flex items-center justify-center shrink-0">
                                    <f.icon size={14} className="text-pesoLight" />
                                </span>
                                {f.text}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- sign up form ---------------------------------------------------
        function SignUp() {
            const { ready: authReady, timedOut } = useAuthReady();
            const [firstName, setFirstName] = useState("");
            const [lastName, setLastName] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [confirm, setConfirm] = useState("");
            const [showPw, setShowPw] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [shake, setShake] = useState(false);
            const [fieldErr, setFieldErr] = useState({});

            const fail = (msg, field) => {
                setError(msg);
                setFieldErr(field ? { [field]: true } : {});
                setShake(true);
                setTimeout(() => setShake(false), 500);
                return false;
            };

            const validate = () => {
                if (!firstName.trim()) return fail("Ilagay ang iyong unang pangalan.", "firstName");
                if (!lastName.trim()) return fail("Ilagay ang iyong apelyido.", "lastName");
                if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Hindi valid ang email address.", "email");
                if (password.length < 6) return fail("Dapat 6 characters pataas ang password.", "password");
                if (password !== confirm) return fail("Hindi magkatugma ang password.", "confirm");
                return true;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setFieldErr({});
                if (!validate()) return;
                setLoading(true);
                try {
                    const fullName = `${firstName.trim()} ${lastName.trim()}`;
                    await window.TipidAuth.signUp(fullName, email.trim(), password);
                    setLoading(false);
                    await swalSuccess({
                        title: "Tagumpay!",
                        text: "Nagawa na ang account mo. Mag-log in ka na para magsimulang mag-tipid.",
                        confirmButtonText: "Mag-log In",
                    });
                    window.location.href = "login.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            const handleGoogle = async () => {
                setError("");
                setLoading(true);
                try {
                    await window.TipidAuth.loginWithGoogle();
                    setLoading(false);
                    await swalSuccess({
                        title: "Tagumpay!",
                        text: "Naka-sign up ka na gamit ang Google. Papasok ka na sa dashboard.",
                        confirmButtonText: "Sige",
                    });
                    window.location.href = "dashboard.html";
                } catch (err) {
                    setLoading(false);
                    swalError(window.TipidAuth.friendlyError(err.code));
                }
            };

            return (
                <div className="min-h-screen grid lg:grid-cols-[1.05fr_1fr]">
                    <div className="hidden lg:block relative">
                        <BrandPanel />
                        <div className="perf-edge-v absolute top-0 right-0 h-full w-2.5 bg-paper"></div>
                    </div>

                    <div className="flex items-center justify-center px-6 py-6 lg:py-10 relative">
                        <div className="w-full max-w-sm fade-up">
                            <a href="index.html" className="lg:hidden flex items-center justify-center gap-2.5 mb-5">
                                <Logo size={30} />
                                <span className="text-xl font-display font-semibold tracking-tight text-ink">Tipid</span>
                            </a>

                            <div className={shake ? "shake" : ""}>
                                <div className="mb-5 text-center lg:text-left">
                                    <p className="text-xs font-mono tracking-[0.2em] uppercase text-peso mb-2">Simulan ang tipid</p>
                                    <h1 className="font-display text-3xl font-semibold text-ink tracking-tight">Gumawa ng account</h1>
                                    <p className="text-ink2 text-sm mt-2">Libre, at tumatagal lang ng ilang segundo.</p>
                                </div>

                                {timedOut && !authReady && (
                                    <div className="mb-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                        <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                        <span>Hindi ma-connect sa auth system. Paki-refresh ang page o subukan ulit mamaya.</span>
                                    </div>
                                )}

                                <button onClick={handleGoogle} disabled={loading || !authReady} type="button"
                                    className="w-full flex items-center justify-center gap-2.5 border border-line hover:border-ink/30 hover:bg-paperDim/50 active:scale-[0.98] rounded-xl py-3 text-sm font-semibold text-ink transition-all duration-200 disabled:opacity-50">
                                    <GoogleIcon size={18} /> Mag-sign up gamit ang Google
                                </button>

                                <div className="flex items-center gap-3 my-4">
                                    <div className="ledger-rule flex-1"></div>
                                    <span className="text-xs font-mono text-ink2/50 uppercase">o</span>
                                    <div className="ledger-rule flex-1"></div>
                                </div>

                                {error && (
                                    <div className="mb-5 flex items-start gap-2 bg-expense/10 text-expense text-sm rounded-xl px-3.5 py-3">
                                        <Icons.AlertCircle size={16} className="shrink-0 mt-0.5" />
                                        <span>{error}</span>
                                    </div>
                                )}

                                <form onSubmit={handleSubmit} className="space-y-3.5">
                                    <div className="grid grid-cols-2 gap-3">
                                        <Field icon={Icons.User} error={fieldErr.firstName}>
                                            <input type="text" value={firstName} onChange={e => setFirstName(e.target.value)}
                                                placeholder="Unang pangalan" autoComplete="given-name"
                                                className="w-full min-w-0 bg-transparent py-3 text-sm focus:outline-none" />
                                        </Field>
                                        <Field icon={Icons.User} error={fieldErr.lastName}>
                                            <input type="text" value={lastName} onChange={e => setLastName(e.target.value)}
                                                placeholder="Apelyido" autoComplete="family-name"
                                                className="w-full min-w-0 bg-transparent py-3 text-sm focus:outline-none" />
                                        </Field>
                                    </div>

                                    <Field icon={Icons.Mail} error={fieldErr.email}>
                                        <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                                            placeholder="Email address" autoComplete="email"
                                            className="w-full bg-transparent py-3 text-sm focus:outline-none" />
                                    </Field>

                                    <div>
                                        <Field icon={Icons.Lock} error={fieldErr.password}>
                                            <input type={showPw ? "text" : "password"} value={password} onChange={e => setPassword(e.target.value)}
                                                placeholder="Password (6+ characters)" autoComplete="new-password"
                                                className="w-full bg-transparent py-3 text-sm focus:outline-none" />
                                            <button type="button" onClick={() => setShowPw(v => !v)} className="text-ink2/50 hover:text-ink2 shrink-0 transition-colors duration-200" aria-label="Toggle password visibility">
                                                {showPw ? <Icons.EyeOff size={17} /> : <Icons.Eye size={17} />}
                                            </button>
                                        </Field>
                                        <PasswordStrength password={password} />
                                    </div>

                                    <Field icon={Icons.Lock} error={fieldErr.confirm}>
                                        <input type={showPw ? "text" : "password"} value={confirm} onChange={e => setConfirm(e.target.value)}
                                            placeholder="Ulitin ang password" autoComplete="new-password"
                                            className="w-full bg-transparent py-3 text-sm focus:outline-none" />
                                    </Field>

                                    <button type="submit" disabled={loading || !authReady}
                                        className="w-full bg-peso hover:bg-pesoLight active:scale-[0.98] disabled:opacity-60 text-paper font-semibold py-3.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 mt-2">
                                        {loading && <Icons.Loader size={16} className="spin" />}
                                        {loading ? "Ginagawa..." : "Gumawa ng Account"}
                                    </button>
                                </form>

                                <p className="text-center text-sm text-ink2 mt-7">
                                    May account ka na? <a href="login.html" className="text-peso font-semibold hover:underline">Mag-log in</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<SignUp />);
    </script>
    <!-- PWA Service Worker Registration & Auto-Update Alert -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {

                    // Makikinig ang app kung may dina-download na bagong update (bagong CACHE_VERSION)
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            // Kapag tapos na i-download ang bagong update
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // Premium UX: Magpapakita ng magandang prompt imbes na biglang i-refresh ang screen
                                Swal.fire({
                                    title: "May Bagong Update! 🎉",
                                    text: "May in-add kaming bagong features sa Tipid App. I-refresh ang app para magamit ito.",
                                    icon: "info",
                                    confirmButtonText: "I-update Ngayon",
                                    confirmButtonColor: "#1F6F54",
                                    allowOutsideClick: false,
                                    customClass: { popup: "tipid-swal" }
                                }).then(() => {
                                    // Ire-reload ang app at makikita na ang bagong features
                                    window.location.reload();
                                });
                            }
                        });
                    });

                }).catch(err => console.error("Service Worker registration failed:", err));
            });
        }
    </script>
</body>
</html>
