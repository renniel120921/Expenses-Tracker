        /* =========================================================================
           RECENT TRANSACTIONS LEDGER & INLINE QUICK-FILTER
           ========================================================================= */
        function RecentTransactionsFeed({ entries, uid, onDeleteEntry, onOpenAddModal }) {
            const isTl = useIsTagalog();
            const [filter, setFilter] = React.useState("all"); // "all", "expense", "income", "need", "luho"
            const [search, setSearch] = React.useState("");

            const filtered = React.useMemo(() => {
                return entries.filter((e) => {
                    // Type/SpendType filter
                    if (filter === "expense" && e.type !== "expense") return false;
                    if (filter === "income" && e.type !== "income") return false;
                    if (filter === "need" && (e.type !== "expense" || e.spendType === "luho")) return false;
                    if (filter === "luho" && (e.type !== "expense" || e.spendType !== "luho")) return false;

                    // Search filter
                    if (search.trim()) {
                        const q = search.toLowerCase();
                        const desc = (e.desc || "").toLowerCase();
                        const cat = (e.category || "").toLowerCase();
                        const meth = (e.method || "").toLowerCase();
                        const amt = String(e.amount || "");
                        if (!desc.includes(q) && !cat.includes(q) && !meth.includes(q) && !amt.includes(q)) {
                            return false;
                        }
                    }

                    return true;
                });
            }, [entries, filter, search]);

            return (
                <div className="bento-card rounded-[2rem] p-5 sm:p-7">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                        <div>
                            <div className="flex items-center gap-2">
                                <h3 className="font-display font-bold text-lg text-ink dark:text-paper">{isTl ? "Kamakailang Transaksyon" : "Recent Transactions"}</h3>
                                <span className="text-xs font-mono font-bold bg-black/5 dark:bg-white/10 px-2 py-0.5 rounded-full text-ink2/70 dark:text-paper/60">
                                    {filtered.length} of {entries.length}
                                </span>
                            </div>
                            <p className="text-[11px] font-mono text-ink2/50 dark:text-paper/40 mt-0.5">Live expense log</p>
                        </div>

                        {/* Search and Action */}
                        <div className="flex items-center gap-2.5">
                            <div className="relative">
                                <Icons.Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink2/40 dark:text-paper/40 pointer-events-none" />
                                <input
                                    type="text"
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                    placeholder="Search logs..."
                                    className="bg-black/5 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-xl pl-8 pr-3 py-1.5 text-xs text-ink dark:text-paper placeholder:text-ink2/40 dark:placeholder:text-paper/40 focus:outline-none focus:ring-2 focus:ring-peso/40 w-[140px] sm:w-[180px]"
                                />
                            </div>

                            <button
                                type="button"
                                onClick={() => onOpenAddModal("expense")}
                                className="bg-peso hover:bg-pesoLight text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1 shrink-0"
                            >
                                <Icons.Plus size={14} /> New
                            </button>
                        </div>
                    </div>

                    {/* Filter Pills */}
                    <div className="flex gap-2 overflow-x-auto pb-2 hide-scroll mb-3">
                        {[
                            { id: "all", label: "All Logs" },
                            { id: "expense", label: "Expenses" },
                            { id: "income", label: "Income" },
                            { id: "need", label: "Needs" },
                            { id: "luho", label: "Wants (Luho)" },
                        ].map((btn) => (
                            <button
                                key={btn.id}
                                type="button"
                                onClick={() => setFilter(btn.id)}
                                className={`px-3 py-1 rounded-xl text-xs font-semibold whitespace-nowrap transition-all border ${
                                    filter === btn.id
                                        ? "bg-ink dark:bg-paper text-paper dark:text-ink font-bold border-transparent"
                                        : "bg-black/[0.02] dark:bg-white/[0.04] text-ink2/60 dark:text-paper/50 border-black/5 dark:border-white/5 hover:bg-black/5"
                                }`}
                            >
                                {btn.label}
                            </button>
                        ))}
                    </div>

                    {/* List of Entries */}
                    <div className="divide-y divide-line/40 dark:divide-white/5">
                        {filtered.length === 0 ? (
                            <div className="text-center py-10 text-xs font-mono text-ink2/50 dark:text-paper/40">
                                No transactions matching current filters.
                            </div>
                        ) : (
                            filtered.slice(0, 10).map((entry) => {
                                const isIncome = entry.type === "income";
                                const dateObj = window.TipidCore.entryDate(entry);
                                const dateStr = dateObj ? dateObj.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
                                const timeStr = dateObj ? dateObj.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "";
                                const catIcon = window.CATEGORY_ICONS[entry.category] || (isIncome ? "💵" : "📦");

                                return (
                                    <div key={entry.id} className="py-3 flex items-center justify-between gap-3 group hover:bg-black/[0.01] dark:hover:bg-white/[0.01] px-1 rounded-xl transition-colors">
                                        <div className="flex items-center gap-3 min-w-0">
                                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base shadow-sm border ${isIncome ? "bg-peso/10 border-peso/20" : "bg-expense/10 border-expense/20"}`}>
                                                {catIcon}
                                            </div>
                                            <div className="min-w-0">
                                                <p className="font-semibold text-xs sm:text-sm text-ink dark:text-paper truncate">
                                                    {entry.desc}
                                                </p>
                                                <div className="flex items-center gap-2 text-[10px] text-ink2/50 dark:text-paper/40 font-mono mt-0.5">
                                                    <span>{entry.method || "Cash"}</span>
                                                    <span>•</span>
                                                    <span>{dateStr} {timeStr}</span>
                                                    {!isIncome && (
                                                        <>
                                                            <span>•</span>
                                                            <span className={`px-1.5 py-0.2 rounded ${entry.spendType === "luho" ? "bg-expense/10 text-expense" : "bg-peso/10 text-peso dark:text-pesoLight"}`}>
                                                                {entry.spendType === "luho" ? "Want" : "Need"}
                                                            </span>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-3 shrink-0">
                                            <span className={`font-mono font-bold text-sm sm:text-base ${isIncome ? "text-peso dark:text-pesoLight" : "text-ink dark:text-paper"}`}>
                                                {isIncome ? "+" : "−"}₱{window.peso(entry.amount)}
                                            </span>
                                            <button
                                                type="button"
                                                onClick={() => onDeleteEntry(entry.id, entry.desc)}
                                                className="opacity-0 group-hover:opacity-100 text-ink2/40 hover:text-expense p-1 transition-opacity rounded-lg"
                                                title="Delete transaction"
                                                aria-label="Delete entry"
                                            >
                                                <Icons.Trash size={14} />
                                            </button>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>

                    {filtered.length > 10 && (
                        <div className="pt-4 text-center border-t border-line/60 dark:border-white/10 mt-3">
                            <a href="history.html" className="text-xs font-bold text-peso dark:text-pesoLight hover:underline inline-flex items-center gap-1">
                                View all {entries.length} transactions in History <Icons.ArrowRight size={14} />
                            </a>
                        </div>
                    )}
                </div>
            );
        }

        /* =========================================================================
           QUICK ADD TRANSACTION MODAL
           ========================================================================= */
        function AddTransactionModal({ open, onClose, defaultType = "expense", uid, entries, baseBalances, onAdded }) {
            const isTl = useIsTagalog();
            const [type, setType] = React.useState(defaultType);
            const [desc, setDesc] = React.useState("");
            const [amount, setAmount] = React.useState("");
            const [category, setCategory] = React.useState(window.CATEGORIES[0]);
            const [spendType, setSpendType] = React.useState("need");
            const [saving, setSaving] = React.useState(false);

            const availableMethods = window.METHODS && window.METHODS.length > 0 ? window.METHODS : ["Cash"];
            const [method, setMethod] = React.useState(availableMethods[0] || "Cash");

            React.useEffect(() => {
                if (open) {
                    setType(defaultType);
                    setDesc("");
                    setAmount("");
                    setCategory(window.CATEGORIES[0]);
                    setSpendType("need");
                }
            }, [open, defaultType]);

            const walletBalances = React.useMemo(() => {
                return window.TipidCore.walletBalances(entries, baseBalances);
            }, [entries, baseBalances]);

            const currentBalance = walletBalances[method] || 0;
            let parsedAmount = 0;
            try { parsedAmount = amount === "" ? 0 : window.TipidCore.money(amount); } catch (_) { parsedAmount = 0; }
            const isExpense = type === "expense";
            const insufficient = isExpense && window.TipidCore.toCentavos(parsedAmount, { allowZero: true }) > window.TipidCore.toCentavos(Math.max(currentBalance, 0), { allowZero: true });

            if (!open) return null;

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!desc.trim()) {
                    return Swal.fire({ icon: "warning", title: "Missing Description", text: "Please enter what you bought or earned.", customClass: { popup: 'tipid-swal' } });
                }
                if (!parsedAmount || parsedAmount <= 0) {
                    return Swal.fire({ icon: "warning", title: "Invalid Amount", text: "Please enter a valid amount.", customClass: { popup: 'tipid-swal' } });
                }
                if (insufficient) {
                    return Swal.fire({ icon: "error", title: "Insufficient Balance", text: `Only ₱${window.peso(currentBalance)} is remaining in ${method}.`, customClass: { popup: 'tipid-swal' } });
                }

                setSaving(true);
                try {
                    if (type === "income") {
                        await window.TipidData.addIncome(uid, { desc: desc.trim(), amount: parsedAmount, method });
                    } else {
                        await window.TipidData.addExpense(uid, { desc: desc.trim(), amount: parsedAmount, category, method, spendType });
                    }
                    if (onAdded) onAdded();
                    onClose();

                    const Toast = Swal.mixin({ toast: true, position: "top-end", showConfirmButton: false, timer: 2000, customClass: { popup: 'tipid-swal text-xs' } });
                    Toast.fire({ icon: "success", title: `${type === "income" ? "Income" : "Expense"} saved!` });
                } catch (err) {
                    Swal.fire({ icon: "error", title: "Failed to save", text: err.message, customClass: { popup: 'tipid-swal' } });
                } finally {
                    setSaving(false);
                }
            };

            return ReactDOM.createPortal(
                <div className="fixed inset-0 z-[120] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-ink/75 backdrop-blur-sm fade-up">
                    <div className="bg-paper dark:bg-ink2 w-full max-w-lg rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl border border-white/20 dark:border-white/10 overflow-hidden flex flex-col max-h-[92vh]">
                        {/* Drag indicator on mobile */}
                        <div className="w-12 h-1.5 bg-black/15 dark:bg-white/20 rounded-full mx-auto mt-3 sm:hidden" />

                        {/* Modal Header */}
                        <div className="p-6 pb-4 border-b border-line/60 dark:border-white/10 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <span className={`w-3 h-3 rounded-full ${type === "income" ? "bg-peso" : "bg-expense"}`} />
                                <h3 className="font-display font-bold text-xl text-ink dark:text-paper">{isTl ? "Bagong Transaksyon" : "New Transaction"}</h3>
                            </div>
                            <button
                                type="button"
                                onClick={onClose}
                                className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-ink2/60 dark:text-paper/60 transition-colors"
                            >
                                <Icons.X size={18} strokeWidth={2.5} />
                            </button>
                        </div>

                        {/* Modal Body */}
                        <form onSubmit={handleSubmit} className="p-6 space-y-4 overflow-y-auto">
                            {/* Type Toggle */}
                            <div className="grid grid-cols-2 p-1 rounded-2xl bg-black/5 dark:bg-white/5 border border-black/5 dark:border-white/5 text-xs font-bold">
                                <button
                                    type="button"
                                    onClick={() => setType("expense")}
                                    className={`py-2 rounded-xl transition-all ${type === "expense" ? "bg-expense text-white shadow-sm" : "text-ink2/60 dark:text-paper/50"}`}
                                >
                                    Expense
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setType("income")}
                                    className={`py-2 rounded-xl transition-all ${type === "income" ? "bg-peso text-white shadow-sm" : "text-ink2/60 dark:text-paper/50"}`}
                                >
                                    Income
                                </button>
                            </div>

                            {/* Amount Input */}
                            <div>
                                <label className="text-[10.5px] font-mono font-bold uppercase tracking-wider text-ink2/60 dark:text-paper/40 block mb-1">
                                    Amount (PHP)
                                </label>
                                <div className={`flex items-center gap-2 px-4 py-3 rounded-2xl bg-white dark:bg-black/30 border ${insufficient ? "border-expense ring-2 ring-expense/20" : "border-line dark:border-white/10"} focus-within:ring-2 focus-within:ring-peso/40 shadow-inner`}>
                                    <span className="font-mono text-xl font-bold text-ink2/40 dark:text-paper/40">₱</span>
                                    <input
                                        type="number"
                                        step="0.01"
                                        inputMode="decimal"
                                        autoFocus
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        placeholder="0.00"
                                        className="w-full bg-transparent text-xl font-mono font-bold text-ink dark:text-paper placeholder:text-ink2/30 dark:placeholder:text-paper/30 focus:outline-none"
                                    />
                                </div>
                                {insufficient && (
                                    <p className="text-[11px] font-mono font-semibold text-expense mt-1">
                                        Short by ₱{window.peso(parsedAmount - currentBalance)} in {method} (Bal: ₱{window.peso(currentBalance)})
                                    </p>
                                )}
                            </div>

                            {/* Description */}
                            <div>
                                <label className="text-[10.5px] font-mono font-bold uppercase tracking-wider text-ink2/60 dark:text-paper/40 block mb-1">
                                    Description
                                </label>
                                <input
                                    type="text"
                                    value={desc}
                                    onChange={(e) => setDesc(e.target.value)}
                                    placeholder={type === "income" ? "e.g., Monthly Salary, Freelance project" : "e.g., Grocery at SM, Coffee, Grab fare"}
                                    className="w-full px-4 py-3 rounded-2xl bg-white dark:bg-black/30 border border-line dark:border-white/10 text-sm font-medium text-ink dark:text-paper placeholder:text-ink2/30 dark:placeholder:text-paper/30 focus:outline-none focus:ring-2 focus:ring-peso/40 shadow-inner"
                                />
                            </div>

                            {/* Need vs Want (Only for expenses) */}
                            {type === "expense" && (
                                <div>
                                    <label className="text-[10.5px] font-mono font-bold uppercase tracking-wider text-ink2/60 dark:text-paper/40 block mb-1">
                                        Type of Outflow
                                    </label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setSpendType("need")}
                                            className={`py-2.5 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1.5 ${
                                                spendType === "need"
                                                    ? "bg-peso/10 border-peso/30 text-peso dark:text-pesoLight font-bold"
                                                    : "bg-white dark:bg-black/20 border-line dark:border-white/10 text-ink2/60 dark:text-paper/50"
                                            }`}
                                        >
                                            <Icons.Check size={14} /> Essential (Need)
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setSpendType("luho")}
                                            className={`py-2.5 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1.5 ${
                                                spendType === "luho"
                                                    ? "bg-expense/10 border-expense/30 text-expense dark:text-[#F38C80] font-bold"
                                                    : "bg-white dark:bg-black/20 border-line dark:border-white/10 text-ink2/60 dark:text-paper/50"
                                            }`}
                                        >
                                            ✨ Discretionary (Want)
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Category & Wallet Row */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {type === "expense" && (
                                    <div>
                                        <label className="text-[10.5px] font-mono font-bold uppercase tracking-wider text-ink2/60 dark:text-paper/40 block mb-1">
                                            Category
                                        </label>
                                        <select
                                            value={category}
                                            onChange={(e) => setCategory(e.target.value)}
                                            className="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-black/30 border border-line dark:border-white/10 text-xs font-semibold text-ink dark:text-paper focus:outline-none focus:ring-2 focus:ring-peso/40 cursor-pointer"
                                        >
                                            {window.CATEGORIES.map((c) => (
                                                <option key={c} value={c} className="bg-paper dark:bg-ink text-ink dark:text-paper">
                                                    {window.CATEGORY_ICONS[c] || "📦"} {c}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                )}

                                <div>
                                    <label className="text-[10.5px] font-mono font-bold uppercase tracking-wider text-ink2/60 dark:text-paper/40 block mb-1">
                                        Wallet / Account
                                    </label>
                                    <select
                                        value={method}
                                        onChange={(e) => setMethod(e.target.value)}
                                        className="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-black/30 border border-line dark:border-white/10 text-xs font-semibold text-ink dark:text-paper focus:outline-none focus:ring-2 focus:ring-peso/40 cursor-pointer"
                                    >
                                        {availableMethods.map((m) => (
                                            <option key={m} value={m} className="bg-paper dark:bg-ink text-ink dark:text-paper">
                                                {m} (Bal: ₱{window.peso(walletBalances[m] || 0)})
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Submit Button */}
                            <div className="pt-2">
                                <button
                                    type="submit"
                                    disabled={saving || insufficient}
                                    className={`w-full py-3.5 rounded-2xl font-bold text-white text-sm shadow-md transition-all flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 ${
                                        type === "income" ? "bg-peso hover:bg-pesoLight" : "bg-expense hover:opacity-90"
                                    }`}
                                >
                                    {saving ? <Icons.Loader size={18} className="spin" /> : <Icons.Check size={18} />}
                                    <span>{saving ? "Recording..." : type === "income" ? "Save Income" : "Save Expense"}</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>,
                document.body
            );
        }

        /* =========================================================================
           MAIN DASHBOARD APP CONTAINER
           ========================================================================= */
        function Dashboard() {
            const authReady = window.useAuthReady();
            const dataReady = window.useDataReady();
            const [user, setUser] = React.useState(undefined);
            const [entries, setEntries] = React.useState([]);
            const [bills, setBills] = React.useState([]);
            const [utangList, setUtangList] = React.useState([]);
            const [budget, setBudgetState] = React.useState(null);
            const [baseBalances, setBaseBalances] = React.useState({});

            const isTl = useIsTagalog();
            const [loadingEntries, setLoadingEntries] = React.useState(true);
            const [showOnboarding, setShowOnboarding] = React.useState(false);

            // Time horizon selector: "thisMonth", "thisWeek", "last30Days", "all"
            const [dateRange, setDateRange] = React.useState("thisMonth");

            // Modal controls
            const [isAddModalOpen, setIsAddModalOpen] = React.useState(false);
            const [addModalType, setAddModalType] = React.useState("expense");

            // Biometric App Lock & Protection States
            const [isLocked, setIsLocked] = React.useState(false);
            const [unlocking, setUnlocking] = React.useState(false);
            const [showPinModal, setShowPinModal] = React.useState(false);
            const [pinInput, setPinInput] = React.useState("");

            // PWA Quick Action shortcut (?action=new_expense)
            React.useEffect(() => {
                try {
                    const params = new URLSearchParams(window.location.search);
                    if (params.get("action") === "new_expense") {
                        setIsAddModalOpen(true);
                        setAddModalType("expense");
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (_) {}
            }, []);

            // Biometric lock check
            React.useEffect(() => {
                if (!user?.uid || !window.TipidBiometrics) return;
                const bioActive = window.TipidBiometrics.isEnabled(user.uid);
                if (bioActive) {
                    const unlocked = window.TipidBiometrics.isSessionUnlocked(user.uid);
                    if (!unlocked) {
                        setIsLocked(true);
                        handleBiometricUnlock(user.uid);
                    }
                }
            }, [user?.uid]);

            const handleBiometricUnlock = async (targetUid) => {
                const uid = targetUid || user?.uid;
                if (!uid || !window.TipidBiometrics) return;
                try {
                    setUnlocking(true);
                    const verified = await window.TipidBiometrics.verify(uid);
                    if (verified) {
                        setIsLocked(false);
                        if (window.TipidCelebration) {
                            window.TipidCelebration.playChime();
                        }
                    }
                } catch (err) {
                    console.log("Biometric verification cancelled or errored:", err);
                } finally {
                    setUnlocking(false);
                }
            };

            const handlePinUnlock = async (e) => {
                e.preventDefault();
                if (!user?.uid || !pinInput || !window.TipidBiometrics) return;
                const ok = await window.TipidBiometrics.verifyPasscode(user.uid, pinInput);
                if (ok) {
                    setIsLocked(false);
                    setShowPinModal(false);
                    setPinInput("");
                    if (window.TipidCelebration) {
                        window.TipidCelebration.playChime();
                    }
                } else {
                    if (window.swalError) {
                        window.swalError(isTl ? "Maling PIN. Pakisubukan muli." : "Incorrect security PIN. Please try again.");
                    } else {
                        alert(isTl ? "Maling PIN." : "Incorrect PIN.");
                    }
                }
            };

            // Auth listener
            React.useEffect(() => {
                if (!authReady) return;
                return window.TipidAuth.onChange((u) => {
                    window.TIPID_CURRENT_UID = u?.uid || null;
                    setUser(u || null);
                });
            }, [authReady]);

            React.useEffect(() => {
                if (user === null) window.location.href = "login.html";
                if (user && user.uid && !localStorage.getItem(`tipid_onboarded_${user.uid}`)) {
                    setShowOnboarding(true);
                }
            }, [user]);

            // Wallets loading
            React.useEffect(() => {
                if (!dataReady || !user) return;
                const loadUserWallets = async () => {
                    try {
                        if (window.FirestoreAPI && window.db) {
                            const { doc, getDoc } = window.FirestoreAPI;
                            const snap = await getDoc(doc(window.db, "users", user.uid));
                            if (snap.exists() && snap.data().wallets) {
                                const loaded = snap.data().wallets;
                                if (!Object.keys(loaded).includes("Cash")) loaded["Cash"] = 0;
                                setBaseBalances(loaded);
                            } else {
                                setBaseBalances({ "Cash": 0 });
                            }
                        } else {
                            setBaseBalances({ "Cash": 0 });
                        }
                    } catch (err) {
                        setBaseBalances({ "Cash": 0 });
                    }
                };
                loadUserWallets();
            }, [dataReady, user]);

            React.useEffect(() => {
                const keys = Object.keys(baseBalances);
                if (keys.length > 0) {
                    window.METHODS = keys.includes("Cash") ? keys : ["Cash", ...keys];
                }
            }, [baseBalances]);

            // Data Subscriptions
            React.useEffect(() => {
                if (!dataReady || !user) return;
                setLoadingEntries(true);
                const unsubEntries = window.TipidData.subscribeEntries(
                    user.uid,
                    (list) => { setEntries(list); setLoadingEntries(false); },
                    () => { setLoadingEntries(false); }
                );
                const unsubBudget = window.TipidData.subscribeBudget(user.uid, setBudgetState, () => {});
                const unsubBills = window.TipidData.subscribeBills ? window.TipidData.subscribeBills(user.uid, setBills, () => {}) : () => {};
                const unsubUtang = window.TipidData.subscribeUtang ? window.TipidData.subscribeUtang(user.uid, setUtangList, () => {}) : () => {};
                const unsubNotif = window.TipidData.subscribeNotificationSettings ? window.TipidData.subscribeNotificationSettings(user.uid, (settings) => {
                    if (window.TipidReminders && typeof window.TipidReminders.checkAndTriggerDaily === 'function') {
                        window.TipidReminders.checkAndTriggerDaily(user.uid, settings);
                    }
                }, () => {}) : () => {};

                const unsubPrefs = window.TipidData?.subscribePreferences ? window.TipidData.subscribePreferences(user.uid, (prefs) => {
                    if (prefs?.lang && window.TipidI18n) {
                        window.TipidI18n.setLanguage(prefs.lang, user.uid);
                    }
                }, () => {}) : () => {};

                return () => {
                    unsubEntries();
                    unsubBudget();
                    unsubBills();
                    unsubUtang();
                    unsubNotif();
                    unsubPrefs();
                };
            }, [dataReady, user]);

            // Wallet Balances derivation
            const walletBalances = React.useMemo(() => {
                return window.TipidCore.walletBalances(entries, baseBalances);
            }, [entries, baseBalances]);

            // Overall balance
            const balanceCentavos = Object.values(walletBalances).reduce((sum, value) => {
                const number = Number(value) || 0;
                return sum + Math.sign(number) * window.TipidCore.toCentavos(Math.abs(number), { allowZero: true });
            }, 0);
            const overallBalance = window.TipidCore.fromCentavos(balanceCentavos);

            // Filter entries by Date Horizon
            const filteredHorizonEntries = React.useMemo(() => {
                const now = new Date();
                let startLimit;
                if (dateRange === "thisWeek") {
                    const day = (now.getDay() + 6) % 7;
                    startLimit = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day).getTime();
                } else if (dateRange === "last30Days") {
                    startLimit = now.getTime() - 30 * 24 * 60 * 60 * 1000;
                } else if (dateRange === "all") {
                    startLimit = 0;
                } else {
                    // thisMonth
                    startLimit = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
                }

                return entries.filter((e) => {
                    const d = window.TipidCore.entryDate(e);
                    return d && d.getTime() >= startLimit;
                });
            }, [entries, dateRange]);

            // Monthly stats
            const monthStats = React.useMemo(() => {
                const now = new Date();
                const lastMonthRef = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                let incomeThisCents = 0, expenseThisCents = 0, incomeLastCents = 0, expenseLastCents = 0;

                entries.forEach((e) => {
                    const d = window.TipidCore.entryDate(e);
                    if (!d) return;
                    let amt = 0;
                    try { amt = window.TipidCore.toCentavos(e.amount, { allowZero: true }); } catch (_) { return; }

                    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) {
                        if (e.type === "income") incomeThisCents += amt;
                        else expenseThisCents += amt;
                    } else if (d.getFullYear() === lastMonthRef.getFullYear() && d.getMonth() === lastMonthRef.getMonth()) {
                        if (e.type === "income") incomeLastCents += amt;
                        else expenseLastCents += amt;
                    }
                });

                const incomeThis = window.TipidCore.fromCentavos(incomeThisCents);
                const expenseThis = window.TipidCore.fromCentavos(expenseThisCents);
                const incomeLast = window.TipidCore.fromCentavos(incomeLastCents);
                const expenseLast = window.TipidCore.fromCentavos(expenseLastCents);
                const net = incomeThis - expenseThis;
                const savingsRate = incomeThis > 0 ? (net / incomeThis) * 100 : 0;

                return { incomeThis, expenseThis, incomeLast, expenseLast, net, savingsRate };
            }, [entries]);

            const handleDeleteEntry = async (id, desc) => {
                const result = await Swal.fire({
                    title: "Delete Entry?",
                    text: `Are you sure you want to delete "${desc}"?`,
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#D64045",
                    cancelButtonColor: "#4A5568",
                    confirmButtonText: "Yes, delete",
                    customClass: { popup: 'tipid-swal' }
                });

                if (result.isConfirmed) {
                    try {
                        await window.TipidData.deleteEntry(user.uid, id);
                        const Toast = Swal.mixin({ toast: true, position: "top-end", showConfirmButton: false, timer: 1500, customClass: { popup: 'tipid-swal text-xs' } });
                        Toast.fire({ icon: "success", title: "Entry deleted" });
                    } catch (err) {
                        Swal.fire({ icon: "error", title: "Error", text: "Could not delete entry.", customClass: { popup: 'tipid-swal' } });
                    }
                }
            };

            const handleEditWallet = async (method, currentBal) => {
                const { value: newBalStr, isConfirmed } = await Swal.fire({
                    title: `Edit ${method} Balance`,
                    input: "number",
                    inputValue: currentBal,
                    inputPlaceholder: "0.00",
                    showCancelButton: true,
                    confirmButtonColor: "#1F6F54",
                    confirmButtonText: "Update",
                    customClass: { popup: 'tipid-swal' }
                });

                if (!isConfirmed) return;

                let targetBal;
                try { targetBal = window.TipidCore.money(newBalStr, { allowZero: true }); }
                catch (_) { return Swal.fire({ icon: "error", title: "Invalid amount", customClass: { popup: 'tipid-swal' } }); }

                const methodEntries = entries.filter((e) => e.method === method);
                const inc = window.TipidCore.sumMoney(methodEntries.filter((e) => e.type === "income").map((e) => e.amount));
                const exp = window.TipidCore.sumMoney(methodEntries.filter((e) => e.type !== "income").map((e) => e.amount));
                const net = inc - exp;

                const newBase = window.TipidCore.fromCentavos(
                    window.TipidCore.toCentavos(targetBal, { allowZero: true }) -
                    window.TipidCore.toCentavos(net, { allowZero: true, allowNegative: true })
                );

                const updated = { ...baseBalances, [method]: newBase };
                setBaseBalances(updated);

                if (window.FirestoreAPI && window.db) {
                    await window.FirestoreAPI.updateDoc(window.FirestoreAPI.doc(window.db, "users", user.uid), {
                        [`wallets.${method}`]: window.TipidCore.money(newBase, { allowZero: true, allowNegative: true })
                    });
                }
            };

            const handleAddWallet = async () => {
                const available = window.SUPPORTED_WALLETS.filter((w) => !Object.keys(baseBalances).includes(w.id));
                const inputOptions = {};
                available.forEach((w) => { inputOptions[w.id] = `${w.name} (${w.type})`; });

                const { value: chosen } = await Swal.fire({
                    title: "Select Wallet / Account",
                    input: "select",
                    inputOptions: inputOptions,
                    showCancelButton: true,
                    confirmButtonColor: "#1F6F54",
                    confirmButtonText: "Next",
                    customClass: { popup: 'tipid-swal' }
                });

                if (chosen) {
                    const { value: initBal } = await Swal.fire({
                        title: `Initial Balance for ${chosen}`,
                        input: "number",
                        inputPlaceholder: "0.00",
                        showCancelButton: true,
                        confirmButtonColor: "#1F6F54",
                        confirmButtonText: "Add Wallet",
                        customClass: { popup: 'tipid-swal' }
                    });

                    let bal = 0;
                    try { bal = window.TipidCore.money(initBal || 0, { allowZero: true }); } catch (_) {}

                    const updated = { ...baseBalances, [chosen]: bal };
                    setBaseBalances(updated);

                    if (window.FirestoreAPI && window.db) {
                        await window.FirestoreAPI.updateDoc(window.FirestoreAPI.doc(window.db, "users", user.uid), {
                            [`wallets.${chosen}`]: bal
                        });
                    }
                }
            };

            const handleOpenBudgetModal = async () => {
                const { value: newBudgetValue, isConfirmed } = await Swal.fire({
                    title: "Set Monthly Budget Limit",
                    input: "number",
                    inputValue: budget || "",
                    inputPlaceholder: "e.g., 15000",
                    showCancelButton: true,
                    confirmButtonColor: "#1F6F54",
                    confirmButtonText: "Save Budget",
                    customClass: { popup: 'tipid-swal' }
                });

                if (isConfirmed) {
                    let b = 0;
                    try { b = window.TipidCore.money(newBudgetValue, { allowZero: true }); }
                    catch (_) { return; }
                    await window.TipidData.setBudget(user.uid, b);
                    setBudgetState(b);
                }
            };

            // Smart SMS Extraction
            const handleSmartSms = async () => {
                const { value: text } = await Swal.fire({
                    title: "🪄 Smart SMS Import",
                    input: "textarea",
                    inputPlaceholder: "Paste SMS from GCash, Maya, or Bank...",
                    showCancelButton: true,
                    confirmButtonColor: "#1F6F54",
                    confirmButtonText: "Extract",
                    customClass: { popup: 'tipid-swal' }
                });

                if (text) {
                    let extractedAmt = "";
                    let extractedDesc = "SMS Transaction";
                    let extractedMethod = "Cash";
                    let extractedType = "expense";

                    const amtMatch = text.match(/(?:PHP|Php|P)\s*([\d,]+(?:\.\d{2})?)/i) || text.match(/([\d,]+\.\d{2})/);
                    if (amtMatch) extractedAmt = (amtMatch[1] || amtMatch[0]).replace(/,/g, '');

                    const lower = text.toLowerCase();
                    if (lower.includes("gcash")) extractedMethod = "GCash";
                    if (lower.includes("maya")) extractedMethod = "Maya";

                    if (lower.includes("received") || lower.includes("sent you") || lower.includes("cash in")) {
                        extractedType = "income";
                    }

                    setIsAddModalOpen(true);
                    setAddModalType(extractedType);
                }
            };

            if (user === undefined || user === null) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-paper dark:bg-ink">
                        <div className="flex flex-col items-center gap-3">
                            <window.Logo size={48} />
                            <p className="text-xs font-mono font-bold tracking-widest uppercase text-ink2/50 dark:text-paper/50">Loading Tipid...</p>
                        </div>
                    </div>
                );
            }

            const firstName = user.displayName ? user.displayName.split(" ")[0] : user.email.split("@")[0];
            const logout = async () => { await window.TipidAuth.logOut(); window.location.href = "login.html"; };

            return (
                <div className="min-h-screen relative pb-28 md:pb-16">
                    {/* BIOMETRIC LOCK SCREEN OVERLAY */}
                    {isLocked && (
                        <div className="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#F1F4EF]/85 dark:bg-[#0E2018]/85 backdrop-blur-2xl p-6 select-none transition-all duration-300">
                            <div className="w-full max-w-sm rounded-[2rem] bg-white/90 dark:bg-[#15231C]/90 backdrop-blur-xl border border-black/5 dark:border-white/10 p-7 sm:p-8 text-center shadow-2xl space-y-5">
                                <div className="relative mx-auto w-20 h-20 rounded-3xl bg-peso/10 dark:bg-pesoLight/15 border border-peso/20 flex items-center justify-center text-peso dark:text-pesoLight shadow-inner">
                                    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className="animate-pulse">
                                        <path d="M4 8V6a2 2 0 0 1 2-2h2" />
                                        <path d="M4 16v2a2 2 0 0 0 2 2h2" />
                                        <path d="M16 4h2a2 2 0 0 1 2 2v2" />
                                        <path d="M16 20h2a2 2 0 0 0 2-2v-2" />
                                        <circle cx="9" cy="10" r="1.2" fill="currentColor" />
                                        <circle cx="15" cy="10" r="1.2" fill="currentColor" />
                                        <path d="M9.5 15a3.5 3.5 0 0 0 5 0" />
                                        <path d="M12 11v2" />
                                    </svg>
                                </div>

                                <div className="space-y-2">
                                    <h2 className="font-display font-bold text-2xl text-ink dark:text-paper tracking-tight">
                                        {isTl ? "Naka-lock ang Tipid" : "Tipid is Locked"}
                                    </h2>
                                    <p className="text-[13px] text-ink2/60 dark:text-paper/60 leading-relaxed">
                                        {isTl
                                            ? "I-verify ang iyong Face ID, Touch ID, o biometric sensor upang buksan ang mga balanse."
                                            : "Authenticate with Face ID, Touch ID, or your biometric sensor to access your balances."}
                                    </p>
                                </div>

                                <div className="space-y-3 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => handleBiometricUnlock()}
                                        disabled={unlocking}
                                        className="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-pesoLight via-peso to-pesoDeep hover:shadow-lg hover:shadow-peso/25 text-white font-bold text-[15px] flex items-center justify-center gap-2.5 transition-all active:scale-[0.98]"
                                    >
                                        {unlocking ? (
                                            <><window.Icons.Loader size={18} className="spin" /> {isTl ? "Kinikilala..." : "Scanning..."}</>
                                        ) : (
                                            <>
                                                <window.Icons.ShieldCheck size={18} />
                                                {isTl ? "Buksan gamit ang Biometrics" : "Unlock with Face ID / Touch ID"}
                                            </>
                                        )}
                                    </button>

                                    {window.TipidBiometrics?.hasPasscode(user.uid) && (
                                        <button
                                            type="button"
                                            onClick={() => setShowPinModal(!showPinModal)}
                                            className="w-full py-3 px-4 rounded-xl bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/15 text-ink dark:text-paper font-semibold text-[13px] transition-all"
                                        >
                                            {showPinModal ? (isTl ? "Isara ang PIN" : "Close PIN") : (isTl ? "Gamitin ang Backup PIN" : "Use Backup PIN")}
                                        </button>
                                    )}

                                    {showPinModal && (
                                        <form onSubmit={handlePinUnlock} className="pt-2 space-y-2.5">
                                            <input
                                                type="password"
                                                inputMode="numeric"
                                                maxLength={6}
                                                autoFocus
                                                value={pinInput}
                                                onChange={e => setPinInput(e.target.value.replace(/\D/g, ''))}
                                                placeholder="••••"
                                                className="w-full text-center py-2.5 px-4 rounded-xl bg-white dark:bg-black/30 border border-line dark:border-white/10 text-xl font-mono tracking-widest text-ink dark:text-paper focus:outline-none focus:ring-2 focus:ring-peso"
                                            />
                                            <button
                                                type="submit"
                                                className="w-full py-2.5 rounded-xl bg-peso text-white text-[13px] font-bold active:scale-98"
                                            >
                                                {isTl ? "I-verify ang PIN" : "Verify PIN"}
                                            </button>
                                        </form>
                                    )}

                                    <button
                                        type="button"
                                        onClick={logout}
                                        className="text-[12px] font-medium text-ink2/50 dark:text-paper/40 hover:underline pt-1"
                                    >
                                        {isTl ? "Mag-log out ng account" : "Log out of account"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className={isLocked ? "filter blur-xl pointer-events-none select-none transition-all duration-300" : "transition-all duration-300"}>
                        <window.Navbar user={user} onLogout={logout} activeTab="home" />
                    {showOnboarding && <window.OnboardingModal uid={user.uid} onComplete={() => setShowOnboarding(false)} />}

                    <main className="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-20 md:pt-8 space-y-7">
                        {/* TOP HEADER & CONTROLS */}
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pt-2">
                            <div>
                                <span className="text-xs font-mono font-bold uppercase tracking-widest text-peso dark:text-pesoLight">
                                    {isTl ? "Sentro ng Pagsubaybay sa Gastos" : "Expenses Tracker Cockpit"}
                                </span>
                                <h1 className="font-display text-2xl sm:text-3xl font-bold text-ink dark:text-paper tracking-tight mt-0.5">
                                    {isTl ? `Magandang araw, ${firstName}.` : `Good day, ${firstName}.`}
                                </h1>
                                <p className="text-xs font-medium text-ink2/50 dark:text-paper/40 mt-1">
                                    {new Date().toLocaleDateString(isTl ? "fil-PH" : "en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })}
                                </p>
                            </div>

                            {/* Horizon Filter & Action Buttons */}
                            <div className="flex flex-wrap items-center gap-2.5">
                                <div className="inline-flex items-center bg-black/5 dark:bg-white/5 p-1 rounded-2xl border border-black/5 dark:border-white/5 text-xs font-semibold">
                                    {[
                                        { id: "thisMonth", label: isTl ? "Ngayong Buwan" : "This Month" },
                                        { id: "thisWeek", label: isTl ? "Ngayong Linggo" : "This Week" },
                                        { id: "last30Days", label: isTl ? "30 Araw" : "30 Days" },
                                        { id: "all", label: isTl ? "Kabuuan" : "All Time" }
                                    ].map((t) => (
                                        <button
                                            key={t.id}
                                            type="button"
                                            onClick={() => setDateRange(t.id)}
                                            className={`px-3 py-1.5 rounded-xl transition-all ${
                                                dateRange === t.id
                                                    ? "bg-white dark:bg-ink text-ink dark:text-paper shadow-sm font-bold"
                                                    : "text-ink2/60 dark:text-paper/50 hover:text-ink dark:hover:text-paper"
                                            }`}
                                        >
                                            {t.label}
                                        </button>
                                    ))}
                                </div>

                                <button
                                    type="button"
                                    onClick={handleSmartSms}
                                    className="p-2 sm:px-3 sm:py-2 rounded-2xl bg-black/5 dark:bg-white/10 hover:bg-black/10 text-xs font-bold text-ink dark:text-paper flex items-center gap-1.5 transition-colors"
                                    title="Auto-Fill via SMS"
                                >
                                    <Icons.Wand size={16} />
                                    <span className="hidden sm:inline">SMS Import</span>
                                </button>

                                <button
                                    type="button"
                                    onClick={() => { setIsAddModalOpen(true); setAddModalType("expense"); }}
                                    className="bg-peso hover:bg-pesoLight text-white px-4 py-2 rounded-2xl text-xs font-bold transition-all shadow-md flex items-center gap-1.5 active:scale-95"
                                >
                                    <Icons.Plus size={16} strokeWidth={2.5} />
                                    <span>Log Transaction</span>
                                </button>
                            </div>
                        </div>

                        {/* 1. TOP BENTO ROW: KEY METRICS */}
                        <div className="fade-up">
                            <KeyFinancialMetrics
                                balance={overallBalance}
                                monthStats={monthStats}
                                budget={budget}
                                user={user}
                                walletBalances={walletBalances}
                                onOpenBudgetModal={handleOpenBudgetModal}
                            />
                        </div>

                        {/* 2. THE MULTI-GRAPH SUITE: SPENDING TRAJECTORY + CATEGORY BREAKDOWN */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 fade-up">
                            <div className="lg:col-span-8">
                                <SpendingTrajectoryChart
                                    entries={filteredHorizonEntries}
                                    dateRange={dateRange}
                                />
                            </div>
                            <div className="lg:col-span-4">
                                <CategoryBreakdownChart
                                    entries={filteredHorizonEntries}
                                />
                            </div>
                        </div>

                        {/* 3. SECONDARY GRAPHS: NEEDS VS WANTS + DAY-OF-WEEK RHYTHM */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6 fade-up">
                            <NeedVsWantCard
                                entries={filteredHorizonEntries}
                            />
                            <DayOfWeekPatternChart
                                entries={filteredHorizonEntries}
                            />
                        </div>

                        {/* 4. ECOSYSTEM OVERVIEW (BILLS, UTANG, TIPID BUDDY) */}
                        <div className="fade-up">
                            <EcosystemOverviewCards
                                bills={bills}
                                utangList={utangList}
                                monthStats={monthStats}
                                budget={budget}
                            />
                        </div>

                        {/* 5. CONNECTED ACCOUNTS & WALLETS RAIL */}
                        <div className="fade-up">
                            <ConnectedWalletsRail
                                baseBalances={baseBalances}
                                walletBalances={walletBalances}
                                onEditWallet={handleEditWallet}
                                onAddWalletClick={handleAddWallet}
                                user={user}
                            />
                        </div>

                        {/* 6. IN-DASHBOARD RECENT ACTIVITY LEDGER */}
                        <div className="fade-up">
                            <RecentTransactionsFeed
                                entries={entries}
                                uid={user.uid}
                                onDeleteEntry={handleDeleteEntry}
                                onOpenAddModal={(type) => { setIsAddModalOpen(true); setAddModalType(type); }}
                            />
                        </div>
                    </main>

                    </div>

                    {/* TRANSACTION MODAL */}
                    <AddTransactionModal
                        open={isAddModalOpen}
                        onClose={() => setIsAddModalOpen(false)}
                        defaultType={addModalType}
                        uid={user.uid}
                        entries={entries}
                        baseBalances={baseBalances}
                        onAdded={() => {}}
                    />
                </div>
            );
        }

        function mountWhenComponentsReady(attempt = 0) {
            const missingNames = [];
            if (typeof window.Navbar !== "function") missingNames.push("Navbar");
            if (missingNames.length === 0) {
                ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
                return;
            }
            if (attempt > 100) {
                document.getElementById("root").innerHTML = `<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Inter,sans-serif;text-align:center;color:#15231C;"><div><p style="font-weight:600;margin-bottom:0.5rem;">Failed to load modules: ${missingNames.join(", ")}</p></div></div>`;
                return;
            }
            setTimeout(() => mountWhenComponentsReady(attempt + 1), 30);
        }

        mountWhenComponentsReady();
    </script>
</body>
</html>
